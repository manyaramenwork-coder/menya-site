  window.ntFile = async function(i){
    const f = (NT.cur && NT.cur.files || [])[i]; if (!f) return;
    const dl = !(/pdf$/i.test(f.type) || isImg(f));
    const w = window.open('', '_blank');
    try { const u = await signed(f.path, f.name, dl); if (w) w.location.href = u; else location.href = u; }
    catch (e) { w && w.close(); toast('파일을 열지 못했어요: ' + e.message); }
  };
  window.ntOpen = async function(id){
    toast('공지를 여는 중이에요...');
    const { data: n, error } = await SB.rpc('notice_open', { p_id: id });
    document.querySelector('.toast')?.remove();
    if (error) { toast(error.message); return loadNotice().then(() => { drawList(); drawDash(); }); }
    NT.cur = n; markRead(id);
    const files = n.files || [], imgs = files.map((f, i) => [f, i]).filter(([f]) => isImg(f));
    const reads = n.reads;
    const done = reads ? reads.filter(r => r.at).length : 0;
    iModal(n.title, `<div class="nt-meta">${n.pinned ? '<span class="nt-pin">필독</span> ' : ''}${h(n.at)} · ${h(n.by)}${n.upd ? ` · ${h(n.upd)} 수정` : ''}</div>
      <div class="nt-body">${fmt(n.body) || '<span style="color:#909b84">본문 없음</span>'}</div>
      ${imgs.length ? `<div class="nt-imgs" id="nt-imgs">${imgs.map(([f, i]) => `<img data-i="${i}" alt="${h(f.name)}" onclick="ntFile(${i})">`).join('')}</div>` : ''}
      ${files.length ? `<div class="nt-files">${files.map((f, i) => `<button class="bi-b" type="button" onclick="ntFile(${i})">${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size || 0)}</small></button>`).join('')}</div>` : ''}
      ${reads ? `<div class="nt-reads"><b>읽음 현황 ${done} / ${reads.length}</b>${reads.map(r => `<div class="${r.at ? '' : 'no'}"><span>${h(r.name)}</span><span>${r.at ? h(r.at) : '안 읽음'}</span></div>`).join('')}</div>` : ''}`,
      closeM, '확인');
    const foot = document.querySelector('#inv-modal .im-foot');
    foot.querySelector('.btn.ghost')?.remove();
    if (n.canEdit) foot.insertAdjacentHTML('afterbegin', `<div class="nt-foot-l"><button class="btn ghost" onclick="ntEdit(${n.id})">수정</button><button class="btn ghost" style="color:#a3262c" onclick="ntDel(${n.id})">삭제</button></div>`);
    imgs.forEach(async ([f, i]) => { try { const u = await signed(f.path); const el = document.querySelector(`#nt-imgs img[data-i="${i}"]`); if (el) el.src = u; } catch (e) {} });
  };

  /* ---------- 공지 작성 · 수정 (관리자·본사, 수정은 작성자 본인 또는 관리자) ---------- */
  let ED = null;
  window.ntEdit = function(id){
    if (!canW()) return toast('공지는 관리자·본사 계정만 쓸 수 있어요.');
    const n = id && NT.cur && NT.cur.id === id ? NT.cur : { title: '', body: '', pinned: false, files: [] };
    ED = { id: id || '', keep: [...(n.files || [])], removed: [], add: [] };
    iModal(id ? '공지 수정' : '공지 작성', `<div class="im-grid">
      <div class="f wide"><label>제목</label><input id="nt-title" maxlength="100" value="${h(n.title)}" placeholder="예) 11월 위생 점검 일정 안내"></div>
      <div class="f wide"><label>본문</label><textarea id="nt-text" class="nt-ta" placeholder="내용을 입력하세요">${h(n.body)}</textarea><div class="bi-help">**굵게** 처럼 별표 두 개로 감싸면 굵게 보여요. 인터넷 주소는 자동으로 링크가 돼요.</div></div>
      <div class="f wide"><label class="bi-chk"><input type="checkbox" id="nt-pin" ${n.pinned ? 'checked' : ''}>필독 공지 (목록·대시보드 맨 위에 고정)</label></div>
      <div class="f wide"><label>첨부 파일 <span>최대 ${MAXF}개 · 개당 10MB · PDF·이미지·엑셀</span></label>
        <input type="file" id="nt-file" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.heic,.xls,.xlsx" onchange="ntAddFiles(this)">
        <div class="nt-flist" id="nt-flist"></div></div>
    </div>`, ntSave, id ? '수정' : '등록');
    drawFiles();
  };
  function drawFiles(){
    const box = document.getElementById('nt-flist'); if (!box) return;
    box.innerHTML = ED.keep.map((f, i) => `<div>${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size || 0)}</small><button type="button" onclick="ntRmFile('keep',${i})">빼기</button></div>`).join('') +
      ED.add.map((f, i) => `<div>${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size)} · 새 파일</small><button type="button" onclick="ntRmFile('add',${i})">빼기</button></div>`).join('');
  }
  window.ntAddFiles = function(inp){
    for (const f of inp.files) {
      if (ED.keep.length + ED.add.length >= MAXF) { toast(`첨부는 ${MAXF}개까지예요.`); break; }
      if (!MIME[ext(f.name)]) { toast(`'${f.name}'은 올릴 수 없는 형식이에요.`); continue; }
      if (f.size > MAXB) { toast(`'${f.name}'이 10MB를 넘어요.`); continue; }
      ED.add.push(f);
    }
    inp.value = ''; drawFiles();
  };
  window.ntRmFile = function(k, i){ if (k === 'keep') ED.removed.push(...ED.keep.splice(i, 1)); else ED.add.splice(i, 1); drawFiles(); };
  const uid4 = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  async function ntSave(){
    const title = document.getElementById('nt-title').value.trim(), body = document.getElementById('nt-text').value.replace(/\s+$/, ''), pinned = document.getElementById('nt-pin').checked;
    if (!title) return toast('제목을 입력해주세요.');
    const btn = document.getElementById('im-save'), lab = btn.textContent;
    btn.disabled = true; btn.textContent = ED.add.length ? '파일 올리는 중...' : '저장 중...';
    const up = [];
    try {
      for (const f of ED.add) {
        const e = ext(f.name), path = `${new Date().getFullYear()}/${uid4()}.${e}`;
        const { error } = await SB.storage.from(BUCKET).upload(path, f, { contentType: f.type || MIME[e], upsert: false });
        if (error) throw new Error(`'${f.name}' 올리기 실패 (${error.message})`);
        up.push({ path, name: f.name, size: f.size, type: f.type || MIME[e] });
      }
      btn.textContent = '저장 중...';
      const { data: nid, error } = await SB.rpc('notice_save', { p: { id: ED.id, title, body, pinned, files: [...ED.keep, ...up] } });
      if (error) throw error;
      if (ED.removed.length) await SB.storage.from(BUCKET).remove(ED.removed.map(f => f.path));
      closeM(); toast(ED.id ? '공지를 수정했어요.' : '공지를 등록했어요.');
      await loadNotice(); drawList(); drawDash();
      if (ED.id) ntOpen(nid);
    } catch (e) {
      if (up.length) SB.storage.from(BUCKET).remove(up.map(f => f.path));
      btn.disabled = false; btn.textContent = lab; toast('저장 실패: ' + (e.message || e));
    }
  }
  window.ntDel = async function(id){
    if (!confirm('이 공지를 삭제할까요? 첨부 파일과 읽음 기록도 함께 지워져요.')) return;
    const { data: files, error } = await SB.rpc('notice_delete', { p_id: id });
    if (error) return toast('삭제 실패: ' + error.message);
    if (files && files.length) await SB.storage.from(BUCKET).remove(files.map(f => f.path));
    closeM(); toast('공지를 삭제했어요.');
    await loadNotice(); drawList(); drawDash();
  };

  /* ---------- 대시보드: 맨 위 '본사 공지' 칸 ---------- */
  function dashHtml(){
    const D = NT.data;
    const rows = !D ? '<div class="ns-empty">불러오는 중...</div>'
      : !D.list.length ? '<div class="ns-empty">등록된 본사 공지가 없어요.</div>'
      : D.list.slice(0, 3).map(n => `<div class="ns-row" role="button" tabindex="0" onclick="ntOpen(${n.id})"><span class="ns-date">${n.at.slice(5)}</span><span class="ns-title">${n.pinned ? '<em class="nt-pin">필독</em>' : ''}<span>${h(n.title)}</span></span><span class="ns-meta">${n.read ? (n.files ? '첨부 ' + n.files : '') : '<b class="ns-new">안 읽음</b>'}</span></div>`).join('');
    return `<section class="notice-strip wide nt-dash" id="nt-dash-box"><div class="ns-h">${ic('bell')}<b>본사 공지</b><a onclick="go('notice')">공지사항 전체 ${ic('arrow')}</a></div>${rows}</section>`;
  }
  function drawDash(){ const b = document.getElementById('nt-dash-box'); if (b) b.outerHTML = dashHtml(); }
  const pageDashboardNt = pageDashboard;
  pageDashboard = function(){
    pageDashboardNt();
    const main = document.getElementById('main'); if (!main || document.getElementById('nt-dash-sec')) return;
    const secs = [...main.querySelectorAll('.dash-sec')];
    const s = document.createElement('section'); s.className = 'dash-sec'; s.id = 'nt-dash-sec';
    s.innerHTML = secHead('1', '본사 공지', { cls: 'hq', t: '본사' }, '필독 고정 · 최근 3건') + dashHtml();
    if (secs.length) {
      secs.forEach(x => { const n = x.querySelector('.sec-n'); if (n && /^\d+$/.test(n.textContent.trim())) n.textContent = +n.textContent + 1; });
      secs[0].before(s);
    } else (main.querySelector('.page-hero') || main.firstChild).after(s);
  };

  // 2분마다 새 공지 확인 (화면이 보일 때만)
  setInterval(() => { if (!document.hidden) loadNotice().then(() => { drawDash(); if (window.__curPage === 'notice' && !document.getElementById('inv-modal')) drawList(); }); }, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadNotice().then(drawDash); });
})();
</script>

<script>
/* ==========================================================
   매뉴얼 관리 (2026-11-03) — 운영매뉴얼 · 조리매뉴얼 · 서류매뉴얼
   - 보기: 모든 계정 / 등록·새 버전·정보 수정: 관리자·본사 / 삭제: 관리자
   - 형식: 운영·조리 = PDF만, 서류 = PDF·한글·워드·엑셀 / 파일당 20MB
   - 새 버전을 올리면 이전 버전은 최근 3개까지만 보관 (그 이전은 자동 삭제)
   - 파일: Supabase Storage 'manual-files' (비공개, 10분짜리 링크로 열기)
   - 관리자 화면에 저장공간 사용량 표시 (무료 플랜 1GB)
   ========================================================== */
(function(){
  PATHS.plus = PATHS.plus || 'M12 5v14 M5 12h14';
  PATHS.layers = 'M12 3 2 8l10 5 10-5z M2 13l10 5 10-5 M2 18l10 5 10-5';
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PAGES = { 'man-ops': ['ops', '운영매뉴얼', 'OPERATION MANUAL', '매장 운영 기준을 담은 매뉴얼이에요. 제목을 누르면 바로 열려요.'],
                  'man-cook': ['cook', '조리매뉴얼', 'RECIPE MANUAL', '메뉴별 조리 기준이에요. 제목을 누르면 바로 열려요.'],
                  'man-doc': ['doc', '서류매뉴얼', 'FORMS · DOCUMENTS', '신청서·양식 등 서류 모음이에요. PDF는 바로 열리고, 한글·워드·엑셀은 내려받아져요.'] };
  const KIND = { ops: '운영매뉴얼', cook: '조리매뉴얼', doc: '서류매뉴얼' };
  const BUCKET = 'manual-files', MAXB = 20 * 1024 * 1024;
  const MIME = { pdf: 'application/pdf', hwp: 'application/x-hwp', hwpx: 'application/haansofthwpx', doc: 'application/msword',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel',
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
  const OK = { ops: ['pdf'], cook: ['pdf'], doc: ['pdf', 'hwp', 'hwpx', 'doc', 'docx', 'xls', 'xlsx'] };
  const ext = n => (String(n).split('.').pop() || '').toLowerCase();
  const kb = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + 'GB' : b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';
  const EXT_LAB = e => ({ pdf: 'PDF', hwp: '한글', hwpx: '한글', doc: '워드', docx: '워드', xls: '엑셀', xlsx: '엑셀' }[e] || e.toUpperCase());
  const MN = { data: null, uid: '', kind: 'ops', f: { q: '', brand: '', sort: 'old' }, cur: null };
  const pubTxt = d => d ? d.replace(/-/g, '.') : '';
  const writer = () => !!(MN.data && MN.data.writer), admin = () => !!(MN.data && MN.data.admin);
  const closeM = () => document.getElementById('inv-modal')?.remove();
  const uid4 = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const brNames = () => ((MN.data && MN.data.brands) || []).filter(b => b.active).map(b => b.name);
  const brSort = list => { const all = ((MN.data && MN.data.brands) || []).map(b => b.name); return [...(list || [])].sort((a, b) => (all.indexOf(a) + 1 || 99) - (all.indexOf(b) + 1 || 99)); };

  /* ---------- 스타일 ---------- */
  const st = document.createElement('style');
  st.textContent = `
  .mn-usage{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:#4a5244}
  .mn-usage b{font-size:13px;color:#2d3726}
  .mn-usage .bar{flex:1 1 220px;height:8px;border-radius:99px;background:#eef0e8;overflow:hidden;margin:0;display:block}
  .mn-usage .bar i{display:block;height:100%;background:#6f8a5a;border-radius:99px}
  .mn-usage .bar i.warn{background:#c9952b}.mn-usage .bar i.over{background:#c62429}
  .mn-usage small{color:#8b9381;font-size:11px}
  .mn-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;border-top:1px solid var(--line);padding:13px 4px}
  .mn-row:first-child{border-top:0}
  .mn-row:hover{background:#fafbf7}
  .mn-ext{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;background:#fbeeee;color:#a3262c}
  .mn-ext.hwp{background:#e9f1fa;color:#2c5a8a}.mn-ext.doc{background:#e8eefb;color:#2f4f9a}.mn-ext.xls{background:#e8f4ec;color:#2b6b41}
  .mn-main{min-width:0;cursor:pointer}
  .mn-t{font-size:14px;font-weight:500;color:#222b1e;display:flex;align-items:center;gap:6px;min-width:0}
  .mn-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-main:hover .mn-t span{color:#c62429;text-decoration:underline;text-underline-offset:3px}
  .mn-d{font-size:12px;color:#7d8574;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-br{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .mn-br em{font-style:normal;font-size:10px;padding:2px 7px;border-radius:5px;background:#f0f2eb;color:#5f6a52}
  .mn-m{font-size:12px;color:#8b9381;white-space:nowrap;text-align:right;line-height:1.6}
  .mn-m b{font-weight:600;color:#4f6b3b}
  .mn-v{flex:none;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:#eef2e5;color:#435833}
  .mn-meta{display:grid;grid-template-columns:70px 1fr;gap:7px 10px;font-size:13px;color:#2d3726;margin-bottom:14px}
  .mn-meta>span:nth-child(odd){color:#8b9381;font-size:12px}
  .mn-open{width:100%;justify-content:center;padding:11px;font-size:13px}
  .mn-olds{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .mn-olds b{display:block;font-size:13px;color:#2d3726;margin-bottom:8px}
  .mn-olds button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#f6f7f3;border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:12px;color:#3f4839;cursor:pointer;text-align:left}
  .mn-olds button:hover{background:#eef0e8}
  .mn-olds button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-olds small{color:#8b9381}
  .mn-pick{display:flex;align-items:center;gap:8px;font-size:13px;color:#3f4839;background:#f6f7f3;border-radius:8px;padding:9px 11px;margin-top:6px}
  .mn-pick span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn-pick small{color:#8b9381}
  .mn-pub{font-size:12px;color:#4f6b3b;margin-top:3px;font-weight:500}
  .mn-sort{margin-left:auto;display:flex;gap:4px}
  #mn-add{display:flex;gap:6px}
  .mn-foot-l{margin-right:auto;display:flex;gap:6px;flex-wrap:wrap}
  @media(max-width:640px){.mn-row{grid-template-columns:38px minmax(0,1fr) auto}.mn-m{grid-column:2;text-align:left}.mn-row .bi-b{grid-row:1;grid-column:3}}`;
  document.head.appendChild(st);

  /* ---------- 데이터 ---------- */
  async function load(){
    if (!SESSION.user || SESSION.mustChange || !window.SB) return null;
    if (MN.uid !== SESSION.user.uid) { MN.uid = SESSION.user.uid; MN.data = null; }
    const { data, error } = await SB.rpc('manual_data');
    if (error) { console.warn('매뉴얼 불러오기 실패', error); return null; }
    MN.data = data; return data;
  }

  /* ---------- 메뉴: '매뉴얼 관리' (준비중 → 사용) ---------- */
  const renderSideMn = renderSide;
  renderSide = function(active){
    renderSideMn(active);
    const nav = document.querySelector('#side .nav-items'); if (!nav) return;
    nav.querySelectorAll('.js-mn-menu').forEach(e => e.remove());
    const open = !!PAGES[active];
    const html = `<button class="cat js-mn-menu ${open ? 'open' : ''}" onclick="const on=this.classList.toggle('open');this.nextElementSibling.classList.toggle('open',on)">${ic('book')}매뉴얼 관리${ic('chevron').replace('class="icon"', 'class="icon ar"')}</button><div class="sub js-mn-menu ${open ? 'open' : ''}">${Object.entries(PAGES).map(([k, v]) => `<a role="button" tabindex="0" class="${k === active ? 'on' : ''}" onclick="go('${k}')">${v[1]}</a>`).join('')}</div>`;
    const soon = nav.querySelector('.nav-soon-label');
    if (soon) soon.insertAdjacentHTML('beforebegin', html); else nav.insertAdjacentHTML('beforeend', html);
  };
  const goMn = go;
  go = function(p, t){
    if (p === 'soon' && t === '매뉴얼 관리') p = 'man-ops';
    if (PAGES[p]) {
      document.getElementById('nt-pop')?.remove();
      closeSide(); renderSide(p); window.__curPage = p; MN.kind = PAGES[p][0]; pageManual(p); window.scrollTo(0, 0); return;
    }
    return goMn(p, t);
  };

  /* ---------- 목록 화면 ---------- */
  function pageManual(p){
    const [, title, eye, desc] = PAGES[p];
    document.getElementById('main').innerHTML = simpleHero(['매뉴얼 관리', title], eye, title, desc) +
      `<section class="card" id="mn-usage-card" style="display:none"></section>
      <section class="card"><div class="bi-bar"><div class="bi-top"><input type="text" id="mn-q" placeholder="제목으로 찾기" value="${h(MN.f.q)}" oninput="mnQ(this.value)"><span id="mn-add"></span></div>
      <div class="bi-row" id="mn-chips"></div></div><div class="bi-cnt" id="mn-cnt"></div><div id="mn-list"><div class="bi-empty">불러오는 중...</div></div></section>` + pageFoot();
    if (MN.data) draw();
    load().then(d => { if (window.__curPage !== p) return; d ? draw() : (document.getElementById('mn-list').innerHTML = '<div class="bi-empty">매뉴얼을 불러오지 못했어요. 새로고침해 주세요.</div>'); });
  }
  let qT = 0;
  window.mnQ = v => { clearTimeout(qT); qT = setTimeout(() => { MN.f.q = v.trim(); draw(); }, 200); };
  window.mnBr = v => { MN.f.brand = v; draw(); };
  window.mnSort = v => { MN.f.sort = v; draw(); };
  function drawUsage(){
    const c = document.getElementById('mn-usage-card'); if (!c) return;
    const u = MN.data && MN.data.usage; if (!u) { c.style.display = 'none'; return; }
    const pct = Math.min(100, u.total / u.limit * 100);
    c.style.display = '';
    c.innerHTML = `<div class="mn-usage">${ic('layers')}<span>저장공간 <b>${kb(u.total)}</b> / ${kb(u.limit)}</span>
      <span class="bar"><i class="${pct >= 90 ? 'over' : pct >= 70 ? 'warn' : ''}" style="width:${Math.max(pct, 0.5)}%"></i></span>
      <small>매뉴얼 ${kb(u.manual)} · 공지 첨부 ${kb(u.notice)} · 상신 첨부 ${kb(u.approval || 0)} · 관리자만 보여요</small></div>`;
  }
  function draw(){
    const box = document.getElementById('mn-list'); if (!box || !MN.data) return;
    drawUsage();
    document.getElementById('mn-add').innerHTML = (MN.kind === 'doc' && window.apNew ? `<button class="btn ghost" onclick="apNew()">${ic('stamp')}작성해서 상신</button> ` : '') + (writer() ? `<button class="btn" onclick="mnEdit()">${ic('plus')}${MN.kind === 'doc' ? '서류 등록' : '매뉴얼 등록'}</button>` : '');
    const names = brNames();
    if (MN.f.brand && !names.includes(MN.f.brand)) MN.f.brand = '';
    document.getElementById('mn-chips').innerHTML = `<span>소속</span>` + [['', '전체'], ...names.map(x => [x, x])]
      .map(([v, t]) => `<button class="bi-c ${MN.f.brand === v ? 'on' : ''}" onclick="mnBr('${h(v)}')">${h(t)}</button>`).join('')
      + `<span class="mn-sort">${[['old', '오래된 순'], ['new', '최신 순']].map(([v, t]) => `<button class="bi-c ${MN.f.sort === v ? 'on' : ''}" onclick="mnSort('${v}')">${t}</button>`).join('')}</span>`;
    const q = MN.f.q.toLowerCase();
    const all = MN.data.list.filter(m => m.kind === MN.kind);
    const dir = MN.f.sort === 'new' ? -1 : 1;
    const list = all.filter(m => (!q || m.title.toLowerCase().includes(q)) && (!MN.f.brand || m.brands.includes(MN.f.brand)))
      .sort((a, b) => (!a.pub - !b.pub) || (a.pub && b.pub && a.pub !== b.pub ? (a.pub < b.pub ? -dir : dir) : 0) || a.title.localeCompare(b.title, 'ko'));
    document.getElementById('mn-cnt').textContent = `${list.length}건`;
    box.innerHTML = list.length ? `<div class="bi-list">${list.map(m => {
        const e = ext(m.name), cls = { hwp: 'hwp', hwpx: 'hwp', doc: 'doc', docx: 'doc', xls: 'xls', xlsx: 'xls' }[e] || '';
        return `<div class="mn-row"><span class="mn-ext ${cls}">${EXT_LAB(e)}</span>
        <div class="mn-main" role="button" tabindex="0" onclick="mnView(${m.id})" onkeydown="if(event.key==='Enter')mnView(${m.id})">
          <div class="mn-t"><span>${h(m.title)}</span><em class="mn-v">v${m.version}</em></div>
          ${m.pub ? `<div class="mn-pub">발행 ${pubTxt(m.pub)}</div>` : ''}
          ${m.descr ? `<div class="mn-d">${h(m.descr)}</div>` : ''}
          <div class="mn-br">${brSort(m.brands).map(b => `<em>${h(b)}</em>`).join('')}</div></div>
        <div class="mn-m">${m.at} 수정<br>${kb(m.size)}</div>
        <button class="bi-b" type="button" onclick="mnInfo(${m.id})">${writer() ? '관리' : '정보'}</button></div>`; }).join('')}</div>`
      : `<div class="bi-empty">${all.length ? '조건에 맞는 항목이 없어요.' : `등록된 ${KIND[MN.kind]}이 없어요.` + (writer() ? '<br>위의 등록 버튼으로 첫 파일을 올려보세요.' : '')}</div>`;
  }

  /* ---------- 열기 (PDF는 새 창, 그 외는 내려받기) ---------- */
  async function openFile(f){
    if (!f) return;
    const dl = ext(f.name) !== 'pdf';
    const w = dl ? null : window.open('', '_blank');
    try {
      const { data, error } = await SB.storage.from(BUCKET).createSignedUrl(f.path, 600, dl ? { download: f.name } : undefined);
      if (error) throw error;
      if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
    } catch (e) { w && w.close(); toast('파일을 열지 못했어요: ' + (e.message || e)); }
  }
  async function getOne(id){
    const { data, error } = await SB.rpc('manual_open', { p_id: id });
    if (error) { toast(error.message); await load(); draw(); return null; }
    return data;
  }
  window.mnView = async function(id){ const m = await getOne(id); if (m) openFile(m.file); };
  window.mnOld = i => openFile(MN.cur && MN.cur.olds[i] && MN.cur.olds[i].file);

  /* ---------- 정보 · 관리 ---------- */
  window.mnInfo = async function(id){
    const m = await getOne(id); if (!m) return;
    MN.cur = m;
    const isPdf = ext(m.file.name) === 'pdf';
    iModal(m.title, `<div class="mn-meta">
        <span>분류</span><span>${KIND[m.kind]}</span>
        <span>소속</span><span>${brSort(m.brands).map(h).join(', ')}</span>
        <span>발행일</span><span>${m.pub ? pubTxt(m.pub) : '<span style="color:#9aa38f">미입력</span>'}</span>
        <span>현재 버전</span><span>v${m.version} · ${h(m.at)} · ${h(m.by)}</span>
        <span>파일</span><span>${h(m.file.name)} (${kb(m.file.size || 0)})</span>
        <span>처음 등록</span><span>${h(m.made)}</span>
        ${m.descr ? `<span>설명</span><span style="white-space:pre-wrap">${h(m.descr)}</span>` : ''}
      </div>
      <button class="bi-b mn-open" type="button" onclick="mnView(${m.id})">${ic(isPdf ? 'file' : 'download')}${isPdf ? '열기' : '내려받기'}</button>
      ${m.kind === 'doc' && window.apNew ? `<button class="bi-b mn-open" type="button" style="margin-top:6px" onclick="apNew(${m.id})">${ic('stamp')}이 양식으로 상신</button>` : ''}
      ${m.olds.length ? `<div class="mn-olds"><b>이전 버전 (최근 3개까지 보관)</b>${m.olds.map((o, i) => `<button type="button" onclick="mnOld(${i})"><em class="mn-v">v${o.version}</em><span>${h(o.file.name)}</span><small>${h(o.at)} · ${h(o.by)}</small></button>`).join('')}</div>` : ''}`,
      closeM, '닫기');
    const foot = document.querySelector('#inv-modal .im-foot');
    foot.querySelector('.btn.ghost')?.remove();
    if (writer()) foot.insertAdjacentHTML('afterbegin', `<div class="mn-foot-l"><button class="btn ghost" onclick="mnEdit(${m.id},true)">새 버전 올리기</button><button class="btn ghost" onclick="mnEdit(${m.id})">정보 수정</button>${admin() ? `<button class="btn ghost" style="color:#a3262c" onclick="mnDel(${m.id})">삭제</button>` : ''}</div>`);
  };

  /* ---------- 등록 · 정보 수정 · 새 버전 ---------- */
  let ED = null;
  window.mnEdit = function(id, newVer){
    if (!writer()) return toast('관리자·본사 계정만 올릴 수 있어요.');
    const m = id && MN.cur && MN.cur.id === id ? MN.cur : { kind: MN.kind, title: '', brands: [], descr: '', pub: '' };
    ED = { id: id || '', newVer: !!newVer, file: null, kind: m.kind };
    const names = brNames(), list = [...names, ...m.brands.filter(x => !names.includes(x))];
    const fileF = `<div class="f wide"><label>${id ? '새 파일' : '파일'} <span id="mn-fhelp"></span></label>
        <input type="file" id="mn-file" onchange="mnPick(this)"><div id="mn-pick"></div>
        ${id ? `<div class="bi-help">올리면 v${MN.cur.version + 1}이 되고, 지금 파일(v${MN.cur.version})은 이전 버전으로 보관돼요. 이전 버전은 최근 3개까지만 남아요.</div>` : ''}</div>`;
    const infoF = `<div class="f wide"><label>제목</label><input id="mn-title" maxlength="100" value="${h(m.title)}" placeholder="예) 오픈·마감 체크리스트"></div>
      <div class="f"><label>발행일 <span>목록이 이 날짜 순서로 정렬돼요</span></label><input type="date" id="mn-pub" value="${h(m.pub || '')}"></div>
      <div class="f"><label>분류</label><select id="mn-kind" onchange="mnKind(this.value)">${Object.entries(KIND).map(([k, t]) => `<option value="${k}" ${k === m.kind ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="f wide"><label>소속 <span>여러 개 고를 수 있어요</span></label><div class="bi-brs">${list.map(n => `<label class="bi-chk"><input type="checkbox" name="mn-br" value="${h(n)}" ${m.brands.includes(n) ? 'checked' : ''}>${h(n)}</label>`).join('')}</div></div>
      <div class="f wide"><label>설명 <span>선택 · 500자 이내</span></label><textarea id="mn-descr" maxlength="500" placeholder="예) 2026년 11월 개정 — 마감 청소 항목 추가">${h(m.descr)}</textarea></div>`;
    iModal(newVer ? `새 버전 올리기 · ${m.title}` : id ? '정보 수정' : (MN.kind === 'doc' ? '서류 등록' : '매뉴얼 등록'),
      `<div class="im-grid">${newVer ? fileF : id ? infoF : infoF + fileF}</div>`, save, newVer ? '올리기' : id ? '수정' : '등록');
    mnKind(m.kind);
  };
  window.mnKind = function(k){
    ED.kind = k;
    const hp = document.getElementById('mn-fhelp'), inp = document.getElementById('mn-file');
    if (hp) hp.textContent = (k === 'doc' ? 'PDF·한글·워드·엑셀' : 'PDF만') + ' · 20MB 이하';
    if (inp) inp.accept = OK[k].map(e => '.' + e).join(',');
    if (ED.file && !OK[k].includes(ext(ED.file.name))) { ED.file = null; drawPick(); toast('고른 파일이 이 분류에 맞지 않아 뺐어요.'); }
  };
  function drawPick(){
    const b = document.getElementById('mn-pick'); if (!b) return;
    b.innerHTML = ED.file ? `<div class="mn-pick">${ic('file')}<span>${h(ED.file.name)}</span><small>${kb(ED.file.size)}</small></div>` : '';
  }
  window.mnPick = function(inp){
    const f = inp.files[0]; inp.value = '';
    if (!f) return;
    if (!OK[ED.kind].includes(ext(f.name))) return toast(ED.kind === 'doc' ? 'PDF·한글·워드·엑셀 파일만 올릴 수 있어요.' : '운영·조리 매뉴얼은 PDF만 올릴 수 있어요.');
    if (f.size > MAXB) return toast(`'${f.name}'이 20MB를 넘어요. PDF 용량을 줄여서 올려주세요.`);
    ED.file = f; drawPick();
  };
  async function save(){
    const cur = ED.id ? MN.cur : null;
    const p = ED.newVer
      ? { id: ED.id, kind: cur.kind, title: cur.title, brands: cur.brands, descr: cur.descr, pub: cur.pub || '' }
      : { id: ED.id, kind: document.getElementById('mn-kind').value, title: document.getElementById('mn-title').value.trim(),
          brands: [...document.querySelectorAll('input[name=mn-br]:checked')].map(i => i.value), descr: document.getElementById('mn-descr').value.trim(),
          pub: document.getElementById('mn-pub').value };
    if (!p.title) return toast('제목을 입력해주세요.');
    if (!p.brands.length) return toast('소속을 하나 이상 골라주세요.');
    const needFile = !ED.id || ED.newVer;
    if (needFile && !ED.file) return toast('파일을 골라주세요.');
    const btn = document.getElementById('im-save'), lab = btn.textContent;
    btn.disabled = true; btn.textContent = ED.file ? '파일 올리는 중...' : '저장 중...';
    let up = null;
    try {
      if (ED.file) {
        const e = ext(ED.file.name), path = `${p.kind}/${uid4()}.${e}`;
        const { error } = await SB.storage.from(BUCKET).upload(path, ED.file, { contentType: ED.file.type || MIME[e], upsert: false });
        if (error) throw new Error(`파일 올리기 실패 (${error.message})`);
        up = { path, name: ED.file.name, size: ED.file.size, type: ED.file.type || MIME[e] };
        p.file = up;
      }
      btn.textContent = '저장 중...';
      const { data: r, error } = await SB.rpc('manual_save', { p });
      if (error) throw error;
      if (r.removed && r.removed.length) await SB.storage.from(BUCKET).remove(r.removed.map(f => f.path));
      closeM(); toast(ED.newVer ? '새 버전을 올렸어요.' : ED.id ? '정보를 수정했어요.' : '등록했어요.');
      await load(); draw();
      if (ED.id) mnInfo(r.id);
    } catch (e) {
      if (up) SB.storage.from(BUCKET).remove([up.path]);
      btn.disabled = false; btn.textContent = lab; toast('저장 실패: ' + (e.message || e));
    }
  }
  window.mnDel = async function(id){
    if (!confirm('이 항목을 삭제할까요? 이전 버전 파일까지 모두 지워지고 되돌릴 수 없어요.')) return;
    const { data: files, error } = await SB.rpc('manual_delete', { p_id: id });
    if (error) return toast('삭제 실패: ' + error.message);
    if (files && files.length) await SB.storage.from(BUCKET).remove(files.map(f => f.path));
    closeM(); toast('삭제했어요.');
    await load(); draw();
  };
})();
</script>

<script>
/* ==========================================================
   상신·결재 (2026-11-03, 11-04 결재라인) — 순서대로 결재 + 참조
   - 상신: 모든 계정 (서류매뉴얼의 양식을 내려받아 작성 → 첨부해서 상신)
   - 결재라인: 관리자·본사 계정 중 최대 5명, 순서대로 승인 / 누구든 반려하면 반려로 끝 → 고쳐서 다시 상신하면 1번부터
   - 참조: 모든 계정 중 최대 10명, 처리 없이 열람만 (참조함)
   - 취소·수정: 아무도 승인하기 전까지만 / 결재라인 없는 예전 상신은 관리자가 처리
   - 첨부: Supabase Storage 'approval-files' (비공개, 상신자·관리자·결재라인·참조만 열람, 5개·개당 20MB)
   - 알림: 상단 🔔 — 내 결재 차례, 새 참조, 내 상신 결과
   ========================================================== */
(function(){
  PATHS.stamp = 'M9 3h6l-1 7h3a2 2 0 0 1 2 2v3H5v-3a2 2 0 0 1 2-2h3z M4 21h16 M6 18h12';
  PATHS.plus = PATHS.plus || 'M12 5v14 M5 12h14';
  PATHS.clip = PATHS.clip || 'M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6';
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AP = { data: null, uid: '', f: { q: '', st: '' }, cur: null };
  const PAGES = { 'ap-mine': '내 상신함', 'ap-box': '결재함', 'ap-cc': '참조함' };
  const canBox = () => !!(SESSION.user && (SESSION.user.role === 'admin' || SESSION.user.role === 'hq'));
  const MAXL = 5, MAXC = 10;
  const ST = { wait: ['대기', 'w'], ok: ['승인', 'o'], no: ['반려', 'n'], hold: ['보류', 'h'] };
  const BUCKET = 'approval-files', MAXF = 5, MAXB = 20 * 1024 * 1024;
  const MIME = { pdf: 'application/pdf', hwp: 'application/x-hwp', hwpx: 'application/haansofthwpx', doc: 'application/msword',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel',
    xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', heic: 'image/heic' };
  const ext = n => (String(n).split('.').pop() || '').toLowerCase();
  const kb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB';
  const adm = () => !!(AP.data && AP.data.admin);
  const closeM = () => document.getElementById('inv-modal')?.remove();
  const uid4 = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  const chip = s => `<em class="ap-st ${ST[s][1]}">${ST[s][0]}</em>`;
  const pName = p => p ? `${p.name}${p.title ? ' ' + p.title : ''}` : '';
  // 목록용 진행 상황: '김영환 승인 → 대표 대기'
  function progress(a){
    const L = a.line || [];
    if (!L.length) return a.status === 'wait' ? '관리자 결재 대기' : '';
    if (a.status === 'wait') {
      const done = L.filter(x => x.act === 'ok').map(x => x.name + ' 승인');
      return [...done, L[a.step].name + ' 대기'].join(' → ');
    }
    if (a.status === 'no') { const n = L.find(x => x.act === 'no'); return n ? n.name + ' 반려' : ''; }
    if (a.status === 'hold') { const n = L.find(x => x.act === 'hold'); return (n ? n.name + ' 보류' : '보류') + ' · 수정 후 다시 상신'; }
    return '최종 승인 · ' + L[L.length - 1].name;
  }

  const st = document.createElement('style');
  st.textContent = `
  .ap-st{flex:none;font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
  .ap-st.w{background:#fbf3e2;color:#8a6417}.ap-st.o{background:#e8f1e1;color:#3b6420}.ap-st.n{background:#fbeeee;color:#a3262c}.ap-st.h{background:#fdeedd;color:#b25b0e}
  .ap-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border-top:1px solid var(--line);padding:13px 4px;cursor:pointer}
  .ap-row:first-child{border-top:0}.ap-row:hover{background:#fafbf7}
  .ap-row .t{font-size:14px;font-weight:500;color:#222b1e;display:flex;align-items:center;gap:6px;min-width:0}
  .ap-row .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ap-row .t i{flex:none;width:7px;height:7px;border-radius:50%;background:#c62429}
  .ap-row .s{grid-column:2;font-size:12px;color:#8b9381;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ap-row .m{grid-row:1/3;grid-column:3;font-size:12px;color:#8b9381;text-align:right;white-space:nowrap;line-height:1.6}
  .ap-meta{display:grid;grid-template-columns:70px 1fr;gap:7px 10px;font-size:13px;color:#2d3726;margin-bottom:12px}
  .ap-meta>span:nth-child(odd){color:#8b9381;font-size:12px}
  .ap-memo{font-size:14px;line-height:1.7;color:#2d3726;white-space:pre-wrap;word-break:break-word;background:#f8f9f5;border-radius:8px;padding:10px 12px}
  .ap-reason.hold{background:#fdf1e4;color:#7a3f0a}
  .ap-reason{margin-top:12px;background:#fbeeee;color:#7c1f24;border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap}
  .ap-reason b{display:block;font-size:12px;margin-bottom:3px}
  .ap-files{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .ap-files .bi-b{justify-content:flex-start;padding:9px 12px;font-size:13px;white-space:normal;text-align:left}
  .ap-files .bi-b small{margin-left:auto;color:#8b9381;font-size:11px}
  .ap-tl{margin:4px 0 14px;padding:12px;background:#f7f8f4;border-radius:10px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
  .ap-tl>b{font-size:13px;color:#2d3726}
  .ap-tl .bb{max-width:86%;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.55;background:#fff;border:1px solid #e6e8e0;color:#2d3726}
  .ap-tl .bb.me{align-self:flex-start;border-top-left-radius:3px}
  .ap-tl .bb.ap{align-self:flex-end;border-top-right-radius:3px}
  .ap-tl .bb.ok{background:#eef5e8;border-color:#d5e5c8}.ap-tl .bb.hold{background:#fdf1e4;border-color:#f3d8b8}.ap-tl .bb.no{background:#fbeeee;border-color:#efd1d1}
  .ap-tl .hd{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:11px;color:#7d8574;margin-bottom:2px}
  .ap-tl .hd b{font-size:12px;color:#2d3726}.ap-tl .hd em{font-style:normal;font-weight:600}
  .ap-tl .tx{white-space:pre-wrap;word-break:break-word}

  document.head.appendChild(st);

  /* ---------- 데이터 · 알림 ---------- */
  async function load(){
    if (!SESSION.user || SESSION.mustChange || !window.SB) return null;
    if (AP.uid !== SESSION.user.uid) { AP.uid = SESSION.user.uid; AP.data = null; }
    const { data, error } = await SB.rpc('appr_data');
    if (error) { console.warn('상신 불러오기 실패', error); return null; }
    AP.data = data; window.ntBell && window.ntBell(); drawSideBadge(); return data;
  }
  window.apLoad = load;
  window.apAlert = function(){
    const D = AP.data; if (!D) return { count: 0, html: '' };
    const res = D.mine.filter(a => a.status !== 'wait' && !a.seen).slice(0, 5);
    const wait = D.wait || 0, ccn = D.ccnew || 0;
    const html = (wait ? `<button class="ap-it" type="button" onclick="document.getElementById('nt-pop').remove();go('ap-box')"><span class="dot"></span><span class="t">결재 차례 ${wait}건</span><span class="s">결재함에서 승인·반려해 주세요</span></button>` : '') +
      (ccn ? `<button class="ap-it" type="button" onclick="document.getElementById('nt-pop').remove();go('ap-cc')"><span class="dot" style="background:#3b5ba5"></span><span class="t">새 참조 ${ccn}건</span><span class="s">참조함에서 확인해 주세요</span></button>` : '') +
      res.map(a => `<button class="ap-it" type="button" onclick="document.getElementById('nt-pop').remove();apOpen(${a.id})"><span class="dot" style="background:${a.status === 'ok' ? '#5d8a3d' : a.status === 'hold' ? '#d9771f' : '#c62429'}"></span><span class="t">상신 ${ST[a.status][0]} · ${h(a.title)}</span><span class="s">${a.done}</span></button>`).join('');
    return { count: wait + ccn + D.results, html };
  };
  function drawSideBadge(){
    const b = document.querySelector('#side .js-ap-menu'); if (!b) return;
    b.querySelector('.nt-badge')?.remove();
    const n = AP.data ? (AP.data.wait || 0) + (AP.data.ccnew || 0) + AP.data.results : 0;
    if (n) b.querySelector('.icon.ar')?.insertAdjacentHTML('beforebegin', `<span class="nt-badge">${n > 99 ? '99+' : n}</span>`);
    // 하위 메뉴별 숫자: 결재함(내 차례) · 참조함(새 참조) · 내 상신함(결과 안 본 것)
    const per = { 'ap-box': AP.data ? AP.data.wait || 0 : 0, 'ap-cc': AP.data ? AP.data.ccnew || 0 : 0, 'ap-mine': AP.data ? AP.data.results || 0 : 0 };
    document.querySelectorAll('#side .sub.js-ap-menu a').forEach(a => {
      a.querySelector('.nt-badge')?.remove();
      const k = ((a.getAttribute('onclick') || '').match(/go\('([^']+)'\)/) || [])[1], c = per[k] || 0;
      if (c) a.insertAdjacentHTML('beforeend', `<span class="nt-badge mm-sub-badge">${c > 99 ? '99+' : c}</span>`);
    });
  }

  /* ---------- 메뉴 ---------- */
  const renderSideAp = renderSide;
  renderSide = function(active){
    renderSideAp(active);
    const nav = document.querySelector('#side .nav-items'); if (!nav) return;
    nav.querySelectorAll('.js-ap-menu').forEach(e => e.remove());
    const open = !!PAGES[active];
    const items = Object.entries(PAGES).filter(([k]) => k !== 'ap-box' || canBox());
    const html = `<button class="cat js-ap-menu ${open ? 'open' : ''}" onclick="const on=this.classList.toggle('open');this.nextElementSibling.classList.toggle('open',on)">${ic('stamp')}상신·결재${ic('chevron').replace('class="icon"', 'class="icon ar"')}</button><div class="sub js-ap-menu ${open ? 'open' : ''}">${items.map(([k, t]) => `<a role="button" tabindex="0" class="${k === active ? 'on' : ''}" onclick="go('${k}')">${t}</a>`).join('')}</div>`;
    const soon = nav.querySelector('.nav-soon-label');
    if (soon) soon.insertAdjacentHTML('beforebegin', html); else nav.insertAdjacentHTML('beforeend', html);
    drawSideBadge();
  };
  const goAp = go;
  go = function(p, t){
    if (PAGES[p]) {
      if (p === 'ap-box' && !canBox()) { toast('결재함은 관리자·본사 계정만 볼 수 있어요.'); p = 'ap-mine'; }
      document.getElementById('nt-pop')?.remove();
      closeSide(); renderSide(p); window.__curPage = p; AP.f.st = p === 'ap-box' ? 'turn' : ''; page(p); window.scrollTo(0, 0); return;
    }
    const r = goAp(p, t);
    if (!AP.data || AP.uid !== (SESSION.user && SESSION.user.uid)) load();
    return r;
  };

  /* ---------- 목록 ---------- */
  function page(p){
    const box = p === 'ap-box', cc = p === 'ap-cc';
    document.getElementById('main').innerHTML = simpleHero(['상신·결재', PAGES[p]], box ? 'APPROVAL BOX' : cc ? 'CC' : 'MY REQUESTS', PAGES[p],
      box ? '나를 결재라인에 넣은 상신이에요. 내 차례가 되면 열어서 승인하거나 사유를 적어 반려하세요.'
      : cc ? '참조로 받은 상신이에요. 처리할 일 없이 내용만 확인하면 돼요.'
      : '내가 올린 상신이에요. 반려되면 고쳐서 다시 올릴 수 있어요.') +
      `<section class="card"><div class="bi-bar"><div class="bi-top"><input type="text" id="ap-q" placeholder="제목으로 찾기" value="${h(AP.f.q)}" oninput="apQ(this.value)">${box || cc ? '' : `<button class="btn" onclick="apNew()">${ic('plus')}새 상신</button>`}</div>
      <div class="bi-row" id="ap-chips"></div></div><div class="bi-cnt" id="ap-cnt"></div><div id="ap-list"><div class="bi-empty">불러오는 중...</div></div></section>` + pageFoot();
    if (AP.data) draw();
    load().then(d => { if (window.__curPage !== p) return; d ? draw() : (document.getElementById('ap-list').innerHTML = '<div class="bi-empty">불러오지 못했어요. 새로고침해 주세요.</div>'); });
  }
  let qT = 0;
  window.apQ = v => { clearTimeout(qT); qT = setTimeout(() => { AP.f.q = v.trim(); draw(); }, 200); };
  window.apSt = v => { AP.f.st = v; draw(); };
  function draw(){
    const el = document.getElementById('ap-list'); if (!el || !AP.data) return;
    const box = window.__curPage === 'ap-box', cc = window.__curPage === 'ap-cc';
    const all = (box ? AP.data.box : cc ? AP.data.ccbox : AP.data.mine) || [], q = AP.f.q.toLowerCase();
    const cnt = s => all.filter(a => a.status === s).length;
    document.getElementById('ap-chips').innerHTML = [...(box ? [['turn', `내 차례 ${all.filter(a => a.turn).length}`]] : []), ['', '전체'], ['wait', `대기 ${cnt('wait')}`], ['ok', '승인'], ['hold', '보류'], ['no', '반려']]
      .map(([v, t]) => `<button class="bi-c ${AP.f.st === v ? 'on' : ''}" onclick="apSt('${v}')">${t}</button>`).join('');
    const list = all.filter(a => (!AP.f.st || (AP.f.st === 'turn' ? a.turn : a.status === AP.f.st)) && (!q || a.title.toLowerCase().includes(q)));
    document.getElementById('ap-cnt').textContent = `${list.length}건`;
    el.innerHTML = list.length ? `<div class="bi-list">${list.map(a => `<div class="ap-row" role="button" tabindex="0" onclick="apOpen(${a.id})">
        ${chip(a.status)}<div class="t">${(box && a.turn) || (cc && !a.ccSeen) || (!box && !cc && a.status !== 'wait' && !a.seen) ? `<i title="${box ? '내 차례' : cc ? '새 참조' : '새 결과'}"></i>` : ''}<span>${h(a.title)}</span></div>
        <div class="s">${box || cc ? h(a.who) + ' · ' : ''}${h(progress(a)) || (a.form ? h(a.form) : '양식 없음')}${a.files ? ` · 첨부 ${a.files}` : ''}</div>
        <div class="m">${a.at.slice(0, 10)} 상신${a.done ? `<br>${a.done.slice(0, 10)} ${ST[a.status][0]}` : ''}</div></div>`).join('')}</div>`
      : `<div class="bi-empty">${all.length ? '조건에 맞는 상신이 없어요.' : box ? '들어온 상신이 없어요.' : cc ? '참조로 받은 상신이 없어요.' : '올린 상신이 없어요.<br>[새 상신]이나 서류매뉴얼의 [작성해서 상신]으로 올려보세요.'}</div>`;
  }

  /* ---------- 보기 ---------- */
  window.apFile = async function(i){
    const f = (AP.cur && AP.cur.filelist || [])[i]; if (!f) return;
    const dl = !/^(pdf|jpe?g|png)$/.test(ext(f.name));
    const w = dl ? null : window.open('', '_blank');
    try {
      const { data, error } = await SB.storage.from(BUCKET).createSignedUrl(f.path, 600, dl ? { download: f.name } : undefined);
      if (error) throw error;
      if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
    } catch (e) { w && w.close(); toast('파일을 열지 못했어요: ' + (e.message || e)); }
  };
  // 진행 기록: 상신자(왼쪽) · 결재자(오른쪽) 말풍선으로 누적
  function apTimeline(log){
    if (!log.length) return '';
    const cls = act => act === '승인' ? 'ap ok' : act === '보류' ? 'ap hold' : act === '반려' ? 'ap no' : /상신|수정/.test(act) ? 'me' : 'ap';
    const col = act => act === '승인' ? '#3b6420' : act === '보류' ? '#b25b0e' : act === '반려' ? '#a3262c' : '#4a5244';
    return `<div class="ap-tl"><b>진행 기록</b>${log.map(l => {
      const txt = l.reason || l.memo || '';
      const add = (l.add || []).length ? `<div class="fl">📎 ${l.act === '상신' ? '' : '추가 '}${l.add.map(h).join(', ')}</div>` : '';
      const del = (l.del || []).length ? `<div class="fl">뺀 파일 <s>${l.del.map(h).join(', ')}</s></div>` : '';
      return `<div class="bb ${cls(l.act)}"><div class="hd"><b>${h(l.by)}</b><em style="color:${col(l.act)}">${h(l.act)}</em><span>${h(l.at)}</span></div>${txt ? `<div class="tx">${h(txt)}</div>` : ''}${add}${del}</div>`;
    }).join('')}</div>`;
  }
  window.apOpen = async function(id){
    const { data: a, error } = await SB.rpc('appr_open', { p_id: id });
    if (error) { toast(error.message); await load(); draw(); return; }
    AP.cur = a;
    if (AP.data) {
      const r = AP.data.mine.find(x => x.id === id); if (r && !r.seen) { r.seen = true; AP.data.results = Math.max(0, AP.data.results - 1); }
      const c = (AP.data.ccbox || []).find(x => x.id === id); if (c && !c.ccSeen) { c.ccSeen = true; AP.data.ccnew = Math.max(0, (AP.data.ccnew || 0) - 1); }

        const tx = x.act === 'ok' ? '승인 ' + x.at.slice(5) : x.act === 'no' ? '반려 ' + x.at.slice(5) : x.act === 'hold' ? '보류 ' + x.at.slice(5) : now ? '결재 차례' : a.status === 'wait' ? '예정' : '-';
        return `<div class="${cls}"><b>${i + 1}</b><span>${window.mmAv ? mmAv(x.uid, x.name, 'sm') : ''}${h(pName(x))}</span><em>${h(tx)}</em>${x.reason && x.act === 'ok' ? `<small style="color:#5f6858">${h(x.reason)}</small>` : ''}</div>`;
      }).join('')}</div>` : '';
    iModal(a.title, `<div class="ap-meta">
        <span>상태</span><span>${chip(a.status)}${a.done ? ` <small style="color:#8b9381">${h(a.done)} · ${h(a.by)}</small>` : ''}</span>
        <span>상신자</span><span>${h(a.who)} · ${h(a.at)}</span>

        </div>${steps}${apTimeline(a.log || [])}
      ${(a.cc || []).length ? `<div class="ap-meta"><span>참조</span><span>${a.cc.map(c => (window.mmAv ? mmAv(c.uid, c.name, 'sm') : '') + h(pName(c))).join(', ')}</span></div>` : ''}
      ${a.memo ? `<div class="ap-memo">${h(a.memo)}</div>` : ''}

      ${a.status === 'hold' && a.reason ? `<div class="ap-reason hold"><b>보류 · 고칠 내용</b>${h(a.reason)}</div>` : ''}
      ${a.status === 'ok' && a.reason ? `<div class="ap-memo" style="margin-top:12px"><b style="font-size:12px">결재 메모</b><br>${h(a.reason)}</div>` : ''}
      <div class="ap-files">${a.filelist.map((f, i) => `<button class="bi-b" type="button" onclick="apFile(${i})">${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size || 0)}</small></button>`).join('')}</div>

    if (a.admin && a.status !== 'wait' && !a.mine) b.push(`<button class="btn ghost" style="color:#a3262c" onclick="apDel(${a.id})">삭제</button>`);

    if (a.turn && a.status === 'wait') {

  /* ---------- 승인 · 반려 (내 차례인 결재자) ---------- */
  window.apHold = function(id){
    const t = AP.cur && AP.cur.title;
    iModal('보류 · ' + t, `<div class="im-grid"><div class="f wide"><label>보류 사유 <span>고칠 내용을 적어주세요 · 상신한 사람에게 그대로 보여요</span></label>
      <textarea id="ap-reason" maxlength="500" placeholder="예) 사용 날짜를 적어서 다시 올려주세요"></textarea>
      <div class="bi-help">상신한 사람이 고쳐서 다시 올리면 내 차례부터 이어서 결재해요. 앞에서 승인한 결재는 그대로 남아요.</div></div></div>`, async () => {

      closeM(); toast('보류했어요. 상신한 사람에게 알렸어요.');

  };
  window.apDecide = function(id, ok){

    iModal(ok ? '승인 · ' + t : '반려 · ' + t, `<div class="im-grid"><div class="f wide"><label>${ok ? '결재 메모 <span>선택</span>' : '반려 사유 <span>상신한 사람에게 그대로 보여요</span>'}</label>
      <textarea id="ap-reason" maxlength="500" placeholder="${ok ? '예) 11/10 휴가 승인합니다' : '예) 날짜가 빠졌어요. 날짜를 적어서 다시 올려주세요'}"></textarea></div></div>`, async () => {

      if (error) { btn.disabled = false; btn.textContent = ok ? '승인' : '반려'; return toast('처리 실패: ' + error.message); }
      closeM(); toast(ok ? '승인했어요.' : '반려했어요.');
      await load(); draw();
    }, ok ? '승인' : '반려');
  };

  /* ---------- 새 상신 · 수정 · 다시 상신 ---------- */
  let ED = null;
  window.apNew = async function(formId, id){
    if (!AP.data) await load();
    if (!AP.data) return toast('불러오지 못했어요. 새로고침해 주세요.');
    const a = id && AP.cur && AP.cur.id === id ? AP.cur : { title: '', memo: '', filelist: [], formId: formId || null };
    const okId = (list, ap) => (list || []).filter(u => AP.data.people.some(p => p.id === u && (!ap || p.approver)));
    const src = id ? { line: a.lineIds, cc: a.ccIds } : (AP.data.last || {});
    ED = { id: id || '', keep: [...a.filelist], removed: [], add: [], line: okId(src.line, true).slice(0, MAXL), cc: okId(src.cc).slice(0, MAXC) };
    const forms = AP.data.forms;
    const brs = ((AP.data.brands || []).filter(b => b.active).map(b => b.name));
    forms.forEach(f => (f.brands || []).forEach(b => { if (!brs.includes(b)) brs.push(b); }));
    const f0 = a.formId && forms.find(f => String(f.id) === String(a.formId));
    ED.brs = brs; ED.br = (f0 && (f0.brands || [])[0]) || (brs.includes('본사') ? '본사' : brs[0] || ''); ED.form = a.formId || '';
    iModal(id ? (a.status === 'hold' ? '수정해서 다시 상신' : '상신 수정') : '새 상신', `<div class="im-grid">
      <div class="f wide"><label>양식 <span>서류매뉴얼에 올라온 양식</span></label><div class="ap-brs" id="ap-brs"></div><div class="ap-form"><select id="ap-form" onchange="apFormPick(this.value)"></select>
        <button type="button" class="bi-b" id="ap-dl" onclick="apFormDl()">${ic('download')}양식 받기</button></div></div>
      <div class="f wide"><label>제목</label><input id="ap-title" maxlength="100" value="${h(a.title)}" placeholder="예) 11월 연차 신청 (홍길동)"></div>
      <div class="f wide"><label>결재라인 <span>순서대로 결재해요 · 최대 ${MAXL}명</span></label><div class="ap-pp" id="ap-line"></div><select id="ap-addl" onchange="apPick('line',this)"></select></div>
      <div class="f wide"><label>참조 <span>선택 · 처리 없이 내용만 받아 봐요 · 최대 ${MAXC}명</span></label><div class="ap-pp cc" id="ap-cc"></div><select id="ap-addc" onchange="apPick('cc',this)"></select></div>
      <div class="f wide"><label>메모 <span>선택</span></label><textarea id="ap-memo" maxlength="1000" placeholder="결재자에게 전할 내용">${h(a.memo)}</textarea></div>
      <div class="f wide"><label>작성한 파일 <span>최대 ${MAXF}개 · 개당 20MB · PDF·한글·워드·엑셀·사진</span></label>
        <input type="file" id="ap-file" multiple accept="${Object.keys(MIME).map(e => '.' + e).join(',')}" onchange="apAdd(this)"><div class="nt-flist" id="ap-flist"></div></div>
    </div>`, save, id ? (a.status === 'hold' ? '다시 상신' : '수정') : '상신');
    drawForms(); apFormPick(document.getElementById('ap-form').value); drawFiles(); drawPick();
  };
  // 양식: 소속 버튼으로 나눠 보기
  function drawForms(){
    const b = document.getElementById('ap-brs'), sel = document.getElementById('ap-form'); if (!b || !sel) return;
    b.innerHTML = ED.brs.map(n => `<button type="button" class="bi-c ${ED.br === n ? 'on' : ''}" onclick="apBr('${h(n)}')">${h(n)}</button>`).join('');
    const list = AP.data.forms.filter(f => !ED.br || (f.brands || []).includes(ED.br));
    sel.innerHTML = `<option value="">${list.length ? '양식 없음' : '이 소속에 등록된 양식이 없어요'}</option>` +
      list.map(f => `<option value="${f.id}" ${String(f.id) === String(ED.form) ? 'selected' : ''}>${h(f.title)}</option>`).join('');
  }
  window.apBr = function(n){
    const sel = document.getElementById('ap-form'); ED.form = sel ? sel.value : ED.form;
    ED.br = n; drawForms(); apFormPick(document.getElementById('ap-form').value);
  };
  // 결재라인 · 참조 고르기 (이름 · 직책)
  const person = id => AP.data.people.find(p => p.id === id);
  const label = p => `${p.name}${p.title ? ' · ' + p.title : ''}${p.dept ? ' (' + p.dept + ')' : ''}`;
  function drawPick(){
    const L = document.getElementById('ap-line'), C = document.getElementById('ap-cc'); if (!L || !C) return;
    L.innerHTML = ED.line.map((u, i) => { const p = person(u); return p ? `<div><b>${i + 1}</b>${window.mmAv ? mmAv(p.id, p.name, 'sm') : ''}<span>${h(p.name)}<small>${h(p.title)}</small></span>
      <button type="button" onclick="apMove(${i})" ${i ? '' : 'disabled'} aria-label="앞으로">▲</button><button type="button" onclick="apUnpick('line',${i})">빼기</button></div>` : ''; }).join('');
    C.innerHTML = ED.cc.map((u, i) => { const p = person(u); return p ? `<div>${window.mmAv ? mmAv(p.id, p.name, 'sm') : ''}<span>${h(p.name)}<small>${h(p.title)}</small></span><button type="button" onclick="apUnpick('cc',${i})">빼기</button></div>` : ''; }).join('');
    const used = new Set([...ED.line, ...ED.cc]);
    const ap = AP.data.people.filter(p => p.approver && !used.has(p.id)), all = AP.data.people.filter(p => !used.has(p.id));
    const sl = document.getElementById('ap-addl'), sc = document.getElementById('ap-addc');
    sl.innerHTML = `<option value="">${ED.line.length >= MAXL ? `결재자는 ${MAXL}명까지예요` : ap.length ? '+ 결재자 추가' : '더 고를 수 있는 결재자가 없어요'}</option>` + (ED.line.length >= MAXL ? '' : ap.map(p => `<option value="${p.id}">${h(label(p))}</option>`).join(''));
    sc.innerHTML = `<option value="">${ED.cc.length >= MAXC ? `참조는 ${MAXC}명까지예요` : all.length ? '+ 참조 추가' : '더 고를 수 있는 사람이 없어요'}</option>` + (ED.cc.length >= MAXC ? '' : all.map(p => `<option value="${p.id}">${h(label(p))}</option>`).join(''));
  }
  window.apPick = function(k, sel){ const v = sel.value; if (!v) return; ED[k].push(v); drawPick(); };
  window.apUnpick = function(k, i){ ED[k].splice(i, 1); drawPick(); };
  window.apMove = function(i){ if (i < 1) return; [ED.line[i - 1], ED.line[i]] = [ED.line[i], ED.line[i - 1]]; drawPick(); };
  window.apFormPick = function(v){
    document.getElementById('ap-dl').style.display = v ? '' : 'none';
    const t = document.getElementById('ap-title'), f = AP.data.forms.find(x => String(x.id) === String(v));
    if (f && t && !t.value) t.value = f.title;
  };
  window.apFormDl = async function(){
    const v = document.getElementById('ap-form').value; if (!v) return;
    const { data: m, error } = await SB.rpc('manual_open', { p_id: +v });
    if (error) return toast(error.message);
    const dl = ext(m.file.name) !== 'pdf', w = dl ? null : window.open('', '_blank');
    const { data, error: e2 } = await SB.storage.from('manual-files').createSignedUrl(m.file.path, 600, dl ? { download: m.file.name } : undefined);
    if (e2) { w && w.close(); return toast('양식을 받지 못했어요: ' + e2.message); }
    if (w) w.location.href = data.signedUrl; else location.href = data.signedUrl;
  };
  function drawFiles(){
    const box = document.getElementById('ap-flist'); if (!box) return;
    box.innerHTML = ED.keep.map((f, i) => `<div>${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size || 0)}</small><button type="button" onclick="apRm('keep',${i})">빼기</button></div>`).join('') +
      ED.add.map((f, i) => `<div>${ic('clip')}<span>${h(f.name)}</span><small>${kb(f.size)} · 새 파일</small><button type="button" onclick="apRm('add',${i})">빼기</button></div>`).join('');
  }
  window.apAdd = function(inp){
    for (const f of inp.files) {
      if (ED.keep.length + ED.add.length >= MAXF) { toast(`첨부는 ${MAXF}개까지예요.`); break; }
      if (!MIME[ext(f.name)]) { toast(`'${f.name}'은 올릴 수 없는 형식이에요.`); continue; }
      if (f.size > MAXB) { toast(`'${f.name}'이 20MB를 넘어요.`); continue; }
      ED.add.push(f);
    }
    inp.value = ''; drawFiles();
  };
  window.apRm = function(k, i){ if (k === 'keep') ED.removed.push(...ED.keep.splice(i, 1)); else ED.add.splice(i, 1); drawFiles(); };
  async function save(){
    const title = document.getElementById('ap-title').value.trim(), memo = document.getElementById('ap-memo').value.trim(), formId = document.getElementById('ap-form').value;
    if (!title) return toast('제목을 입력해주세요.');
    if (!ED.line.length) return toast('결재라인에 결재자를 한 명 이상 넣어주세요.');
    if (!ED.keep.length && !ED.add.length) return toast('작성한 파일을 첨부해주세요.');
    const btn = document.getElementById('im-save'), lab = btn.textContent;
    btn.disabled = true; btn.textContent = ED.add.length ? '파일 올리는 중...' : '저장 중...';
    const up = [];
    try {
      for (const f of ED.add) {
        const e = ext(f.name), path = `${SESSION.user.uid}/${uid4()}.${e}`;
        const { error } = await SB.storage.from(BUCKET).upload(path, f, { contentType: f.type || MIME[e], upsert: false });
        if (error) throw new Error(`'${f.name}' 올리기 실패 (${error.message})`);
        up.push({ path, name: f.name, size: f.size, type: f.type || MIME[e] });
      }
      btn.textContent = '저장 중...';
      const { data: r, error } = await SB.rpc('appr_save', { p: { id: ED.id, formId, title, memo, files: [...ED.keep, ...up], line: ED.line, cc: ED.cc } });
      if (error) throw error;
      if (r.removed && r.removed.length) await SB.storage.from(BUCKET).remove(r.removed.map(f => f.path));
      closeM(); toast(ED.id ? '다시 올렸어요. 결재는 1번부터 다시 시작해요.' : '상신했어요. 결과가 나오면 🔔으로 알려드려요.');
      await load();
      if (window.__curPage === 'ap-mine') draw(); else go('ap-mine');
    } catch (e) {
      if (up.length) SB.storage.from(BUCKET).remove(up.map(f => f.path));
      btn.disabled = false; btn.textContent = lab; toast('저장 실패: ' + (e.message || e));
    }
  }
  window.apDel = async function(id, cancel){
    if (!confirm(cancel ? '이 상신을 취소할까요? 첨부 파일도 함께 지워져요.' : '이 상신을 삭제할까요? 첨부 파일도 함께 지워지고 되돌릴 수 없어요.')) return;
    const { data: files, error } = await SB.rpc('appr_delete', { p_id: id });
    if (error) return toast((cancel ? '취소' : '삭제') + ' 실패: ' + error.message);
    if (files && files.length) await SB.storage.from(BUCKET).remove(files.map(f => f.path));
    closeM(); toast(cancel ? '상신을 취소했어요.' : '삭제했어요.');
    await load(); draw();
  };

  // 2분마다 새 결재·결과 확인 (화면이 보일 때만)
  setInterval(() => { if (!document.hidden) load().then(() => { if (PAGES[window.__curPage] && !document.getElementById('inv-modal')) draw(); }); }, 120000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>

(function(){
  var K='mm_saved_uid', cb=document.getElementById('mlg-remember'), uid=document.getElementById('uid'), box=document.getElementById('loginbox');
  if(!cb||!uid||!box) return;
  try{ var v=localStorage.getItem(K); if(v){ uid.value=v; cb.checked=true; } }catch(e){}
  box.addEventListener('submit',function(){ try{ if(cb.checked) localStorage.setItem(K,uid.value.trim()); else localStorage.removeItem(K); }catch(e){} });
  cb.addEventListener('change',function(){ if(!cb.checked){ try{ localStorage.removeItem(K); }catch(e){} } });
  // 로그인 유지 (기본 켜짐) — 개인 휴대폰은 켜 두고, 같이 쓰는 기기는 끄기
  var kp=document.getElementById('mlg-keep');
  if(kp){
    try{ kp.checked = localStorage.getItem('mm-keep') !== '0'; }catch(e){}
    var setKeep=function(){ try{ localStorage.setItem('mm-keep', kp.checked ? '1' : '0'); }catch(e){} };
    kp.addEventListener('change', setKeep); box.addEventListener('submit', setKeep);
  }
})();

<script>

(function(){
  PATHS.cal = PATHS.cal || 'M3 5h18v16H3z M3 10h18 M8 3v4 M16 3v4';
  PATHS.phone = PATHS.phone || 'M5 3h4l2 5-3 2a12 12 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2';

  const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return S(d); };

  .nh-box.chg{background:#fff6e4}
  .nh-hrs{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;font-size:12px}
  .nh-help{font-size:11px;color:#8b9381;line-height:1.6;margin-top:4px}
  .nh-bulk textarea{min-height:180px;font-size:12px;white-space:pre}
  @media(max-width:640px){.nh-wk .nh-legend{margin-left:0;width:100%}.nh-wk strong{min-width:0;font-size:13px}.nh-t{min-width:0;table-layout:fixed}.nh-t th.nm,.nh-t td.nm{width:88px;min-width:0}.nh-t td.nm{padding:8px 4px 8px 8px}.nh-t td.nm b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis}.nh-t td.nm .nh-badge{margin:3px 0 0;display:inline-block}.nh-t td.nm small{overflow:hidden;text-overflow:ellipsis}.nh-t td.c{width:auto;padding:3px 1px}.nh-t td.c span{font-size:10px;padding:6px 0}.nh-t thead th{font-size:10px;padding:7px 0}.nh-t thead th.nm{padding-left:8px}.nh-t td.c .bi-b{padding:3px 2px!important;font-size:9px!important;white-space:normal}}`;
  document.head.appendChild(st);

  /* ---------- 데이터 ---------- */
  async function load(){
    if (!SESSION.user || SESSION.mustChange || !window.SB || !can()) return null;
    if (NH.uid !== SESSION.user.uid) { NH.uid = SESSION.user.uid; NH.data = null; }
    const { data, error } = await SB.rpc('naver_hours_data');
    if (error) { console.warn('휴무 불러오기 실패', error); return null; }
    NH.data = data; return data;
  }

  /* ---------- 메뉴: 대시보드 바로 아래 ---------- */
  const renderSideNh = renderSide;
  renderSide = function(active){
    renderSideNh(active);
    const nav = document.querySelector('#side .nav-items'); if (!nav || !can()) return;
    nav.querySelectorAll('.js-nh-menu').forEach(e => e.remove());
    const html = `<button class="cat js-nh-menu ${active === PAGE ? 'open' : ''}" onclick="go('${PAGE}')">${ic('store')}가맹점 현황</button>`;
    const cats = [...nav.querySelectorAll(':scope > .cat')];
    const lab = b => [...b.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim();
    const unitEnd = b => (b.nextElementSibling && b.nextElementSibling.classList.contains('sub')) ? b.nextElementSibling : b;
    const dash = cats.find(b => (b.getAttribute('onclick') || '').includes("go('dash')"));
    // 공지사항: 대시보드 바로 아래 (맨 위)
    const nt = nav.querySelector(':scope > .js-nt-menu');
    if (dash && nt) dash.insertAdjacentElement('afterend', nt);
    // 가맹점 현황: 매출 관리 바로 아래 (없으면 공지사항 아래)
    const sales = cats.find(b => lab(b) === '매출 관리');
    if (sales) unitEnd(sales).insertAdjacentHTML('afterend', html);
    else if (nt) nt.insertAdjacentHTML('afterend', html);
    else if (dash) dash.insertAdjacentHTML('afterend', html); else nav.insertAdjacentHTML('afterbegin', html);
  };
  const goNh = go;
  go = function(p, t){
    if (p === PAGE) {
      if (!can()) { toast('관리자·본사 계정만 볼 수 있어요.'); return goNh('dash'); }
      document.getElementById('nt-pop')?.remove();
      closeSide(); renderSide(p); window.__curPage = p; pageNh(); window.scrollTo(0, 0); return;
    }
    return goNh(p, t);
  };

  /* ---------- 화면 ---------- */
  function pageNh(){
    document.getElementById('main').innerHTML = simpleHero(['가맹점 현황'], 'FRANCHISE STATUS', '가맹점 현황',
      '네이버 스마트플레이스에 등록된 휴무를 하루 두 번(오전 7시·저녁 6시) 자동으로 확인해요. 매장 이름을 누르면 점주 연락처와 플레이스가 열려요.') +
      `<section class="card" id="nh-status"><div class="bi-empty">불러오는 중...</div></section>
       <section class="card nh-today" id="nh-today" style="display:none"></section>
       <section class="card" id="nh-week" style="display:none"></section>` + pageFoot();
    if (NH.data) draw();
    load().then(d => { if (window.__curPage !== PAGE) return; d ? draw() : (document.getElementById('nh-status').innerHTML = '<div class="bi-empty">휴무 정보를 불러오지 못했어요. 새로고침해 주세요.</div>'); });
  }

  function sortStores(list, day){
    const score = s => (s.skip ? 100 : 0) - (changedRecent(s) ? 8 : 0) - (closedOn(s, day) ? 4 : 0) - (stale(s) ? 2 : 0);
    return [...list].sort((a, b) => score(a) - score(b) || a.id - b.id);
  }

  function draw(){
    const d = NH.data; if (!d || !document.getElementById('nh-status')) return;
    const list = d.stores || [], today = d.today;
    const live = list.filter(s => !s.skip);
    const bad = live.filter(stale);
    const lastOld = hoursAgo(d.last) > 24;

    // 상태줄
    document.getElementById('nh-status').innerHTML = `<div class="nh-status"><i class="nh-dot ${lastOld || bad.length ? 'bad' : ''}"></i>
      <span>마지막 수집 <b>${d.last ? kst(d.last) : '아직 없음'}</b></span><span>확인 매장 <b>${live.length - bad.length}</b> / ${live.length}</span>
      <span class="nh-r"><button class="bi-b" onclick="nhBulk()">${ic('plus')}명단 한 번에 넣기</button></span></div>
      ${lastOld ? `<div class="nh-warn">하루 넘게 수집이 안 됐어요. 오늘은 아래 표의 각 매장 줄에서 <b>직접 확인</b>을 눌러 체크해 주세요. Apps Script의 NaverHoliday 자동 실행을 확인해 보세요.</div>`
        : bad.length ? `<div class="nh-warn">수집 안 된 매장 ${bad.length}곳: ${bad.map(s => h(s.name)).join(', ')} — 매장 이름을 눌러 이유를 확인하고, 오늘은 직접 확인으로 체크해 주세요.</div>` : ''}`;

    // 오늘 휴무
    const off = live.map(s => [s, closedOn(s, today)]).filter(x => x[1]);
    const tb = document.getElementById('nh-today'); tb.style.display = '';
    tb.innerHTML = `<h3>오늘 휴무 <small>${md(today)} (${dow(today)}) · ${off.length}곳</small></h3>` + (off.length
      ? `<div class="nh-chips">${off.map(([s, c]) => `<button class="nh-chip ${c.kind}" onclick="nhStore(${s.id})">${h(s.name)}<em>${c.kind === 'tmp' ? '임시' : '정기'}</em></button>`).join('')}</div>`
      : `<div class="nh-none">오늘 쉬는 매장이 없어요.</div>`);

    // 주간 표
    const mon = add(monday(today), NH.week * 7), days = [...Array(7)].map((_, i) => add(mon, i));
    const wb = document.getElementById('nh-week'); wb.style.display = '';
    const rows = sortStores(list, today).map(s => {
      const tags = (s.delivery ? '<span class="nh-badge dlv">딜리버리</span>' : '') + (changedRecent(s) ? '<span class="nh-badge chg">변경됨</span>' : '') + (s.skip ? '<span class="nh-badge skip">확인 제외</span>' : stale(s) ? '<span class="nh-badge bad">수집 안 됨</span>' : '');
      const sub = s.skip ? '네이버 확인 제외' : (s.owner ? h(s.owner) : '점주 미입력');
      const head = `<td class="nm" onclick="nhStore(${s.id})"><b>${h(s.name)}</b>${tags}<small>${sub}</small></td>`;
      if (s.skip) return `<tr class="skip">${head}<td class="span" colspan="7">딜리버리 매장 — 네이버 플레이스 없음</td></tr>`;
      if (stale(s) && NH.week === 0) {
        const ck = checkedToday(s);
        return `<tr>${head}${days.map(day => cell(s, day, today)).join('').replace(/<td class="c today">[\s\S]*?<\/td>/, `<td class="c today"><button class="bi-b ${ck ? 'on' : ''}" style="padding:4px 6px;font-size:10px" onclick="nhCheck(${s.id})" title="${ck ? h(ck.by) + ' 확인' : '오늘 직접 확인하면 눌러 주세요'}">${ck ? '확인함' : '직접 확인'}</button></td>`)}</tr>`;
      }
      return `<tr>${head}${days.map(day => cell(s, day, today)).join('')}</tr>`;
    }).join('');
    wb.innerHTML = `<div class="nh-wk"><button class="bi-b" onclick="nhWeek(-1)" aria-label="지난주">‹</button>
        <strong>${NH.week === 0 ? '이번 주' : NH.week === 1 ? '다음 주' : NH.week === -1 ? '지난주' : (NH.week > 0 ? NH.week + '주 뒤' : -NH.week + '주 전')} · ${md(days[0])}~${md(days[6])}</strong>
        <button class="bi-b" onclick="nhWeek(1)" aria-label="다음 주">›</button>${NH.week ? `<button class="bi-b" onclick="nhWeek(0)">이번 주로</button>` : ''}
        <span class="nh-legend"><span><i style="background:#22311f"></i>정기휴무</span><span><i style="background:#c62429"></i>임시휴무</span></span></div>
      <div class="nh-scroll"><table class="nh-t"><thead><tr><th class="nm">매장</th>${days.map(day => `<th class="${day === today ? 'today' : ''}">${dow(day)}<br>${md(day)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="nh-foot">임시휴무는 점주가 네이버에 등록한 날짜만 보여요. 네이버는 앞으로 7일치만 공개하기 때문에, 다음 주 이후 임시휴무는 가까워지면 채워져요.${NH.week < 0 ? ' 지난주는 그때 잡힌 임시휴무와 정기휴무를 함께 보여줘요.' : ''}</div>`;
  }
  function cell(s, day, today){
    const c = closedOn(s, day), cls = 'c' + (day === today ? ' today' : '');
    if (!c) return `<td class="${cls}"><span class="nh-dash">·</span></td>`;
    return `<td class="${cls}"><span class="${c.kind}${day < today ? ' past' : ''}" title="${h(c.text)}">${c.kind === 'tmp' ? '임시' : '정기'}</span></td>`;
  }
  window.nhWeek = n => { NH.week = n === 0 ? 0 : NH.week + n; draw(); };
  window.nhCheck = async function(id){
    const { data, error } = await SB.rpc('naver_check_toggle', { p_store: id, p_day: NH.data.today });
    if (error) return toast(error.message);
    toast(data.checked ? '오늘 직접 확인으로 체크했어요.' : '체크를 풀었어요.');
    await load(); draw();
  };

  /* ---------- 매장 상세 ---------- */
  const placeUrl = s => s.place_url || (s.place_id ? `https://m.place.naver.com/restaurant/${s.place_id}/home` : '');
  window.nhStore = function(id){
    const s = (NH.data.stores || []).find(x => x.id === id); if (!s) return;
    const ph = telNo(s.phone), pu = placeUrl(s);
    const wk = ['월', '화', '수', '목', '금', '토', '일'];
    const hrs = (() => {
      const b = (s.hours || [])[0]; if (!b || !b.businessHours) return '';
      const map = {}; b.businessHours.forEach(x => { map[String(x.day).replace(/\(.*\)/, '')] = x; });
      return `<div class="nh-box"><b>네이버 영업시간</b><div class="nh-hrs" style="margin-top:6px">${wk.map(k => { const x = map[k];
        if (!x) return `<span>${k}</span><span style="color:#9aa38f">-</span>`;
        const t = x.businessHours ? `${x.businessHours.start}~${x.businessHours.end}` + ((x.breakHours || []).length ? ` (브레이크 ${x.breakHours.map(b => b.start + '~' + b.end).join(', ')})` : '') : (x.description || '휴무');
        return `<span>${k}</span><span>${h(t)}</span>`; }).join('')}</div>${s.free ? `<div style="margin-top:6px;color:#7d8574">${h(s.free)}</div>` : ''}</div>`;
    })();
    const future = (s.days || []).filter(x => x.day >= NH.data.today);
    const prev = s.prev && changedRecent(s) ? `<div class="nh-box chg"><b>변경됨 · ${kst(s.changed)}</b><br>이전 정기휴무: ${(s.prev.regular_days || []).join(', ') || '없음'} → 지금: ${(s.regular || []).join(', ') || '없음'}</div>` : '';
    iModal(s.name, `
      <div class="nh-acts">
        ${ph ? `<a class="bi-b" href="tel:${ph}">${ic('phone')}전화</a><a class="bi-b" href="sms:${ph}">${ic('msg')}문자</a>` : `<span class="bi-b" style="opacity:.5">${ic('phone')}연락처 없음</span>`}
        ${pu ? `<a class="bi-b" href="${h(pu)}" target="_blank" rel="noopener">${ic('link')}플레이스 열기</a>` : `<span class="bi-b" style="opacity:.5">플레이스 없음</span>`}
      </div>
      <div class="nh-info">
        <span>점주</span><span>${h(s.owner) || '<span style="color:#9aa38f">미입력</span>'}</span>
        <span>연락처</span><span>${h(mmTel(s.phone)) || '<span style="color:#9aa38f">미입력</span>'}</span>
        <span>매장 전화</span><span>${s.store_phone ? `<a href="tel:${telNo(s.store_phone)}" style="color:inherit">${h(mmTel(s.store_phone))}</a>` : '<span style="color:#9aa38f">-</span>'}</span>
        <span>담당 SV</span><span>${h(s.sv) || '<span style="color:#9aa38f">-</span>'}</span>
        <span>주소</span><span>${h(s.addr) || '<span style="color:#9aa38f">미입력</span>'}</span>
        <span>오픈일</span><span>${h(s.open || '') || '<span style="color:#9aa38f">미입력</span>'}</span>
        <span>네이버 이름</span><span>${h(s.naver_name) || '-'}</span>
        <span>정기휴무</span><span>${s.skip ? '네이버 확인 제외 (' + h(s.skip) + ')' : (s.regular || []).length ? (s.regular || []).map(h).join(', ') + '요일' : '없음'}</span>
        <span>임시휴무</span><span>${future.length ? future.map(x => `${md(x.day)}(${dow(x.day)})`).join(', ') : '등록 없음'}</span>
        ${s.coming ? `<span>예정 휴무</span><span>${h(s.coming)}</span>` : ''}
        ${(s.irregular || []).length ? `<span>기타 휴무</span><span style="white-space:pre-wrap">${h(JSON.stringify(s.irregular))}</span>` : ''}
        <span>FC다움 연동</span><span>${s.fc_at ? kst(s.fc_at) : '<span style="color:#9aa38f">아직 없음</span>'}</span>
        <span>마지막 확인</span><span>${s.checked ? kst(s.checked) : '-'}${s.err ? `<br><span style="color:#a3262c">수집 실패: ${h(s.err)}</span>` : ''}</span>
      </div>${prev}${hrs}`, closeM, '닫기');
    const foot = document.querySelector('#inv-modal .im-foot');
    foot.querySelector('.btn.ghost')?.remove();
    foot.insertAdjacentHTML('afterbegin', `<div class="mn-foot-l" style="margin-right:auto"><button class="btn ghost" onclick="nhEdit(${s.id})">${ic('edit')}정보 수정</button></div>`);
  };

  /* ---------- 정보 수정 ---------- */
  window.nhEdit = function(id){
    const s = (NH.data.stores || []).find(x => x.id === id); if (!s) return;
    iModal(`정보 수정 · ${s.name}`, `<div class="im-grid">
      <div class="f"><label>점주 이름</label><input id="nh-owner" maxlength="30" value="${h(s.owner)}"></div>
      <div class="f"><label>연락처</label><input id="nh-phone" type="tel" maxlength="20" value="${h(mmTel(s.phone))}" placeholder="010-0000-0000"></div>
      <div class="f wide"><label>주소</label><input id="nh-addr" maxlength="200" value="${h(s.addr)}"></div>
      <div class="f"><label>오픈일</label><input id="nh-open" type="date" value="${h(s.open || '')}"></div>
      <div class="f"><label>네이버 확인</label><select id="nh-skip"><option value="">확인함</option><option value="딜리버리 매장" ${s.skip ? 'selected' : ''}>제외 (플레이스 없음)</option></select></div>
      <div class="f wide"><label>플레이스 주소 <span>선택</span></label><input id="nh-url" maxlength="300" value="${h(s.place_url)}" placeholder="https://naver.me/... 또는 map.naver.com/..."><div class="nh-help">비워 두면 자동으로 찾은 플레이스가 열려요.</div></div>
      <div class="f wide"><label>네이버 검색 이름 <span>선택</span></label><input id="nh-search" maxlength="60" value="${h(s.search)}" placeholder="멘야마쯔리 ${h(s.name)}"><div class="nh-help">자동 수집이 매장을 못 찾을 때만 네이버 지도에 뜨는 이름 그대로 넣어 주세요. 바꾸면 다음 수집 때 다시 찾아요.</div></div>
    </div>`, async () => {
      const v = id => document.getElementById(id).value.trim();
      const p = { id: s.id, owner: v('nh-owner'), phone: v('nh-phone'), addr: v('nh-addr'), open: v('nh-open'), place_url: v('nh-url'), search: v('nh-search'), skip: v('nh-skip') };
      const { error } = await SB.rpc('naver_store_save', { p });
      if (error) return toast('저장하지 못했어요: ' + error.message);
      closeM(); toast('저장했어요.'); await load(); draw();
    }, '저장');
  };

  /* ---------- 명단 한 번에 넣기 ---------- */
  const key = n => String(n || '').replace(/멘야마쯔리|\s/g, '').replace(/본점$|점$/, '');
  window.nhBulk = function(){
    iModal('명단 한 번에 넣기', `<div class="nh-bulk">
      <div class="nh-box">한 줄에 매장 하나씩, <b>매장명 · 점주 · 연락처 · 주소 · 오픈일 · 플레이스 주소</b> 순서로 넣어 주세요. 엑셀에서 여섯 칸을 복사해 붙여넣으면 그대로 들어가요. 엑셀이 아니면 쉼표(,)로 나눠도 돼요. 빈칸은 기존 값을 그대로 둬요.</div>
      <div class="im-grid"><div class="f wide"><textarea id="nh-bulk" placeholder="쌍용점	홍길동	010-1234-5678	충남 천안시 서북구 쌍용14길 25	2015-03-01&#10;신부점	김철수	010-2222-3333"></textarea></div></div>
      <div class="nh-help" id="nh-bulk-msg"></div></div>`, async () => {
      const lines = document.getElementById('nh-bulk').value.split('\n').map(x => x.trim()).filter(Boolean);
      if (!lines.length) return toast('넣을 내용이 없어요.');
      const stores = NH.data.stores || [], miss = [];
      let ok = 0;
      for (const ln of lines) {
        const c = (ln.includes('\t') ? ln.split('\t') : ln.split(',')).map(x => x.trim());
        const s = stores.find(x => key(x.name) === key(c[0])) || stores.find(x => key(c[0]) && (key(x.name).includes(key(c[0])) || key(c[0]).includes(key(x.name))));
        if (!s) { miss.push(c[0]); continue; }
        const p = { id: s.id };
        if (c[1]) p.owner = c[1];
        if (c[2]) p.phone = c[2];
        if (c[3]) p.addr = c[3];
        if (c[4]) { const m = c[4].replace(/[./]/g, '-').match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if (m) p.open = `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`; }
        if (c[5]) p.place_url = c[5];
        const { error } = await SB.rpc('naver_store_save', { p });
        if (error) miss.push(c[0] + '(' + error.message + ')'); else ok++;
      }
      await load(); draw();
      if (miss.length) { document.getElementById('nh-bulk-msg').innerHTML = `<span style="color:#a3262c">${ok}곳 저장 · 못 찾은 줄: ${miss.map(h).join(', ')}</span>`; }
      else { closeM(); toast(`${ok}곳 저장했어요.`); }
    }, '넣기');
  };

  // 2분마다 화면이 열려 있으면 새로고침
  setInterval(() => { if (!document.hidden && window.__curPage === PAGE && !document.getElementById('inv-modal')) load().then(d => d && draw()); }, 120000);
})();
</script>

<script>
/* ==========================================================
   경쟁사 분석 (2026-11-03) — 네이버 스마트플레이스 기준 출점·폐점 이력
   - 브랜드 등록: 이 화면에서 (관리자·본사)
