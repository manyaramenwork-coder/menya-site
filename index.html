      ${list.length ? `<div class="cp-list"><div class="cp-row head hd"><span>매장</span><span class="stc"></span></div>
        ${list.map(s => `<div class="cp-row hd">
          <span class="nm"><b>${h(s.name || '(이름 없음)')}</b><span class="cp-tag hid">${s.why === 'auto' ? '자동 숨김' : '직접 뺌'}</span><small>${CP.brand ? '' : h(bName(s.brand)) + ' · '}${h(s.cat) || '업종 미확인'} · ${h(area(s.addr)) || '주소 미확인'}</small></span>
          <span class="stc"><button class="bi-b" onclick="cpUnhide('${h(s.id)}')">다시 보이기</button></span></div>`).join('')}</div>`
        : `<div class="bi-empty">숨긴 매장이 없어요.</div>`}
      <div class="cp-foot">업종이 본사·사무실·물류처럼 음식점이 아닌 곳은 자동으로 숨겨요. 다시 보이게 한 매장은 이후 자동으로 숨기지 않아요.</div>`;
  }

  function drawHist(){
    const d = CP.data, today = d.today;
    const ev = (d.events || []).filter(e => !CP.brand || e.brand === CP.brand);
    const ym = s => String(s).slice(0, 7), thisM = ym(today);
    const cnt = (m, t) => ev.filter(e => ym(e.d) === m && e.type === t).length;
    const months = [...Array(6)].map((_, i) => { const dt = new Date(Date.UTC(+today.slice(0, 4), +today.slice(5, 7) - 1 - i, 1)); return dt.toISOString().slice(0, 7); });
    const shown = ev.filter(e => e.type !== '폐점의심' || (d.stores || []).find(s => s.id === e.id && s.status === '폐점의심'));
    const groups = {}; shown.slice(0, 200).forEach(e => (groups[e.d] = groups[e.d] || []).push(e));
    const tag = t => ({ '새로오픈': '<span class="cp-tag new">새로오픈</span>', '추가발견': '<span class="cp-tag add">추가 발견</span>', '폐점의심': '<span class="cp-tag sus">폐점 의심</span>', '폐점': '<span class="cp-tag cls">폐점</span>', '복귀': '<span class="cp-tag ret">다시 확인됨</span>' }[t] || h(t));
    document.getElementById('cp-body').innerHTML = `
      <div class="cp-sum"><div><span>이번 달 새로오픈</span><b>${cnt(thisM, '새로오픈')}</b></div><div><span>이번 달 폐점</span><b>${cnt(thisM, '폐점')}</b></div><div><span>지금 폐점 의심</span><b>${(d.stores || []).filter(s => (!CP.brand || s.brand === CP.brand) && s.status === '폐점의심').length}</b></div></div>
      <table class="cp-mon"><thead><tr><th>월</th><th>새로오픈</th><th>폐점</th><th>순증</th></tr></thead><tbody>
        ${months.map(m => { const o = cnt(m, '새로오픈'), c = cnt(m, '폐점'); return `<tr><td>${+m.slice(5)}월</td><td>${o || '-'}</td><td>${c || '-'}</td><td>${o - c > 0 ? '+' : ''}${o - c || '-'}</td></tr>`; }).join('')}
      </tbody></table>
      ${Object.keys(groups).length ? Object.keys(groups).map(day => `<div class="cp-day">${ymd(day)}</div>${groups[day].map(e => `
        <div class="cp-ev" onclick="cpStore('${h(e.id)}')">${tag(e.type)}<b>${h(e.name)}</b><small>${CP.brand ? '' : h(bName(e.brand)) + '<br>'}${h(area(e.addr))}</small></div>`).join('')}`).join('')
        : `<div class="bi-empty">아직 쌓인 이력이 없어요. 처음 찾은 매장은 기존 매장으로 깔리고, 다음 날부터 변화가 생기면 여기에 쌓여요.</div>`}`;
  }

  window.cpTab = t => { CP.tab = t; draw(); };
  window.cpPick = id => { CP.brand = CP.brand === id ? 0 : id; draw(); };
  window.cpSt = v => { CP.st = v; drawList(); };
  // 11/07: 카드의 '숨김 N'을 누르면 그 브랜드의 숨긴 매장 목록을 바로 엶
  window.cpHid = id => { CP.brand = id; CP.tab = 'list'; CP.st = 'hidden'; draw(); };
  window.cpQ = v => { CP.q = v; clearTimeout(CP.qt); CP.qt = setTimeout(() => { drawList(); const i = document.querySelector('.cp-filter input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); };

  /* ---------- 매장 상세 ---------- */
  window.cpStore = function(id){
    const s = (CP.data.stores || []).find(x => x.id === id); if (!s) return;
    iModal(s.name || '매장', `
      <div style="margin-bottom:12px"><a class="bi-b" href="${placeUrl(s.id)}" target="_blank" rel="noopener">${ic('link')}네이버 플레이스 열기</a></div>
      <div class="cp-info">
        <span>브랜드</span><span>${h(bName(s.brand))}</span>
        <span>상태</span><span>${stTag(s)}${s.miss && s.status !== '폐점' ? ` <span style="color:#9a6a0b;font-size:12px">${s.miss}일째 안 잡힘</span>` : ''}</span>
        <span>업종</span><span>${h(s.cat) || '-'}</span>
        <span>전화</span><span>${h(mmTel(s.tel)) || '-'}</span>
        <span>주소</span><span>${h(s.addr) || '-'}</span>
        <span>리뷰</span><span>${num(s.rev)}${s.rev30 != null ? ` <span style="color:#6f8a5a;font-size:12px">(30일 ${s.rev30 >= 0 ? '+' : ''}${num(s.rev30)})</span>` : ''}</span>
        <span>처음 확인</span><span>${ymd(s.first)}${s.base ? ' <span style="color:#9aa38f;font-size:12px">(등록 당시 기존 매장)</span>' : ''}</span>
        <span>마지막 확인</span><span>${ymd(s.last) || '-'}</span>
      </div>
      ${s.stale ? '<div class="cp-box">리뷰가 60일 동안 늘지 않았어요. 네이버에만 남아 있는 폐점 매장일 수 있으니 확인해 보세요.</div>' : ''}
      ${s.cm ? '<div class="cp-box">직접 폐점으로 지정한 매장이에요. 네이버에 남아 있어도 자동 확인이 운영 중으로 되돌리지 않아요.</div>' : ''}
      <div class="cp-help">문을 닫았는데 네이버에 남아 있다면 <b>폐점 처리</b>, 다른 가게가 잘못 잡혔다면 <b>목록에서 빼기</b>를 눌러 주세요.</div>`, closeM, '닫기');
    const foot = document.querySelector('#inv-modal .im-foot');
    foot.querySelector('.btn.ghost')?.remove();
    const closeBtn = s.cm ? `<button class="btn ghost" onclick="cpClose('${h(s.id)}', false)">폐점 취소</button>`
      : s.status === '폐점' ? '' : `<button class="btn ghost" style="color:#a3262c" onclick="cpClose('${h(s.id)}', true)">폐점 처리</button>`;
    foot.insertAdjacentHTML('afterbegin', `<div style="margin-right:auto;display:flex;gap:6px;flex-wrap:wrap">${closeBtn}<button class="btn ghost" onclick="cpHide('${h(s.id)}')">목록에서 빼기</button></div>`);
  };
  window.cpClose = async function(id, on){
    if (!confirm(on ? '이 매장을 폐점으로 지정할까요? 네이버에 남아 있어도 자동 확인이 되돌리지 않아요.' : '폐점 지정을 취소하고 운영 중으로 되돌릴까요?')) return;
    const { error } = await SB.rpc('competitor_store_close', { p_id: id, p_close: on });
    if (error) return toast('처리하지 못했어요: ' + error.message);
    closeM(); toast(on ? '폐점으로 지정했어요.' : '운영 중으로 되돌렸어요.'); await load(); draw();
  };
  window.cpUnhide = async function(id){
    const { error } = await SB.rpc('competitor_store_unhide', { p_id: id });
    if (error) return toast('처리하지 못했어요: ' + error.message);
    toast('다시 보이게 했어요.'); await load(); draw();
  };
  window.cpHide = async function(id){
    if (!confirm('이 매장을 목록에서 뺄까요? 이력도 함께 숨겨져요.')) return;
    const { error } = await SB.rpc('competitor_store_hide', { p_id: id });
    if (error) return toast('처리하지 못했어요: ' + error.message);
    closeM(); toast('목록에서 뺐어요.'); await load(); draw();
  };

  /* ---------- 브랜드 추가 · 수정 ---------- */
  window.cpBrand = function(id){
    const b = id ? (CP.data.brands || []).find(x => x.id === id) : null;
    iModal(b ? `브랜드 수정 · ${b.name}` : '경쟁 브랜드 추가', `<div class="im-grid">
      <div class="f wide"><label>브랜드명</label><input id="cp-bn" maxlength="40" value="${h(b ? b.name : '')}" placeholder="예: 멘야산다이메"></div>
      <div class="f wide"><label>검색어 <span>선택</span></label><input id="cp-bk" maxlength="40" value="${h(b && b.keyword !== b.name ? b.keyword : '')}" placeholder="비워 두면 브랜드명으로 찾아요">
        <div class="cp-help">네이버 지도에 뜨는 매장 이름 앞부분과 같아야 해요. 예) 홍콩반점은 '홍콩반점0410'. 이 글자가 들어간 매장만 모아요.</div></div>
      ${b ? `<div class="f"><label>자동 확인</label><select id="cp-ba"><option value="1">켜기</option><option value="0" ${b.active ? '' : 'selected'}>끄기</option></select></div>` : ''}
    </div>${b ? '' : '<div class="cp-box">저장하면 10분 안에 전국 매장 찾기가 시작되고, 20~30분 뒤 매장 목록이 채워져요. 처음 찾은 매장은 기존 매장으로 깔려요.</div>'}`, async () => {
      const p = { id: b ? b.id : null, name: document.getElementById('cp-bn').value.trim(), keyword: document.getElementById('cp-bk').value.trim() };
      if (b) p.active = document.getElementById('cp-ba').value === '1';
      if (!p.name) return toast('브랜드명을 입력해 주세요.');
      if (b && (p.keyword || p.name) !== b.keyword && !confirm('검색어가 바뀌면 매장을 처음부터 다시 찾아요. 진행할까요?')) return;
      const { error } = await SB.rpc('competitor_brand_save', { p });
      if (error) return toast('저장하지 못했어요: ' + error.message);
      closeM(); toast(b ? '저장했어요.' : '등록했어요. 10분 안에 매장 찾기를 시작해요.'); await load(); draw();
    }, b ? '저장' : '등록');
    if (b) {
      const foot = document.querySelector('#inv-modal .im-foot');
      foot.insertAdjacentHTML('afterbegin', `<div style="margin-right:auto"><button class="btn ghost" style="color:#a3262c" onclick="cpBrandDel(${b.id})">삭제</button></div>`);
    }
  };
  window.cpBrandDel = async function(id){
    if (!confirm('이 브랜드를 삭제할까요? 모은 매장과 이력이 모두 지워져요. 잠시 멈추려면 삭제 대신 자동 확인을 끄세요.')) return;
    const { error } = await SB.rpc('competitor_brand_delete', { p_id: id });
    if (error) return toast('삭제하지 못했어요: ' + error.message);
    closeM(); toast('삭제했어요.'); await load(); draw();
  };

  /* ---------- 매장 직접 추가 ---------- */
  window.cpAdd = function(){
    const brands = CP.data.brands || [];
    iModal('매장 직접 추가', `<div class="im-grid">
      <div class="f wide"><label>브랜드</label><select id="cp-ab">${brands.map(b => `<option value="${b.id}" ${CP.brand === b.id ? 'selected' : ''}>${h(b.name)}</option>`).join('')}</select></div>
      <div class="f wide"><label>네이버 플레이스 링크</label><input id="cp-ap" maxlength="400" placeholder="https://map.naver.com/p/entry/place/1234567...">
        <div class="cp-help">네이버 지도에서 매장을 열고 주소창 링크를 복사해 붙여 주세요(숫자가 들어간 주소). naver.me로 시작하는 짧은 주소는 안 돼요.</div></div>
      <div class="f wide"><label>매장 이름</label><input id="cp-an" maxlength="60" placeholder="네이버에 뜨는 이름 그대로 (예: 멘야산다이메 대전점)">
        <div class="cp-help">매일 이 이름으로 검색해서 영업 중인지 확인해요.</div></div>
    </div>`, async () => {
      const p = { brand_id: document.getElementById('cp-ab').value, place: document.getElementById('cp-ap').value.trim(), name: document.getElementById('cp-an').value.trim() };
      const { error } = await SB.rpc('competitor_store_add', { p });
      if (error) return toast(error.message);
      closeM(); toast('추가했어요.'); await load(); draw();
    }, '추가');
  };

  // 2분마다 화면이 열려 있으면 새로고침 (매장 찾는 중일 때 채워지는 걸 보여줌)
  setInterval(() => { if (!document.hidden && window.__curPage === PAGE && !document.getElementById('inv-modal')) load().then(d => d && draw()); }, 120000);
})();
</script>

<script>
/* ==========================================================
   시스템 점검 (2026-11-03) — 관리자 전용, 자동 수집이 제대로 돌고 있는지 매일 확인
   - 데이터: Supabase sys_health() (update_log · store_naver · pg_cron · competitor_runs)
   - 검색 트렌드: 화면을 열 때 naver-trend를 한 번 시험 호출
   - 메일: Apps Script HealthCheck.gs가 매일 8시 같은 점검을 돌려 이상 있을 때만 메일
   ========================================================== */
(function(){
  PATHS.pulse = PATHS.pulse || 'M3 12h4l3-8 4 16 3-8h4';
  const PAGE = 'sys-check';
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const adm = () => !!(SESSION.user && SESSION.user.role === 'admin');
  const SC = { data: null, trend: null, busy: false };
  const LV = { ok: ['정상', 'ok'], warn: ['확인 필요', 'warn'], bad: ['문제', 'bad'], none: ['기록 없음', 'none'], wait: ['확인 중', 'none'] };
  const ago = m => m == null ? '' : m < 60 ? `${m}분 전` : m < 48 * 60 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`;
  const kst = s => { if (!s) return '-'; const d = new Date(s); const p = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; };

  const st = document.createElement('style');
  st.textContent = `
  .sc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
  .sc-sum div{background:#fff;border:1px solid #e3e5dd;border-radius:12px;padding:12px 14px}
  .sc-sum span{display:block;font-size:12px;color:#7b8174}
  .sc-sum b{font-size:22px;font-weight:600;color:#222b1e}
  .sc-sum .w b{color:#9a6a0b}.sc-sum .x b{color:#c8102e}
  .sc-list{display:grid;gap:10px}
  .sc-row{background:#fff;border:1px solid #e3e5dd;border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
  .sc-row.warn{border-color:#ecd9a8;background:#fffbf0}.sc-row.bad{border-color:#efc3bd;background:#fff8f7}
  .sc-row b{font-size:14px;font-weight:600;color:#222b1e}
  .sc-row .how{font-size:11.5px;color:#8c9186;margin-left:6px;font-weight:400}
  .sc-row .at{text-align:right;font-size:12px;color:#5f6858;white-space:nowrap}
  .sc-row .at small{display:block;font-size:11px;color:#969c8e}
  .sc-row .msg{grid-column:1/-1;font-size:12px;color:#5f6858;line-height:1.6;word-break:keep-all}
  .sc-pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;margin-right:8px;vertical-align:1px}
  .sc-pill.ok{background:#eaf1e4;color:#4b6b35}.sc-pill.warn{background:#fff1d6;color:#9a6a0b}.sc-pill.bad{background:#c8102e;color:#fff}.sc-pill.none{background:#eceee8;color:#6c7365}
  .sc-foot{font-size:11.5px;color:#8b9381;line-height:1.7;margin-top:12px}
  @media(max-width:640px){.sc-sum b{font-size:18px}.sc-row{padding:11px 12px}.sc-row .how{display:block;margin:2px 0 0}}`;
  document.head.appendChild(st);

  async function load(){
    const { data, error } = await SB.rpc('sys_health');
    if (error) throw error;
    SC.data = data;
  }
  async function testTrend(){
    SC.trend = { level: 'wait', msg: '시험 호출 중...' };
    const end = new Date(Date.now() - 86400000), start = new Date(end.getTime() - 7 * 86400000);
    const ymd = d => d.toISOString().slice(0, 10);
    try {
      const { data, error } = await SB.functions.invoke('naver-trend', { body: { keywords: ['라멘'], startDate: ymd(start), endDate: ymd(end), timeUnit: 'date', mode: 'compare' } });
      if (error) { let msg = error.message; try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {} throw new Error(msg); }
      if (!data || !data.ok) throw new Error((data && data.error) || '응답 이상');
      SC.trend = { level: 'ok', msg: '네이버 데이터랩 응답 정상', at: new Date().toISOString(), mins: 0 };
    } catch (e) {
      SC.trend = { level: 'bad', msg: '호출 실패: ' + (e.message || e), at: new Date().toISOString(), mins: 0 };
    }
  }

  function row(it){
    const [txt, cls] = LV[it.level] || LV.none;
    return `<div class="sc-row ${cls}">
      <span><span class="sc-pill ${cls}">${txt}</span><b>${h(it.label)}</b><span class="how">${h(it.how)}</span></span>
      <span class="at">${it.at ? kst(it.at) : '-'}<small>${ago(it.mins)}</small></span>
      ${it.msg ? `<span class="msg">${h(it.msg)}${it.count != null && !/곳/.test(it.msg) ? ` · ${Number(it.count).toLocaleString('ko-KR')}건` : ''}</span>` : ''}
    </div>`;
  }

  function draw(){
    const box = document.getElementById('sc-body'); if (!box) return;
    if (!SC.data) { box.innerHTML = '<div class="card"><div class="empty">불러오는 중...</div></div>'; return; }
    const items = (SC.data.items || []).slice();
    items.push(Object.assign({ key: 'trend', label: '검색 트렌드', how: '화면 열 때 시험 호출 (Edge Function)' }, SC.trend || { level: 'wait' }));
    const rank = { bad: 0, warn: 1, none: 2, wait: 3, ok: 4 };
    items.sort((a, b) => (rank[a.level] ?? 5) - (rank[b.level] ?? 5));
    const cnt = k => items.filter(i => i.level === k).length;
    const bad = cnt('bad'), warn = cnt('warn') + cnt('none');
    box.innerHTML = `
      <div class="data-note"><span class="status-dot" style="${bad ? 'background:#c8102e' : warn ? 'background:#d9a21b' : ''}"></span>
        <span>${kst(SC.data.now)} 기준 · ${bad ? '문제가 있는 항목이 있어요' : warn ? '확인할 항목이 있어요' : '모든 수집이 정상이에요'}</span>
        <button class="btn ghost cs-re" onclick="scReload()">${ic('reset')}새로고침</button></div>
      <div class="sc-sum"><div><span>정상</span><b>${cnt('ok')}</b></div><div class="w"><span>확인 필요</span><b>${warn}</b></div><div class="x"><span>문제</span><b>${bad}</b></div></div>
      <div class="sc-list">${items.map(row).join('')}</div>
      <p class="sc-foot">정해진 수집 간격보다 늦어지면 '확인 필요', 기준 시간을 넘겨 멈추면 '문제'로 표시해요. 매일 아침 8시에 같은 점검을 돌려서 확인 필요·문제가 있을 때만 관리자 메일로 알려 드려요. 검색 트렌드는 화면을 열 때만 시험해요.</p>`;
  }

    const { error } = await SB.rpc('push_prefs_save', { p: { approve: PS.data.approve, result: PS.data.result, notice: PS.data.notice, health: PS.data.health } });
    if (error) toast('저장 실패: ' + error.message);
  };
  window.pushTest = async function(){
    const { error } = await SB.rpc('push_test');
    toast(error ? error.message : '1분 안에 시험 알림이 와요.');
  };
  window.pushSettings = async function(){
    if (!user() || !window.SB) return toast('로그인 후 설정할 수 있어요.');
    const [{ data, error }, sub] = await Promise.all([SB.rpc('push_settings'), curSub().catch(() => null)]);
    if (error) return toast('불러오지 못했어요: ' + error.message);
    PS.data = data;
    const on = !!sub && Notification.permission === 'granted', w = envWarn();
    const row = (k, t, d) => `<label><span>${t}<small>${d}</small></span><input type="checkbox" ${data[k] ? 'checked' : ''} onchange="pushPref('${k}',this.checked)"></label>`;
    iModal('휴대폰 알림', `
      ${w ? `<div class="ps-warn">${w}</div>` : ''}
      <div class="ps-dev"><span>이 기기 알림 <b>${on ? '켜짐' : '꺼짐'}</b><small>내 계정에 연결된 기기 ${data.devices}대</small></span>
        ${w ? '' : on ? `<button class="btn ghost" id="ps-btn" onclick="pushOff()">끄기</button>` : `<button class="btn primary" id="ps-btn" onclick="pushOn()">알림 켜기</button>`}</div>
      <div class="ps-list">
        ${row('approve', '결재 차례', '내가 결재할 차례 · 24시간 지나면 다음 날 9시에 한 번 더')}
        ${row('result', '내 상신 결과', '승인 또는 반려')}
        ${row('notice', '필독 공지', '필독으로 올라온 공지만')}
        ${data.admin ? row('health', '수집 이상', '매출·발주·출결 수집이 멈췄을 때 (관리자)') : ''}
      </div>
      <p class="ps-note">밤 10시~아침 7시에 생긴 알림은 아침 7시에 모아서 보내요. 참조와 일반 공지는 사이트 안 🔔에서 확인해 주세요.</p>`, closeM, '닫기');
    const foot = document.querySelector('#inv-modal .im-foot');
    foot.querySelector('.btn.ghost')?.remove();
    if (data.devices) foot.insertAdjacentHTML('afterbegin', `<button class="btn ghost" style="margin-right:auto" onclick="pushTest()">시험 알림 보내기</button>`);
  };
  const closeM = () => document.getElementById('inv-modal')?.remove();

  /* ---------- 알림 눌러서 들어왔을 때 이동 ---------- */
  function route(url){
    let q; try { q = new URL(url, location.origin).searchParams; } catch (e) { return; }
    const p = q.get('go'), id = +q.get('id') || 0; if (!p) return;
    try { go(p); } catch (e) { return; }
    if (!id) return;
    setTimeout(() => {
      if (/^ap-/.test(p) && window.apOpen) apOpen(id);
      else if (p === 'notice' && window.ntOpen) ntOpen(id);
    }, 600);
  }
  let pending = new URLSearchParams(location.search).get('go') ? location.href : null;
  if (pending) history.replaceState(null, '', location.pathname);
  if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'mm-go') { if (user()) route(e.data.url); else pending = e.data.url; }
  });

  /* ---------- 로그인하면 기기 다시 연결 · 대기 중인 이동 처리 ---------- */
  let lastUid = '';
  setInterval(async () => {
    const u = user(); const app = document.getElementById('app');
    if (!u || !window.SB || !app || app.style.display === 'none') { lastUid = ''; return; }
    if (pending) { const url = pending; pending = null; route(url); }
    if (u.uid === lastUid) return; lastUid = u.uid;
    try { if (Notification.permission === 'granted') { const sub = await curSub(); if (sub) await link(sub); } } catch (e) {}
  }, 1000);

  /* ---------- 로그아웃하면 이 기기 연결 끊기 ---------- */
  if (typeof logout === 'function') {
    const logoutPush = logout;
    logout = async function(){
      try { const sub = await curSub(); if (sub && window.SB && user()) await SB.rpc('push_unsubscribe', { p_endpoint: sub.endpoint }); } catch (e) {}
      return logoutPush.apply(this, arguments);
    };
  }
})();
</script>
<script>
/* ==========================================================
   프로필 사진 + 사이드바 접기 (2026-11-04 밤)
   - 사진: Supabase Storage 'avatars'(비공개, <uid>.jpg, 1MB·jpeg) + profiles.avatar_ver
           avatar_map() = {uid: 버전}, avatar_set(uid, 버전|null) — 본인 또는 관리자만
   - 화면에서 256px 정사각형 JPEG로 줄여서 올림
   - 보이는 곳: 상단 사용자, 사용자 관리 목록·편집·등록, 결재라인 선택·결재 단계·참조
   - 사이드바 접기: PC(861px 이상)만, 접으면 아이콘만 + 올리면 하위 메뉴, 상태는 이 기기에 기억
   ========================================================== */
(function(){
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const AV = { map: {}, url: {}, ver: {}, at: 0, busy: null, uid: '' };
  const BUCKET = 'avatars', SIZE = 256;
  const me = () => (typeof SESSION !== 'undefined' && SESSION.user) ? SESSION.user : null;
  const ini = n => (String(n || '?').trim() || '?')[0];

  /* ---------- 사진 그리기 ---------- */
  function inner(uid, name){
    const u = uid && AV.url[uid];
    return u ? `<img src="${h(u)}" alt="" loading="lazy" onerror="this.remove()">` : h(ini(name));
  }
  window.mmAv = function(uid, name, cls){
    return `<span class="mm-av ${cls || ''}" data-av="${h(uid || '')}" data-n="${h(name || '')}" aria-hidden="true">${inner(uid, name)}</span>`;
  };
  function paint(){
    document.querySelectorAll('[data-av]').forEach(el => {
      const uid = el.dataset.av; if (!uid) return;
      const want = AV.url[uid] || '';
      const img = el.querySelector('img');
      if (want && img && img.getAttribute('src') === want) return;
      if (!want && !img && el.textContent) return;
      el.innerHTML = inner(uid, el.dataset.n);
    });
  }
  window.mmAvPaint = paint;

  /* ---------- 사진 목록 불러오기 (서명 주소 12시간) ---------- */
  async function load(force){
    const u = me(); if (!u || !window.SB) return;
    if (AV.uid !== u.uid) { AV.uid = u.uid; AV.map = {}; AV.url = {}; AV.ver = {}; AV.at = 0; }
    if (!force && AV.at && Date.now() - AV.at < 6 * 3600e3) return paint();
    if (AV.busy) return AV.busy;
    AV.busy = (async () => {
      try {
        const { data, error } = await SB.rpc('avatar_map'); if (error) throw error;
        AV.map = data || {};
        for (const k of Object.keys(AV.url)) if (!AV.map[k]) { delete AV.url[k]; delete AV.ver[k]; }
        const need = Object.keys(AV.map).filter(k => force || AV.ver[k] !== AV.map[k] || !AV.url[k]);
        if (need.length) {
          const { data: s, error: e2 } = await SB.storage.from(BUCKET).createSignedUrls(need.map(k => k + '.jpg'), 12 * 3600);
          if (e2) throw e2;
          (s || []).forEach((r, i) => { const k = need[i]; if (r && r.signedUrl) { AV.url[k] = r.signedUrl; AV.ver[k] = AV.map[k]; } });
        }
        AV.at = Date.now();
      } catch (e) { console.warn('사진 불러오기 실패', e); }
      finally { AV.busy = null; paint(); }
    })();
    return AV.busy;
  }
  window.mmAvLoad = load;

  /* ---------- 사진 줄이기: 가운데 정사각형 256px JPEG ---------- */
  function shrink(file){
    return new Promise((ok, no) => {
      if (!file || !/^image\//.test(file.type || 'image/')) return no(new Error('사진 파일만 올릴 수 있어요.'));
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        try {
          const w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(w, hh);
          const c = document.createElement('canvas'); c.width = c.height = SIZE;
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, SIZE, SIZE);
          g.drawImage(img, (w - s) / 2, (hh - s) / 2, s, s, 0, 0, SIZE, SIZE);
          c.toBlob(b => { URL.revokeObjectURL(url); b ? ok(b) : no(new Error('사진을 바꾸지 못했어요.')); }, 'image/jpeg', 0.86);
        } catch (e) { URL.revokeObjectURL(url); no(e); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); no(new Error('이 사진은 열 수 없어요. 다른 사진(JPG·PNG)으로 해 주세요.')); };
      img.src = url;
    });
  }
  async function upload(uid, blob){
    const { error } = await SB.storage.from(BUCKET).upload(uid + '.jpg', blob, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
    if (error) throw new Error('사진을 올리지 못했어요. (' + error.message + ')');
    const r = await SB.rpc('avatar_set', { u: uid, ver: Date.now() }); if (r.error) throw r.error;
    delete AV.ver[uid]; await load(true);
  }
  async function remove(uid){
    const r = await SB.rpc('avatar_set', { u: uid, ver: null }); if (r.error) throw r.error;
    try { await SB.storage.from(BUCKET).remove([uid + '.jpg']); } catch (e) {}
    delete AV.url[uid]; delete AV.ver[uid]; await load(true);
  }

  /* ---------- 사진 바꾸기 창 (본인 또는 관리자) ---------- */
  let PICK = null;
  window.mmPhoto = function(uid, name){
    if (!uid || !window.SB) return;
    const u = me(); const admin = !!(u && u.role === 'admin');
    if (!u || (uid !== u.uid && !admin)) return toast('본인 사진만 바꿀 수 있어요.');
    PICK = { uid, name, blob: null, del: false };
    const has = !!AV.url[uid];
    iModal(uid === u.uid ? '내 사진' : name + '님 사진', `
      <div class="mm-ph">
        <div class="mm-ph-pre" id="mm-ph-pre">${mmAv(uid, name, 'xl')}</div>
        <p class="mm-ph-tip">얼굴이 가운데 오는 사진이 좋아요. 정사각형으로 잘라서 작게 저장돼요.</p>
        <div class="mm-ph-btns">
          <label class="btn ghost mm-ph-file">${ic('plus')}사진 고르기<input type="file" accept="image/*" onchange="mmPhotoFile(this)" hidden></label>
          <button type="button" class="btn ghost mm-ph-del" id="mm-ph-del" onclick="mmPhotoDel()" ${has ? '' : 'hidden'}>사진 지우기</button>
        </div>
        <div class="u-err" id="mm-ph-err" role="alert"></div>
      </div>`, mmPhotoSave, '저장');
    document.getElementById('im-save').disabled = true;
  };
  window.mmPhotoFile = async function(inp){
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f || !PICK) return;
    const err = document.getElementById('mm-ph-err'); err.textContent = '';
    try {
      PICK.blob = await shrink(f); PICK.del = false;
      const pre = document.getElementById('mm-ph-pre');
      pre.innerHTML = `<span class="mm-av xl"><img src="${URL.createObjectURL(PICK.blob)}" alt=""></span>`;
      document.getElementById('mm-ph-del').hidden = false;
      document.getElementById('im-save').disabled = false;
    } catch (e) { err.textContent = e.message; }
  };
  window.mmPhotoDel = function(){
    if (!PICK) return;
    PICK.blob = null; PICK.del = !!AV.url[PICK.uid];
    document.getElementById('mm-ph-pre').innerHTML = `<span class="mm-av xl">${h(ini(PICK.name))}</span>`;
    document.getElementById('mm-ph-del').hidden = true;
    document.getElementById('im-save').disabled = !PICK.del;
  };
  async function mmPhotoSave(){
    if (!PICK) return;
    const b = document.getElementById('im-save'), err = document.getElementById('mm-ph-err');
    b.disabled = true; b.textContent = '저장 중...';
    try {
      if (PICK.blob) await upload(PICK.uid, PICK.blob); else if (PICK.del) await remove(PICK.uid);
      document.getElementById('inv-modal')?.remove();
      toast(PICK.blob ? '사진을 바꿨어요.' : '사진을 지웠어요.'); PICK = null;
    } catch (e) { err.textContent = e.message || String(e); b.disabled = false; b.textContent = '저장'; }
  }

  /* ---------- 상단 사용자: 사진 + 누르면 내 사진 바꾸기 ---------- */
  if (typeof setTopUser === 'function') {
    const base = setTopUser;
    setTopUser = function(u){
      base.apply(this, arguments);
      const a = document.querySelector('.top .av'); if (!a || !u) return;
      a.dataset.av = u.uid || ''; a.dataset.n = u.name || '';
      a.classList.add('mm-av-top'); a.setAttribute('role', 'button'); a.tabIndex = 0;
      a.title = '내 사진 바꾸기'; a.setAttribute('aria-label', '내 사진 바꾸기');
      a.onclick = () => { const m = me(); if (m) mmPhoto(m.uid, m.name); };
      a.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.onclick(); } };
      if (AV.url[u.uid]) a.innerHTML = inner(u.uid, u.name);
      load();
    };
  }
  // 이 코드보다 로그인 복원이 먼저 끝난 경우에도 상단 사진을 붙임
  try { if (me() && typeof setTopUser === 'function') setTopUser(me()); } catch (e) {}

  /* ---------- 사용자 등록·편집 화면에 사진 칸 ---------- */
  let NEWPIC = null;
  if (typeof userForm === 'function') {
    const base = userForm;
    userForm = function(u, mode){
      const html = base.apply(this, arguments);
      const row = mode === 'edit' && u
        ? `<div class="mm-avf">${mmAv(u.uid, u.name, 'lg')}<div><b>사진</b><small>목록·결재라인·상단에 보여요</small></div><button type="button" class="btn ghost" onclick="mmPhoto('${h(u.uid)}', this.closest('.modal').querySelector('#u-name').value || '${h(u.name)}')">사진 바꾸기</button></div>`
        : `<div class="mm-avf"><span class="mm-av lg" id="mm-new-av">?</span><div><b>사진 <span>선택</span></b><small>나중에 본인이 직접 바꿀 수도 있어요</small></div><label class="btn ghost">사진 고르기<input type="file" accept="image/*" onchange="mmNewPic(this)" hidden></label><button type="button" class="btn ghost" id="mm-new-del" onclick="mmNewPic(null)" hidden>빼기</button></div>`;
      if (mode !== 'edit') NEWPIC = null;
      return row + html;
    };
  }
  window.mmNewPic = async function(inp){
    const box = document.getElementById('mm-new-av'), del = document.getElementById('mm-new-del'); if (!box) return;
    if (!inp) { NEWPIC = null; box.textContent = (document.getElementById('u-name')?.value || '?')[0]; del.hidden = true; return; }
    const f = inp.files && inp.files[0]; inp.value = ''; if (!f) return;
    try { NEWPIC = await shrink(f); box.innerHTML = `<img src="${URL.createObjectURL(NEWPIC)}" alt="">`; del.hidden = false; }
    catch (e) { const er = document.getElementById('u-err'); if (er) er.textContent = e.message; }
  };
  // 계정을 만든 직후 고른 사진 올리기 (실패해도 계정은 그대로)
  window.mmAvAfterCreate = async function(uid){
    if (!NEWPIC || !uid) return;
    const b = NEWPIC; NEWPIC = null;
    try { await upload(uid, b); } catch (e) { setTimeout(() => toast('계정은 만들었지만 사진은 못 올렸어요. 편집에서 다시 올려 주세요.'), 3200); }
  };

  /* ---------- 사이드바 접기 (PC) ---------- */
  const KEY = 'mm-side-col', wide = () => window.matchMedia('(min-width: 861px)').matches;
  let col = false; try { col = localStorage.getItem(KEY) === '1'; } catch (e) {}
  const top = document.querySelector('.top');
  if (top && !document.getElementById('mm-sidetog')) {
    top.insertAdjacentHTML('afterbegin', `<button class="mm-sidetog" id="mm-sidetog" type="button" onclick="mmSideToggle()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M9 5v14"/><path class="mm-st-ar" d="M15 10l-2 2 2 2"/></svg></button>`);
  }
  function applyCol(){
    document.body.classList.toggle('mm-col', col);
    const b = document.getElementById('mm-sidetog');
    if (b) { const t = col ? '메뉴 펼치기' : '메뉴 접기'; b.title = t; b.setAttribute('aria-label', t); b.setAttribute('aria-pressed', String(col)); }
    hideFly();
  }
  window.mmSideToggle = function(){ col = !col; try { localStorage.setItem(KEY, col ? '1' : '0'); } catch (e) {} applyCol(); };

  // 접힌 상태: 아이콘에 올리거나 누르면 옆에 하위 메뉴
  const fly = document.createElement('div'); fly.id = 'mm-fly'; fly.hidden = true; document.body.appendChild(fly);
  let flyCat = null, flyT = 0;
  const on = () => col && wide();
  function showFly(cat){
    clearTimeout(flyT);
    if (flyCat === cat && !fly.hidden) return;
    flyCat = cat;
    const sub = cat.nextElementSibling && cat.nextElementSibling.classList.contains('sub') ? cat.nextElementSibling : null;
    const title = (cat.textContent || '').replace(/\d+\+?$/, '').replace('준비중', '').trim();
    fly.innerHTML = `<div class="mm-fly-t">${h(title)}${cat.querySelector('.soon') ? '<small>준비중</small>' : ''}</div>`;
    if (sub) {
      const box = document.createElement('div'); box.className = 'mm-fly-l';
      sub.querySelectorAll('a').forEach(a => { const c = a.cloneNode(true); c.addEventListener('click', hideFly); box.appendChild(c); });
      fly.appendChild(box); fly.classList.add('has'); 
    } else fly.classList.remove('has');
    fly.hidden = false;
    const r = cat.getBoundingClientRect(), sr = document.getElementById('side').getBoundingClientRect();
    fly.style.left = (sr.right + 6) + 'px';
    const fh = fly.offsetHeight;
    fly.style.top = Math.max(8, Math.min(r.top, window.innerHeight - fh - 8)) + 'px';
  }
  function hideFly(){ clearTimeout(flyT); fly.hidden = true; flyCat = null; }
  const later = () => { clearTimeout(flyT); flyT = setTimeout(hideFly, 220); };
  const side = document.getElementById('side');
  if (side) {
    side.addEventListener('mouseover', e => { if (!on()) return; const c = e.target.closest('.cat'); if (c) showFly(c); });
    side.addEventListener('mouseleave', () => { if (on()) later(); });
    side.addEventListener('click', e => {
      if (!on()) return;
      const c = e.target.closest('.cat'); if (!c) return;
      const sub = c.nextElementSibling && c.nextElementSibling.classList.contains('sub');
      if (sub) { e.stopPropagation(); e.preventDefault(); showFly(c); } else hideFly();
    }, true);
    side.addEventListener('scroll', hideFly);
  }
  fly.addEventListener('mouseenter', () => clearTimeout(flyT));
  fly.addEventListener('mouseleave', later);
  document.addEventListener('click', e => { if (!fly.hidden && !fly.contains(e.target) && !(side && side.contains(e.target))) hideFly(); });
  window.addEventListener('resize', hideFly);
  if (typeof go === 'function') { const g = go; go = function(){ hideFly(); return g.apply(this, arguments); }; }
  applyCol();

  /* ---------- 스타일 ---------- */
  const st = document.createElement('style');
  st.textContent = `
  .mm-av{width:26px;height:26px;border-radius:50%;background:#ecede7;color:#49523f;display:inline-grid;place-items:center;font-weight:700;font-size:11px;flex:none;overflow:hidden;vertical-align:middle;line-height:1}
  .mm-av img{width:100%;height:100%;object-fit:cover;display:block}
  .mm-av.sm{width:20px;height:20px;font-size:10px}
  .mm-av.lg{width:48px;height:48px;font-size:17px}
  .mm-av.xl{width:112px;height:112px;font-size:38px}
  .top .av{overflow:hidden}.top .av img{width:100%;height:100%;object-fit:cover;display:block}
  .mm-av-top{cursor:pointer}.mm-av-top:hover{box-shadow:0 0 0 2px #e9c8c9}.mm-av-top:focus-visible{outline:2px solid #c62429;outline-offset:2px}
  .mm-ph{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 2px;text-align:center}
  .mm-ph-tip{margin:0;font-size:12px;color:#7a836f;line-height:1.6}
  .mm-ph-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .mm-ph-btns .btn,.mm-avf .btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:12px;padding:7px 14px}
  .mm-ph-del{color:#a3262c}
  .mm-avf{display:flex;align-items:center;gap:12px;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid #eef0e8}
  .mm-avf>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .mm-avf b{font-size:12px;color:#49523f}.mm-avf b span{font-weight:400;color:#a0a797;font-size:11px;margin-left:4px}
  .mm-avf small{font-size:11px;color:#969c8e}
  .mm-who{display:flex;align-items:center;gap:9px}.mm-who>div{min-width:0}
  .ap-pp>div>span.mm-av{flex:none;margin-right:-2px}

(function(){

  ];

      gi < 0 ? rest.push(u) : buckets[gi].push(u);
    });
    buckets.forEach((list, gi) => list.sort((x, y) => GROUPS[gi][1].indexOf(x.name) - GROUPS[gi][1].indexOf(y.name)));
    buckets[3].push(...rest);
    GROUPS.map((g, i) => [g[0], buckets[i]]).concat([['준비 중', soon]]).forEach(([t, list]) => {
      if (!list.length) return;

    const w = String(n || '').trim().split(/\s+/);
    if (w.length > 1 && /^[가-힣]{2,3}$/.test(w[w.length - 1])) return w[w.length - 1];

<script>
// v6.x: 제때 조회 — 고른 기간을 서버에서 받아 조회 (달력 기준 3개월: 시작일 3개월 뒤 같은 날의 전날까지)
(function(){
  const addM = (d, n) => { const [y, m, dd] = d.split('-').map(Number); const last = new Date(Date.UTC(y, m - 1 + n + 1, 0)).getUTCDate(); return new Date(Date.UTC(y, m - 1 + n, Math.min(dd, last))).toISOString().slice(0, 10); };
  window.jtMaxTo = from => { const x = addM(from, 3); return new Date(Date.parse(x) - 864e5).toISOString().slice(0, 10); };
  const setRangeBase = setRange;
  setRange = function(k){
    if (k === 'ly') {
      const t = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
      const y = Number(t.slice(0, 4)) - 1, m = Number(t.slice(5, 7));
      const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      d1.value = `${y}-${String(m).padStart(2, '0')}-01`; d2.value = `${y}-${String(m).padStart(2, '0')}-${String(last).padStart(2, '0')}`;
      return;
    }
    setRangeBase(k);
  };
  const basisNow = () => document.getElementById('adv-order')?.checked ? 'order' : (document.querySelector('#basis .on')?.dataset.v || 'ship');
  function checkRange(){
    const a = document.getElementById('d1'), b = document.getElementById('d2'), err = document.getElementById('filter-error');
    if (!a || !b) return null;
    const say = m => { if (err) err.textContent = m; return null; };
    if (!a.value || !b.value || a.value > b.value) return say('시작일과 종료일을 확인해주세요. 시작일은 종료일보다 늦을 수 없어요.');
    if (META.jetteFrom && b.value < META.jetteFrom) return say(`제때 자료는 ${META.jetteFrom} 부터 있어요.`);
    const mx = jtMaxTo(a.value);
    if (b.value > mx) return say(`한 번에 최대 3개월까지 조회할 수 있어요. 시작일이 ${a.value}이면 종료일은 ${mx}까지예요.`);
    if (err) err.textContent = '';
    return [a.value, b.value, basisNow()];
  }
  function refreshCats(){
    const sel = document.getElementById('adv-cat'); if (!sel) return;
    const v = sel.value;
    sel.innerHTML = '<option value="">전체 품목</option>' + CATS.map(c => `<option>${c}</option>`).join('');
    if (v && CATS.indexOf(v) < 0) sel.insertAdjacentHTML('beforeend', `<option>${v}</option>`);
    sel.value = v;
  }
  // 매장 선택: 영업 중 → 본사 → (체크 시) 폐점 순으로 묶어서 표시. 폐점은 '폐점 매장 포함'을 켰을 때만 보임
  //   값은 매장 이름 그대로라 조회에는 영향 없음. '전체 매장'은 체크와 상관없이 그 기간 모든 매장 포함
  window.JT_SHOW_CLOSED = window.JT_SHOW_CLOSED || false;
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  function buildStores(fromToggle){
    const sel = document.getElementById('st'); if (!sel) return;
    let cur = sel.value;
    const st = n => (MASTER[n] || {}).status || '';
    const sorted = STORES.slice().sort((a, b) => a.localeCompare(b, 'ko'));
    const open = sorted.filter(n => st(n) !== '폐점' && st(n) !== '본사');
    const hq = sorted.filter(n => st(n) === '본사');
    const closed = sorted.filter(n => st(n) === '폐점');
    if (!fromToggle && cur && closed.indexOf(cur) >= 0) window.JT_SHOW_CLOSED = true;   // 대시보드 등에서 폐점 매장으로 들어온 경우
    const opt = (n, lab) => `<option value="${esc(n)}">${esc(lab || n)}</option>`;
    sel.innerHTML = '<option value="">전체 매장</option>' +
      `<optgroup label="영업 중 (${open.length}곳)">${open.map(n => opt(n)).join('')}</optgroup>` +
      (hq.length ? `<optgroup label="본사">${hq.map(n => opt(n)).join('')}</optgroup>` : '') +
      (window.JT_SHOW_CLOSED && closed.length ? `<optgroup label="폐점 (${closed.length}곳)">${closed.map(n => opt(n, n + ' (폐점)')).join('')}</optgroup>` : '');
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : '';
    if (!document.getElementById('st-closed')) {
      sel.insertAdjacentHTML('afterend', `<label class="st-closed" style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:#5b6253;cursor:pointer"><input type="checkbox" id="st-closed" ${window.JT_SHOW_CLOSED ? 'checked' : ''} style="margin:0"> 폐점 매장 포함 <small style="color:#8a9083">(${closed.length}곳)</small></label>`);
      document.getElementById('st-closed').addEventListener('change', e => { window.JT_SHOW_CLOSED = e.target.checked; buildStores(true); });
    } else {
      document.getElementById('st-closed').checked = window.JT_SHOW_CLOSED;
    }
    sel.dataset.built = '1';
  }
  function markClosed(){
    const sel = document.getElementById('st'); if (!sel) return;
    if (!sel.dataset.built) buildStores();
    else if (sel.value && ((MASTER[sel.value] || {}).status === '폐점') && !window.JT_SHOW_CLOSED) buildStores();
  }
  function wrap(base){
    let seq = 0;
    return async function(){
      markClosed();
      const r = checkRange(); if (!r) return;
      const h = window.JT_HAS;
      if (!(h && h[2] === r[2] && h[0] <= r[0] && r[1] <= h[1])) {
        const my = ++seq, res = document.getElementById('res');

        try { await jtFetch(r[0], r[1], r[2]); }

          if (my !== seq) return;
          const m = (e && e.message) || '';

          return;
        }
        if (my !== seq) return;
        refreshCats();
      }
      base();
    };
  }
  runStoreOrders = wrap(runStoreOrders);
  runPeriod = wrap(runPeriod);
})();
</script>
<script>
/* ==========================================================
   앱 아이콘 숫자 (2026-11-06)
   - 숫자 = 상단 🔔 숫자와 같음 (안 읽은 공지 + 결재 차례 + 새 참조 + 내 상신 결과)
   - 앱을 열거나 화면으로 돌아올 때·2분마다 공지/결재를 새로 불러올 때 정확한 숫자로 맞춤
   - 앱이 꺼져 있을 때 알림이 오면 sw.js가 1씩 올림 (저장 위치: 캐시 '/__mm-badge')
   - 아이폰(홈 화면 앱 + 알림 허용)에서 숫자 표시 / 안드로이드는 휴대폰이 알림 개수로 자동 표시
   - 로그아웃하면 숫자 지움
   ========================================================== */
(function(){
  if (!('setAppBadge' in navigator)) return;
  const KEY = '/__mm-badge';
  let last = -1, timer = 0;
  async function save(n){
    try { const c = await caches.open('mm-badge'); await c.put(KEY, new Response(String(n))); } catch (e) {}
  }
  function count(){
    const u = (typeof SESSION !== 'undefined' && SESSION && SESSION.user) ? SESSION.user : null;
    if (!u) return 0;
    const b = document.getElementById('nt-bell'); if (!b) return 0;
    const m = (b.getAttribute('aria-label') || '').match(/(\d+)건/);   // 🔔에 적힌 숫자 그대로
    return m ? +m[1] : 0;
  }
  function apply(){
    clearTimeout(timer);
    timer = setTimeout(() => {
      const n = count(); if (n === last) return; last = n;
      try { (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
      save(n);
    }, 300);
  }
  // 🔔 숫자가 바뀔 때마다 따라감
  const top = document.querySelector('.top');
  if (top) new MutationObserver(apply).observe(top, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-label'] });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = -1; apply(); } });
  if (typeof logout === 'function') {
    const logoutBadge = logout;
    logout = function(){
      last = 0; try { navigator.clearAppBadge().catch(() => {}); } catch (e) {} save(0);
      return logoutBadge.apply(this, arguments);
    };
  }
  apply();
})();
</script>

  try { add(); } catch (e) {}

  const st = document.createElement('style');
  st.textContent = `
  .sub a.bc-link{padding-right:32px}
  .sub a.bc-link .bc-ext{position:absolute;right:10px;top:50%;width:13px;height:13px;margin-top:-6.5px;opacity:.55}
  .sub a.bc-link:hover .bc-ext{opacity:1}
  .mm-fly-l a.bc-link{position:relative;padding-right:30px}
  .mm-fly-l a.bc-link .bc-ext{position:absolute;right:9px;top:50%;width:12px;height:12px;margin-top:-6px;opacity:.6}`;
  document.head.appendChild(st);
})();
</script>
<script>
/* ==========================================================
   조직도 · 회사·조직 설정 · 직영점 관리(직원 현황 · 시프트 관리) (2026-11-07)
   - 메뉴: 운영 > 조직도 / 운영 > 직영점 관리(직원 현황·시프트 관리·출결 관리) / 관리 > 회사·조직 설정(관리자, 본사 인원 포함)
   - 데이터: Supabase 함수(dm_boot, org_*, staff_*, shift_*) — 표는 직접 못 읽고 함수로만 읽고 씀
   - 기존 코드는 고치지 않고, 마지막 renderSide · go 뒤에 붙임
   ========================================================== */
(function(){
  const WD = ['월','화','수','목','금','토','일'];
  const SLOT = {L:'런치', D:'디너', F:'풀타임'};
  const CODE = {F:'출근', L:'런치만', D:'디너만', H:'반휴무', O:'휴무', V:'월차', N:'—'};
  const CODES = ['F','L','D','H','O','V','N'];
  const CODE_ST = {F:'출근', L:'런치만(반휴)', D:'디너만(반휴)', O:'휴무', V:'월차'};
  const CODE_PT = {F:'풀타임', L:'런치', D:'디너', O:'휴무', N:'—'};
  const isPt = p => p && (p.kind === 'pt' || p.kind === 'tmp');
  const cOf = c => c === 'H' ? 'L' : c;
  const codesOf = (p, cur) => { const m = isPt(p) ? CODE_PT : CODE_ST, ks = Object.keys(m); const c = cOf(cur); if (c && !ks.includes(c)) ks.push(c); return ks.map(k => [k, m[k] || CODE[k]]); };
  const labOf = (p, c) => { c = cOf(c); return (isPt(p) ? CODE_PT : CODE_ST)[c] || CODE[c] || ''; };
  const COLORS = ['#5b6b4e','#c62429','#2a6fb0','#c08a00','#7a4fa0','#c25a8a','#46708f','#2b8a6e','#8a8476','#b5562b','#3f8f8f','#9a4f6a'];
  const BCOLS = ['#c62429','#8a5a2b','#2a6fb0','#2b8a6e','#7a4fa0','#c08a00'];
  const REGIONS = ['수도권','강원','충청','경상','전라','제주'];
  const DUTY = ['홀','주방'];
  const BANKS = ['국민','신한','우리','하나','농협','기업','카카오뱅크','토스뱅크','케이뱅크','새마을금고','우체국','수협','신협','SC제일','iM뱅크(대구)','부산','경남','광주','전북','제주','씨티','산업'];
  const DOCS = [['rrn','주민번호'],['bank','급여 계좌'],['idc','신분증 사본'],['ctr','근로계약서']];
  const PAGES = { org:'연락망', 'bs-set':'회사·조직 설정', 'dm-staff':'직원 현황', 'dm-shift':'시프트 관리' };
  const DM = { boot:null, store:null };
  try { DM.store = +localStorage.getItem('dm-store') || null; } catch(e) {}

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SESS = () => (typeof SESSION !== 'undefined' ? SESSION : null);
  const role = () => { const S = SESS(); return (S && S.user && S.user.role) || ''; };
  const isAdmin = () => role() === 'admin';
  const isHQ = () => role() === 'admin' || role() === 'hq';
  const ready = () => { const S = SESS(); return !!(S && S.user && !S.mustChange && window.SB); };
  const colorOf = id => COLORS[Math.abs(+id || 0) % COLORS.length];
  const fmtD = d => d ? String(d).slice(2,10).replace(/-/g,'.') : '';
  const daysTxt = ds => !ds || !ds.length ? '' : ds.length === 7 ? '매일' : ds.slice().sort().map(i => WD[i]).join('·');
  const pad = n => String(n).padStart(2,'0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const miss = '<span class="dm-miss">미입력</span>';
  const errMsg = e => (e && (e.message || e.details)) ? String(e.message || e.details).replace(/^.*?:\s*/, '') : '다시 시도해 주세요';
  async function rpc(fn, args){
    const { data, error } = await window.SB.rpc(fn, args || {});
    if (error) throw error;
    return data;
  }
  async function boot(force){
    if (DM.boot && !force) return DM.boot;
    DM.boot = await rpc('dm_boot');
    const ids = DM.boot.direct.map(s => s.id);
    if (!ids.includes(DM.store)) DM.store = DM.boot.my_store && ids.includes(DM.boot.my_store) ? DM.boot.my_store : (ids[0] || null);
    return DM.boot;
  }
  function setStore(id){ DM.store = id; try { localStorage.setItem('dm-store', id); } catch(e) {} }
  const main = () => document.getElementById('main');
  const loading = t => `<section class="card"><div class="dm-empty">${t || '불러오는 중...'}</div></section>`;

  /* ---------- 공통 창 ---------- */
  function modal(title, sub, body, foot, wide){
    closeModal();
    const m = document.createElement('div'); m.id = 'dm-modal';
    m.innerHTML = `<div class="dm-mbg" onclick="dmClose()"></div><div class="dm-mbox ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="dm-mh"><strong>${esc(title)}</strong><button class="dm-x" onclick="dmClose()" aria-label="닫기">✕</button></div>
      ${sub ? `<div class="dm-msub">${sub}</div>` : ''}<div class="dm-mbody">${body}</div><div class="dm-mfoot">${foot || ''}</div></div>`;
    document.body.appendChild(m);
    setTimeout(() => m.querySelector('input:not([type=checkbox]):not([disabled]),select')?.focus(), 40);
  }
  function closeModal(){ document.getElementById('dm-modal')?.remove(); }
  window.dmClose = closeModal;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  const foot = (save, extra) => `${extra || ''}<span style="flex:1"></span><button class="dmb" onclick="dmClose()">취소</button><button class="dmb pri" onclick="${save}">저장</button>`;
  async function run(btn, fn, okMsg){
    if (btn) { btn.disabled = true; }
    try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { console.warn(e); toast('저장하지 못했어요: ' + errMsg(e)); throw e; }
    finally { if (btn) btn.disabled = false; }
  }

  function storeTabs(withHQ, onPick){
    const b = DM.boot; if (!b) return '';
    const hq = withHQ && isHQ();
    const tabs = (hq ? [{id:'hq', name:'본사'}] : []).concat(b.direct);
    if (tabs.length <= 1) return '';
    return `<div class="dm-stabs" role="tablist">${tabs.map(s => `<button class="${String(DM.cur) === String(s.id) ? 'on' : ''}" onclick="${onPick}('${s.id}')">${esc(s.name)}${s.status === '오픈준비' ? ' <small>오픈 준비</small>' : ''}</button>`).join('')}</div>`;
  }

  /* ==========================================================
     조직도
     ========================================================== */
  const ORG = { data:null, open:new Set(['corp','hq']), sel:null, q:'' };
  async function pageOrg(){
    main().innerHTML = simpleHero(['연락망'], 'DIRECTORY', '연락망', '묶음을 누르면 선을 따라 아래로 펼쳐지고, 이름을 누르면 옆에 입사년도·직급·연락처가 나와요.')
      + `<div class="dm-orgbar"><input class="dm-search" id="org-q" placeholder="이름·매장명 검색" oninput="dmOrgQ(this.value)" aria-label="이름·매장명 검색"></div>
         <div class="dm-dir"><section class="dm-tree" id="org-tree">${'<div class="dm-empty">불러오는 중...</div>'}</section><aside class="dm-pcard" id="org-card"></aside></div>` + pageFoot();
    try { ORG.data = await rpc('org_data'); } catch (e) { document.getElementById('org-tree').innerHTML = `<div class="dm-empty">연락망을 불러오지 못했어요. (${esc(errMsg(e))})</div>`; return; }
    const d = ORG.data;
    if (!ORG.inited) { ORG.inited = true; d.brands.filter(b => b.status !== '폐점').forEach(b => ORG.open.add('b' + b.id)); d.stores.filter(s => s.direct).forEach(s => { if (s.id === d.my_store || ORG.open.size < 6) ORG.open.add('s' + s.id); }); }
    orgDraw();
  }
  function orgTree(){
    const d = ORG.data, hq = d.role === 'admin' || d.role === 'hq';
    const person = p => ({ ...p, org: p.store_id ? (d.stores.find(s => s.id === p.store_id)?.name || '') : '본사' });
    const ceo = { k:'ceo', t:'대표', ppl:[{ id:'ceo', ceo:true, name: d.company?.ceo_name || '대표님', rank: d.company?.ceo_title || '대표이사', tel: d.company?.ceo_tel, org:'대표', noname: !d.company?.ceo_name }] };
    const hqN = { k:'hq', t:'본사', ppl: d.people.filter(p => p.kind === 'hq').map(person) };
    const brands = d.brands.map(b => {
      const direct = d.stores.filter(s => s.brand_id === b.id && s.direct).map(s => ({ k:'s'+s.id, t:s.name, badge:'직영', soon: s.status === '오픈준비',
        ppl: d.people.filter(p => p.store_id === s.id).map(person) }));
      const fr = d.stores.filter(s => s.brand_id === b.id && !s.direct);
      const regions = [...new Set(fr.map(s => s.region || '지역 미지정'))].sort((a,b2) => (a === '지역 미지정') - (b2 === '지역 미지정') || a.localeCompare(b2,'ko'));
      const kids = direct.slice();
      if (hq && fr.length) kids.push({ k:'f'+b.id, t:'가맹점', lock:true, kids: regions.map(r => ({ k:'f'+b.id+r, t:r,
        ppl: fr.filter(s => (s.region || '지역 미지정') === r).map(s => ({ id:'st'+s.id, store:true, name:s.name, owner:s.owner, sv:s.sv, tel:s.owner_tel, org:`${b.name} · 가맹점 · ${r}` })) })) });
      return { k:'b'+b.id, t:b.name, brand:true, closed: b.status === '폐점', soon: b.status === '오픈준비', kids };
    });
    return { k:'corp', t: d.company?.name || '멘야마쯔리(주)', root:true, kids:[ceo, hqN, ...brands] };
  }
  const cnt = n => n.kids ? n.kids.reduce((a,k) => a + cnt(k), 0) : (n.ppl || []).length;
  const match = p => ORG.q && (String(p.name).includes(ORG.q) || String(p.owner || '').includes(ORG.q));
  const hasMatch = n => n.kids ? n.kids.some(hasMatch) : (n.ppl || []).some(match);
  function orgNode(n){
    const open = ORG.q ? hasMatch(n) : ORG.open.has(n.k);
    const head = `<button class="dm-nh ${n.root ? 'root' : ''} ${n.brand ? 'brand' : ''}" onclick="dmOrgTog('${esc(n.k)}')" aria-expanded="${open}"><span class="ar">▶</span>${esc(n.t)} <span class="c">${n.soon && !cnt(n) ? '' : cnt(n)}</span>${n.badge ? `<span class="bdg">${n.badge}</span>` : ''}${n.soon ? '<span class="tag">오픈 준비</span>' : ''}${n.closed ? '<span class="tag off">현재 폐점</span>' : ''}${n.lock ? '<span class="lk">🔒 본사·관리자만</span>' : ''}</button>`;
    let body;
    if (n.kids) body = n.kids.map(orgNode).join('') || `<div class="dm-ek">${n.closed ? '현재 운영 중인 매장이 없어요.' : '아직 매장이 없어요.'}</div>`;
    else if (n.ppl.length) body = n.ppl.map(p => `<div class="dm-pp ${ORG.sel && ORG.sel.id === p.id ? 'on' : ''} ${match(p) ? 'hit' : ''}" onclick="dmOrgSel('${esc(p.id)}')"><b>${esc(p.name)}</b>${!p.store && p.rank ? `<span class="dm-rk">${esc(p.rank)}</span>` : ''}${p.store && p.owner ? `<span class="dm-rk dm-ow">${esc(p.owner)}</span>` : ''}<span class="r">${p.store ? (p.sv ? '담당 S.V ' + esc(p.sv) : '') : esc(personRole(p))}</span>${p.locked ? '<span class="lk2">🔒</span>' : `<span class="tel2">${p.tel ? esc(mmTel(p.tel)) : (p.store ? '연락처 미입력' : '')}</span>`}</div>`).join('');
    else body = `<div class="dm-ek">${n.soon ? '직원 현황에 등록하면 자동으로 나와요.' : '없음'}</div>`;
    return `<div class="dm-node ${open ? 'open' : ''}">${head}<div class="dm-kids">${body}</div></div>`;
  }
  function personRole(p){
    if (p.kind === 'hq' || p.ceo) return [p.rank, p.duty].filter(Boolean).join(' · ');
    if (p.kind === 'staff') return `${p.rank || '직원'} · 주${p.wk || 6}일`;
    if (p.kind === 'pt') return `${p.rank || 'PT'} · ${daysTxt(p.days)} ${SLOT[p.slot] || ''}`;
    return p.rank || '';
  }
  function allPeople(n, out){ out = out || []; if (n.kids) n.kids.forEach(k => allPeople(k, out)); else (n.ppl || []).forEach(p => out.push(p)); return out; }
  function orgDraw(){
    const t = orgTree();
    document.getElementById('org-tree').innerHTML = `<div class="dm-th"><b>전체</b><small>${cnt(t)}</small><button class="dm-all" onclick="dmOrgAll()">${ORG.open.size > 4 ? '모두 접기' : '+ 모두 펼치기'}</button></div>` + orgNode(t);
    const p = ORG.sel, C = document.getElementById('org-card');
    C.classList.toggle('on', !!p);
    if (!p) { C.innerHTML = '<div class="dm-none">왼쪽에서 이름을 누르면<br>여기에 연락처가 나와요.</div>'; return; }
    const telRow = p.locked ? '🔒 매장 관리자 이상' : (p.tel ? esc(mmTel(p.tel)) : miss);
    C.innerHTML = `<button class="dm-x cx" onclick="dmOrgSel(null)" aria-label="닫기">✕</button>
      <div class="pc-top"><div class="av4 ${p.store ? 'store' : ''}" style="${p.store || p.ceo ? '' : `background:${colorOf(p.id)}`}">${p.ceo ? '대표' : esc(String(p.name).slice(-2))}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.org || '')}</p></div></div>
      <div class="pc-rows">${p.store
        ? `<div><span>점주</span><b>${p.owner ? esc(p.owner) : miss}</b></div><div><span>담당 S.V</span><b>${p.sv ? esc(p.sv) : miss}</b></div><div><span>연락처</span><b>${telRow}</b></div>`
        : `${p.ceo ? '' : `<div><span>입사년도</span><b>${p.start ? String(p.start).slice(0,4) + '년' : miss}</b></div>`}<div><span>이름</span><b>${esc(p.name)}${p.noname ? ' <span class="dm-miss">이름 미입력</span>' : ''}</b></div><div><span>직급</span><b>${esc(personRole(p)) || miss}</b></div><div><span>연락처</span><b>${telRow}</b></div>`}</div>
      ${!p.locked && p.tel ? `<div class="pc-act"><a class="dmb pri" href="tel:${esc(p.tel)}">📞 전화</a><a class="dmb" href="sms:${esc(p.tel)}">💬 문자</a></div>`
        : p.locked ? '<div class="pc-lock">같은 매장 동료 번호는 매장 관리자에게 물어봐 주세요.</div>'
        : `<div class="pc-lock">${p.ceo ? '대표 정보는 회사·조직 설정에서 넣어요.' : p.store ? '점주명·연락처는 회사·조직 설정에서 넣어요.' : '연락처는 직원 현황에서 넣어요.'}</div>`}`;
  }
  window.dmOrgTog = k => { if (ORG.q) return; ORG.open.has(k) ? ORG.open.delete(k) : ORG.open.add(k); orgDraw(); };
  window.dmOrgAll = () => { const t = orgTree(); if (ORG.open.size > 4) ORG.open = new Set(['corp']); else { const walk = n => { ORG.open.add(n.k); (n.kids || []).forEach(walk); }; walk(t); } orgDraw(); };
  window.dmOrgSel = id => { ORG.sel = id == null ? null : allPeople(orgTree()).find(p => String(p.id) === String(id)) || null; orgDraw(); };
  window.dmOrgQ = v => { ORG.q = v.trim(); orgDraw(); };

  /* ==========================================================
     회사·조직 설정 (관리자)
     ========================================================== */
  const BS = { d:null, fb:'', ft:'', fs:'live', q:'' };
  const STL = { '운영':'run', '영업중':'run', '오픈준비':'soon', '폐점':'off' };
  async function pageBS(){
    if (!isAdmin()) { main().innerHTML = simpleHero(['관리','회사·조직 설정'], 'SETTINGS', '회사·조직 설정', '관리자만 볼 수 있어요.') + pageFoot(); return; }
    main().innerHTML = simpleHero(['관리','회사·조직 설정'], 'SETTINGS', '회사·조직 설정', '회사 · 본사 인원 · 브랜드 · 매장을 한곳에서 정해요. 여기서 정한 내용이 연락망, 직원 현황, 시프트·출결, 가맹점 현황에 쓰여요. (관리자만 보여요)')

    bsDraw(); stLoad();
  }
  function bsDraw(){
    const d = BS.d, c = d.company || {};
    const bOf = id => d.brands.find(b => b.id === id);
    const list = d.stores.filter(s => (!BS.fb || String(s.brand_id) === BS.fb) && (!BS.ft || (BS.ft === 'dm') === !!s.direct)
      && (BS.fs === 'all' || (BS.fs === 'live' ? s.status !== '폐점' : s.status === BS.fs)) && (!BS.q || s.name.includes(BS.q) || (s.owner || '').includes(BS.q)));
    document.getElementById('bs-co').innerHTML = `
      <section class="card"><div class="dm-sh"><strong>회사</strong><small>연락망 맨 위에 나와요</small><button class="dmb sm" style="margin-left:auto" onclick="dmBsCompany()">수정</button></div>
        <div class="dm-kv3"><div><span>회사명</span><b>${esc(c.name) || miss}</b></div><div><span>대표</span><b>${c.ceo_name ? esc(c.ceo_name) + ' <small>' + esc(c.ceo_title || '') + '</small>' : miss}</b></div><div><span>대표 연락처</span><b>${c.ceo_tel ? esc(mmTel(c.ceo_tel)) : miss}</b></div></div></section>`;
    document.getElementById('bs-body').innerHTML = `
      <section class="card"><div class="dm-sh"><strong>브랜드</strong><small>${d.brands.length}개 · 연락망에서 회사 아래 갈래가 돼요</small></div>
        <div class="dm-brands">${d.brands.map(b => { const ss = d.stores.filter(s => s.brand_id === b.id && s.status !== '폐점');

<script>
/* ==========================================================
   화면 스타일 2버전 '심플' (리니어 느낌) (2026-11-08)
   - 오른쪽 위 이름 사각형 → 메뉴: 화면 스타일 [1 기본] [2 심플] · 내 사진 바꾸기 · 로그아웃
   - 기기(브라우저)마다 저장: localStorage 'mm_skin' = '1' | '2' (처음엔 1 기본)
   - 주소 끝에 ?skin=1 을 붙이면 무조건 1 기본으로 돌아감
   - 기능 코드는 그대로, <html class="mm-skin2"> 아래에서 모양만 덮어씀
   ========================================================== */
(function(){
  const KEY = 'mm_skin';
  const getSkin = () => { try { return localStorage.getItem(KEY) === '2' ? '2' : '1'; } catch (e) { return '1'; } };
  function setSkin(s){
    try { localStorage.setItem(KEY, s); } catch (e) {}
    document.documentElement.classList.toggle('mm-skin2', s === '2');

  }
  window.mmSetSkin = setSkin;

  /* ---------- 이름 사각형 메뉴 ---------- */

    const p = pop(); if (!p) return;

  }
  function closePop(){ const p = pop(); if (p) p.hidden = true; const a = document.querySelector('.top .av'); a && a.setAttribute('aria-expanded', 'false'); }

    let p = pop();
    if (!p) {
      document.body.insertAdjacentHTML('beforeend', `<div id="mm-skin-pop" role="menu" hidden>
        <div class="msp-who"></div>
        <div class="msp-sec"><span>화면 스타일</span><div class="msp-seg" role="group" aria-label="화면 스타일"><button type="button" data-skin="1" onclick="mmSetSkin('1')">1 기본</button><button type="button" data-skin="2" onclick="mmSetSkin('2')">2 심플</button></div></div>
        <button type="button" class="msp-item" data-act="photo">내 사진 바꾸기</button>
        <button type="button" class="msp-item" data-act="out">로그아웃</button></div>`);
      p = pop();
      p.addEventListener('click', e => {
        e.stopPropagation();
        const act = e.target.closest('[data-act]'); if (!act) return;
        closePop();
        if (act.dataset.act === 'photo' && photoFn) photoFn();
        if (act.dataset.act === 'out' && typeof logout === 'function') logout();
      });
    }
    const u = (typeof SESSION !== 'undefined' && SESSION && SESSION.user) || window.CURRENT_USER || {};
    const nm = a.dataset.n || u.name || '';
    p.querySelector('.msp-who').innerHTML = `<b></b><small></small>`;
    p.querySelector('.msp-who b').textContent = nm || '내 계정';
    p.querySelector('.msp-who small').textContent = [u.org, u.role].filter(Boolean).join(' · ');
    p.querySelector('[data-act="photo"]').hidden = !photoFn;

  html.mm-skin2 .nt-bell i{background:#5e6ad2}
  html.mm-skin2 .mm-sidetog:hover{background:var(--s2-soft);color:var(--ink)}
  html.mm-skin2 .app-install{background:#fff;border-color:var(--line);color:var(--ink)}
  html.mm-skin2 .app-install:hover{background:var(--s2-soft)}
  html.mm-skin2 .wrap{padding-top:52px}

  /* 본문 머리 */
  html.mm-skin2 .main{background:#fff}
  html.mm-skin2 .crumb{font-size:12px;color:var(--sub);margin-bottom:10px}
  html.mm-skin2 .crumb .icon{display:none}
  html.mm-skin2 .page-hero,html.mm-skin2 .page-hero.compact{background:none;border-radius:0;min-height:0;padding:0 0 18px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow:visible}
  html.mm-skin2 .hero-image,html.mm-skin2 .hero-copy .eyebrow{display:none}
  html.mm-skin2 .page-hero h1{font-size:22px;font-weight:600;letter-spacing:-.4px;color:var(--ink);margin:0 0 4px}
  html.mm-skin2 .page-hero p{font-size:13px;color:var(--sub)}

  /* 카드 · 제목 */
  html.mm-skin2 .card{border:1px solid var(--line);border-radius:10px;box-shadow:none;padding:18px 20px}
  html.mm-skin2 .section-title strong{font-size:14px;font-weight:600;color:var(--ink)}
  html.mm-skin2 .section-title small{font-size:12px;color:var(--sub)}

  /* 버튼 */
  html.mm-skin2 .btn{border-radius:6px;min-height:32px;padding:6px 14px;font-size:13px;font-weight:500;background:#5e6ad2;box-shadow:none}
  html.mm-skin2 .btn:hover{background:#4f5bc4}
  html.mm-skin2 .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  html.mm-skin2 .btn.ghost:hover{background:var(--s2-soft)}
  html.mm-skin2 .dmb{border-radius:6px;border-color:var(--line);color:var(--ink);font-size:13px;min-height:32px}
  html.mm-skin2 .dmb:hover{background:var(--s2-soft)}
  html.mm-skin2 .dmb.pri{background:#5e6ad2;border-color:#5e6ad2;color:#fff}
  html.mm-skin2 .dmb.pri:hover{background:#4f5bc4}
  html.mm-skin2 .dmb.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  html.mm-skin2 .dmb.sm{min-height:26px;font-size:12px}

  /* 입력칸 */
  html.mm-skin2 .main input[type=text],html.mm-skin2 .main input[type=date],html.mm-skin2 .main input[type=number],html.mm-skin2 .main input[type=search],html.mm-skin2 .main input[type=tel],html.mm-skin2 .main input[type=month],html.mm-skin2 .main select,html.mm-skin2 .main textarea{border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink);background-color:#fff}
  html.mm-skin2 .main input:focus,html.mm-skin2 .main select:focus,html.mm-skin2 .main textarea:focus{border-color:#5e6ad2;box-shadow:0 0 0 3px #e3e5fa;outline:none}
  html.mm-skin2 .f label,html.mm-skin2 .f>span{color:var(--sub)}
  html.mm-skin2 input[type=checkbox],html.mm-skin2 input[type=radio]{accent-color:#5e6ad2}

  /* 탭 · 세그먼트 */
  html.mm-skin2 .seg,html.mm-skin2 .dm-tabs{background:#f4f4f5;border:1px solid var(--line);border-radius:7px;padding:2px;min-height:34px}
  html.mm-skin2 .seg button,html.mm-skin2 .dm-tabs button{border-radius:5px;font-size:12px;color:var(--sub)}
  html.mm-skin2 .seg button.on,html.mm-skin2 .dm-tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 1px #e2e2e6,0 1px 2px rgba(0,0,0,.05)}
  html.mm-skin2 .dm-stabs{background:#f4f4f5;border:1px solid var(--line);border-radius:8px;padding:2px}
  html.mm-skin2 .dm-stabs button{font-size:13px;font-weight:500;color:var(--sub);border-radius:6px}
  html.mm-skin2 .dm-stabs button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px #e2e2e6,0 1px 2px rgba(0,0,0,.05)}
  html.mm-skin2 .dm-stabs button.on small{color:#b07a00}
  html.mm-skin2 .tr-tabs button{border-radius:6px;padding:6px 12px;font-size:13px;color:var(--sub);border-color:var(--line)}
  html.mm-skin2 .tr-tabs button.on{background:var(--s2-sel);border-color:#dcdce0;color:var(--ink);font-weight:500}
  html.mm-skin2 .chip{border-color:var(--line);border-radius:8px}
  html.mm-skin2 .chip.on{border-color:#5e6ad2;background:#f3f4fd;box-shadow:0 0 0 2px #e3e5fa}

  /* 표 */
  html.mm-skin2 table{font-size:12px}
  :where(html.mm-skin2) th{background:var(--s2-head);color:var(--sub);font-weight:500;font-size:12px;border-color:var(--line)}
  :where(html.mm-skin2) td{border-color:var(--s2-soft);color:var(--ink);font-size:13px}
  :where(html.mm-skin2) tbody tr:nth-child(even){background:transparent}
  :where(html.mm-skin2) tbody tr:hover{background:#fafafb}
  html.mm-skin2 .table-foot{font-size:12px;color:var(--sub)}

  /* 안내 */
  html.mm-skin2 .pg-guide-sub{color:var(--sub)}
  html.mm-skin2 .pg-guide summary{color:var(--sub)}`;
  document.head.appendChild(st);
})();
</script>
<script>
/* ==========================================================
   계정 현황 — 간단히 보기 (2026-11-09)
   - 계정 1개를 한 줄로: 사이트명 | 아이디·비밀번호 | 메모 | 열기·수정
   - [간단히 / 자세히] 전환, 고른 보기는 이 기기에 기억 (기본: 간단히)
   - 수정일·수정자는 사이트명에 마우스를 올리면 보임
   - 기존 계정 코드는 건드리지 않고 화면 배치만 바꿈 (거래처 현황은 그대로)
   ========================================================== */
(function(){
  const KEY = 'acctView';
  let mode = 'compact';
  try { mode = localStorage.getItem(KEY) || 'compact'; } catch (e) {}

  const st = document.createElement('style');
  st.textContent = `
  .bi-row > .bi-vt, .bi-vt{display:inline-flex !important;height:auto !important;font-size:12px !important;color:inherit !important;flex-direction:row !important;flex:none !important;width:auto !important;border:1px solid #dcdfd6;border-radius:8px;overflow:hidden;margin-left:auto}
  .bi-vt button{display:inline-block !important;flex:none !important;width:auto !important;min-width:0 !important;height:auto !important;writing-mode:horizontal-tb !important;white-space:nowrap !important;word-break:keep-all !important;line-height:1.3 !important;border:0 !important;border-radius:0 !important;margin:0 !important;background:#fff !important;color:#5c6653 !important;font-size:12px !important;padding:6px 12px !important;cursor:pointer}
  .bi-vt button + button{border-left:1px solid #dcdfd6 !important}
  .bi-vt button.on{background:#22311f !important;color:#fff !important}
  .bi-vt + .bi-off{margin-left:12px}
  .acct-cx .bi-it[id^="bi-a"]{grid-template-columns:minmax(170px,1.1fr) minmax(0,2.4fr) minmax(0,1.2fr) auto;align-items:center;gap:4px 16px;padding:9px 2px}
  .acct-cx .bi-it[id^="bi-a"].hl{padding-left:10px;padding-right:10px}
  .acct-cx .bi-it[id^="bi-a"] > .bi-name{grid-column:1;grid-row:1;font-size:14px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;min-width:0}
  .acct-cx .bi-it[id^="bi-a"] > .bi-name .bi-tag{padding:1px 6px;font-size:10.5px;flex:none}
  .acct-cx .bi-it[id^="bi-a"] > .bi-cred{grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.8fr) auto;gap:4px 8px;font-size:12.5px}
  .acct-cx .bi-it[id^="bi-a"] > .bi-cred .k{display:none}
  .acct-cx .bi-it[id^="bi-a"] > .bi-cred .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
  .acct-cx .bi-it[id^="bi-a"] > .bi-cred .bi-b{font-size:0;gap:0;padding:5px 7px}
  .acct-cx .bi-it[id^="bi-a"] > .bi-cred .bi-acts{flex-wrap:nowrap;gap:4px}
  .acct-cx .bi-it[id^="bi-a"] > .bi-sub.cx-memo{grid-column:3;grid-row:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .acct-cx .bi-it[id^="bi-a"] > .bi-sub.cx-upd{display:none}
  .acct-cx .bi-it[id^="bi-a"] > .bi-acts{grid-column:4;grid-row:1;flex-wrap:nowrap;gap:4px}
  .acct-cx .bi-it[id^="bi-a"] > .bi-acts .bi-b{padding:5px 9px}
  @media(max-width:760px){
    .acct-cx .bi-it[id^="bi-a"]{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 2px}
    .acct-cx .bi-it[id^="bi-a"] > .bi-name{grid-column:1;grid-row:1}
    .acct-cx .bi-it[id^="bi-a"] > .bi-acts{grid-column:2;grid-row:1;justify-content:flex-end}
    .acct-cx .bi-it[id^="bi-a"] > .bi-cred{grid-column:1/-1;grid-row:2;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto}
    .acct-cx .bi-it[id^="bi-a"] > .bi-sub.cx-memo{display:none}
    .bi-vt{margin-left:0}
  }`;
  document.head.appendChild(st);

  window.biAcctView = function(m){
    mode = m;
    try { localStorage.setItem(KEY, m); } catch (e) {}
    apply();
  };

  function apply(){
    const bar = document.getElementById('bi-bar');
    const isAcct = !!document.getElementById('bi-aq');
    const body = document.getElementById('bi-body');
    if (!bar || !body || !isAcct) return;
    const card = body.closest('.card') || body.parentNode;
    card.classList.toggle('acct-cx', mode === 'compact');

    // 보기 전환 버튼
    const off = bar.querySelector('.bi-off');
    if (off && !bar.querySelector('.bi-vt')) {
      off.insertAdjacentHTML('beforebegin', `<div class="bi-vt"><button type="button" data-m="compact" onclick="biAcctView('compact')">간단히</button><button type="button" data-m="full" onclick="biAcctView('full')">자세히</button></div>`);
    }
    bar.querySelectorAll('.bi-vt button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));

    // 줄마다 메모·수정일 구분, 마우스 올리면 전체 내용
    body.querySelectorAll('.bi-it[id^="bi-a"]:not([data-cx])').forEach(it => {
      it.dataset.cx = '1';
      const subs = it.querySelectorAll(':scope > .bi-sub');
      const upd = subs[subs.length - 1];
      if (upd) upd.classList.add('cx-upd');
      if (subs.length > 1) { subs[0].classList.add('cx-memo'); subs[0].title = subs[0].textContent.trim(); }
      const nm = it.querySelector(':scope > .bi-name');
      if (nm && upd) nm.title = upd.textContent.trim();
      it.querySelectorAll('.bi-cred .v').forEach(v => { if (!v.classList.contains('mask')) v.title = v.textContent.trim(); });
      it.querySelectorAll('.bi-cred .bi-b').forEach(b => { if (!b.title) b.title = b.textContent.trim(); });
    });
  }

  let raf = 0;
  new MutationObserver(() => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; apply(); });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
