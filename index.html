<script>
/* ==========================================================
   전화번호 하이픈 (2026-11-08)
   - mmTel(번호): 화면에 보일 때 010-1234-5678 / 02-123-4567 / 1588-1234 형태로 표시
   - 입력 칸(전화 칸 전부)에서 숫자만 쳐도 하이픈 자동으로 붙음
   - 쉼표(,)나 /로 여러 번호를 넣은 칸도 번호마다 따로 맞춰 줌
   ========================================================== */
(function(){
  function one(d){
    if (!d) return '';
    if (d.indexOf('02') === 0) {
      if (d.length <= 2) return d;
      if (d.length <= 5) return d.slice(0,2) + '-' + d.slice(2);
      if (d.length <= 9) return d.slice(0,2) + '-' + d.slice(2, d.length - 4 < 5 ? 5 : d.length - 4) + '-' + d.slice(d.length - 4 < 5 ? 5 : d.length - 4);
      return d.slice(0,2) + '-' + d.slice(2,6) + '-' + d.slice(6,10);
    }
    if (/^1[5-9]/.test(d) && d.length <= 8) {
      return d.length <= 4 ? d : d.slice(0,4) + '-' + d.slice(4);
    }
    if (d.charAt(0) === '0') {
      if (d.length <= 3) return d;
      if (d.length <= 6) return d.slice(0,3) + '-' + d.slice(3);
      if (d.length <= 10) return d.slice(0,3) + '-' + d.slice(3,6) + '-' + d.slice(6);
      return d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7,11);
    }
    return d;
  }
  function seg(t){
    var lead = t.match(/^\s*/)[0], tail = t.match(/\s*$/)[0], core = t.trim();
    if (!core || !/^[\d\s-]+$/.test(core)) return t;
    return lead + one(core.replace(/\D/g, '')) + tail;
  }
  window.mmTel = function(s){
    if (s === null || s === undefined) return '';
    s = String(s);
    return s.split(/([,\/])/).map(function(p){ return /^[,\/]$/.test(p) ? p : seg(p); }).join('');
  };
  var SEL = 'input[type=tel], #u-phone, #bi-tel, #ii-tel';
  document.addEventListener('input', function(e){
    var el = e.target;
    if (!el || !el.matches || !el.matches(SEL) || e.isComposing) return;
    var v = el.value, pos = el.selectionStart == null ? v.length : el.selectionStart;
    var digitsBefore = v.slice(0, pos).replace(/\D/g, '').length;
    var nv = window.mmTel(v);
    if (nv === v) return;
    el.value = nv;
    var i = 0, n = 0;
    while (i < nv.length && n < digitsBefore) { if (/\d/.test(nv.charAt(i))) n++; i++; }
    try { el.setSelectionRange(i, i); } catch (err) {}
  }, true);
})();
</script>

let LAST=null;
function runStoreOrders(){
  const rows = filtered(), view = segVal('view');

  const orders = new Set(rows.map(r=>r.no)).size, stores = new Set(rows.map(r=>r.store)).size;
  let head, body, foot, csv;
  if (view==='order'){
    const m = {};
    rows.forEach(r=>{ const o = m[r.no] ||= {ship:r.ship,order:r.order,store:r.store,no:r.no,lines:0,qty:0,supply:0,vat:0,total:0}; o.lines++; o.qty+=r.qty; o.supply+=r.supply; o.vat+=r.vat; o.total+=r.total; });
    const list = Object.values(m).sort((a,b)=>a.ship.localeCompare(b.ship)||a.store.localeCompare(b.store,'ko'));
    head = ['배송일','주문일','매장','주문번호','품목수','수량','공급가','부가세','합계'];

  } else if (view==='product'){
    const m = {};
    rows.forEach(r=>{ const o = m[r.code] ||= {code:r.code,name:r.name,cat:r.cat,unit:r.unit,qty:0,supply:0,vat:0,total:0,stores:new Set()}; o.qty+=r.qty; o.supply+=r.supply; o.vat+=r.vat; o.total+=r.total; o.stores.add(r.store); });
    const list = Object.values(m).sort((a,b)=>b.supply-a.supply);
    head = ['제품코드','제품명','구분','단위','주문매장수','수량','공급가','부가세','합계'];
    body = list.map(o=>[o.code,o.name,o.cat,o.unit,o.stores.size,o.qty,o.supply,o.vat,o.total]);

    head = ['배송일','주문일','매장','제품명','단위','수량','단가','공급가','부가세','합계'];

      <div class="k"><div class="l">주문 매장</div><div class="v">${stores}곳</div></div>
      <div class="k hl"><div class="l">공급가 (부가세 제외)</div><div class="v">${fmt(sum('supply'))}원</div></div>
      <div class="k"><div class="l">부가세</div><div class="v">${fmt(sum('vat'))}원</div></div>
      <div class="k"><div class="l">합계</div><div class="v">${fmt(sum('total'))}원</div></div>
    </div>
    <div class="card">
      <div class="meta"><span>${fmt(body.length)}행</span><button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="dlCsv('매장별_주문내역')">⬇ 엑셀(CSV) 다운로드</button></div>

}

function pagePeriodSales(){
  document.getElementById('main').innerHTML = `
    <div class="crumb">제때 관리 › 조회</div><h1>기간별 공급가 조회</h1>

    <div class="card">
      <div class="filters">
        ${dateBlock()}

        <div class="f"><label>묶음 단위</label>${segHtml('grp',[['store','매장별'],['day','일별'],['week','주별']])}</div>
      </div>
      <div class="actions"><button class="btn ghost" onclick="pagePeriodSales()">초기화</button><button class="btn" onclick="runPeriod()">🔍 조회</button></div>
    </div>
    <div id="res"></div>`;
  runPeriod();
}
function weekKey(d){ const day = +d.slice(8,10); return `${d.slice(0,7)} ${Math.ceil(day/7)}주차`; }
function runPeriod(){
  const rows = filtered(), g = segVal('grp'), basis = segVal('basis');
  const key = r => g==='store' ? r.store : g==='day' ? (basis==='ship'?r.ship:r.order) : weekKey(basis==='ship'?r.ship:r.order);
  const m = {};
  rows.forEach(r=>{ const k=key(r); const o = m[k] ||= {k,orders:new Set(),supply:0,vat:0,total:0}; o.orders.add(r.no); o.supply+=r.supply; o.vat+=r.vat; o.total+=r.total; });
  let list = Object.values(m);
  list = g==='store' ? list.sort((a,b)=>b.supply-a.supply) : list.sort((a,b)=>a.k.localeCompare(b.k));
  const max = Math.max(1,...list.map(o=>o.supply)), tot = list.reduce((s,o)=>s+o.supply,0);
  const label = {store:'매장',day:'날짜',week:'주차'}[g];
  LAST = {head:[label,'주문건수','공급가','부가세','합계','비중(%)'], body:list.map(o=>[o.k,o.orders.size,o.supply,o.vat,o.total,(o.supply/tot*100).toFixed(1)])};
  document.getElementById('res').innerHTML = `
    <div class="sum">
      <div class="k hl"><div class="l">기간 공급가 합계</div><div class="v">${fmt(tot)}원</div></div>
      <div class="k"><div class="l">${label} 수</div><div class="v">${list.length}</div></div>
      <div class="k"><div class="l">${label}당 평균</div><div class="v">${fmt(list.length?tot/list.length:0)}원</div></div>
      <div class="k"><div class="l">순매출 대비 비율</div><div class="v" style="font-size:14px;color:var(--sub)">POS 연결 후 표시</div></div>
    </div>
    <div class="card">
      <div class="meta"><span>${list.length}행</span><button class="btn ghost" style="padding:6px 12px;font-size:12px" onclick="dlCsv('기간별_공급가')">⬇ 엑셀(CSV) 다운로드</button></div>
      ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>${label}</th><th class="n">주문건수</th><th>공급가</th><th class="n">부가세</th><th class="n">합계</th><th class="n">비중</th></tr></thead><tbody>
      ${list.map(o=>`<tr><td>${o.k}</td><td class="n">${o.orders.size}</td><td><span class="bar" style="width:${Math.max(2,o.supply/max*160)}px"></span>${fmt(o.supply)}</td><td class="n">${fmt(o.vat)}</td><td class="n">${fmt(o.total)}</td><td class="n">${(o.supply/tot*100).toFixed(1)}%</td></tr>`).join('')}
      </tbody><tfoot><tr><td>합계</td><td class="n">${fmt(new Set(rows.map(r=>r.no)).size)}</td><td>${fmt(tot)}</td><td class="n">${fmt(list.reduce((s,o)=>s+o.vat,0))}</td><td class="n">${fmt(list.reduce((s,o)=>s+o.total,0))}</td><td class="n">100%</td></tr></tfoot></table></div>`:'<div class="empty">조건에 맞는 데이터가 없어요.</div>'}
    </div>`;
}

function dlCsv(name){
  if(!LAST) return;
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = '\ufeff' + [LAST.head, ...LAST.body].map(r=>r.map(esc).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = `${name}_${d1.value}_${d2.value}.csv`; a.click();
}

function fcMonthly(){
  const m = {}; FC.forEach(q => { const k = q.at.slice(0, 7); m[k] = (m[k] || 0) + q.total; });
  return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
}
function fcSection(){

}

const iToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const iAdd = (d, k) => new Date(new Date(d + 'T00:00:00Z').getTime() + k * 864e5).toISOString().slice(0, 10);
const iNorm = s => String(s || '').replace(/\s+/g, '').replace(/[_\[\]()]/g, '');
const INV_CATS = ['식자재','일회용품','스티커','유니폼','식기','비품'];

/* FC다움 본사 택배 발주 → 완료된 건은 자동 출고 */
function invFcMoves(){
  const out = [];
  FC.forEach(q => {
    const st = fcStatus(q); if (st === '미확인') return;
    q.items.forEach(i => {
      const n = iNorm(i[1]);
      const it = INV.items.find(x => x.fc && n.indexOf(iNorm(x.fc)) >= 0);
      const when = st === '완료' && q.doneAt ? q.doneAt : q.at; // 완료된 발주는 완료 시각 기준으로 차감
      if (it) out.push({date: when.slice(0, 10), key: when.slice(0, 16), type: st === '완료' ? 'FC출고' : 'FC예정', code: it.code, qty: i[2], party: q.store, memo: 'FC다움 ' + q.no + ' · ' + i[1].replace(/\s+/g, ' '), by: q.by});
    });
  });
  return out;
}
function invAllMoves(){
  const man = INV.moves.map(m => ({date: m[0], key: m[0] + ' ' + ((m[7] || '').slice(11, 16) || '23:59'), type: m[1], code: m[2], qty: m[3], party: m[4], memo: m[5], by: m[6], id: m[8], reg: m[9]}));
  return man.concat(invFcMoves()).sort((a, b) => a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
}
function invCalc(){
  const all = invAllMoves(), today = iToday(), d30 = iAdd(today, -30), res = {};
  INV.items.forEach(it => res[it.code] = {it, base: null, baseDate: '', qty: 0, out30: 0, pending: 0, lastIn: ''});
  all.forEach(m => {
    const r = res[m.code]; if (!r) return;
    if (m.type === '재고조사') { r.base = m.qty; r.baseDate = m.date; r.qty = m.qty; return; }
    if (m.type === 'FC예정') { r.pending += m.qty; return; }
    const sign = m.type === '입고' ? 1 : -1;
    r.qty += sign * m.qty;
    if (m.type === '입고') r.lastIn = m.date;
    if (sign < 0 && m.date >= d30) r.out30 += m.qty;
  });
  return Object.values(res).map(r => {
    const known = r.base !== null;
    const low = known && r.it.min > 0 && r.qty <= r.it.min;
    const days = known && r.out30 > 0 ? Math.floor(r.qty / (r.out30 / 30)) : null;
    return Object.assign(r, {known, low, days, state: !known ? '조사 필요' : r.qty < 0 ? '확인 필요' : low ? '부족' : '여유'});
  });
}

  const q = (document.getElementById('inv-q')?.value || '').trim(), onlyLow = document.getElementById('inv-low')?.checked;

    .sort((a, b) => order[a.state] - order[b.state] || INV_CATS.indexOf(a.it.cat) - INV_CATS.indexOf(b.it.cat) || a.it.code.localeCompare(b.it.code));
  LAST = {head: ['코드','분류','품목','규격','현재고','단위','상태','적정재고','최근30일 출고','출고 대기(FC 진행중)','매입단가','출고가','업체','연락처','마지막 재고조사'],
    body: list.map(r => [r.it.code, r.it.cat, r.it.name, r.it.spec, r.known ? r.qty : '', r.it.unit, r.state, r.it.min || '', r.out30, r.pending, r.it.cost, r.it.price, r.it.vendor, r.it.tel, r.baseDate])};
  document.getElementById('res').innerHTML = `<div class="card"><div class="meta"><div class="left"><strong>재고 목록</strong><span class="count">${list.length}개</span></div><button class="btn ghost" onclick="dlCsv('본사창고_재고현황')">${ic('download')}CSV 다운로드</button></div>

        <div class="tr-slot" id="tr-area-list">목록 자리 — 신규 개업 · 폐업 업소</div>
      </section>`;
      return;
    }
    if (tab === 'cost') {
      body.innerHTML = `
      <section class="card"><div class="section-title"><strong>${ic('coin')}식자재 시세</strong><small>준비 중</small></div>
        <div class="tr-cards" id="tr-cost-cards">${['대파', '양파', '숙주', '계란', '돼지고기'].map(n => `<div class="tr-slot" style="margin:0">${n}<br><small>시세 · 전주/전월/전년 대비</small></div>`).join('')}</div>
        <div class="tr-slot" id="tr-cost-chart" style="margin-top:12px">그래프 자리 — 품목 카드를 누르면 1년 시세 추이</div>
      </section>`;
      return;
    }
    const end = new Date(Date.now() - DAY), start = new Date(end.getTime() - 364 * DAY);
    body.innerHTML = `
    <section class="card query-card"><div class="section-title"><strong>${ic('search')}검색 조건</strong></div>
      <div class="f"><label for="tr-in">키워드 <span>최대 5개</span></label>
        <div class="tr-kwbox" id="tr-kwbox" onclick="document.getElementById('tr-in').focus()"><span id="tr-kws"></span>
          <input id="tr-in" placeholder="키워드 입력 후 Enter" onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();trAdd(this.value)}"></div>
        <div class="tr-preset" id="tr-preset"></div>
        <div class="tr-hint">기본 키워드를 누르면 넣고 빼기가 돼요.</div></div>
      <div class="filters" style="margin-top:14px">
        <div class="f"><label>기간</label><div class="daterow"><input type="date" id="tr-d1" min="2016-01-01" value="${ymd(start)}"><span>~</span><input type="date" id="tr-d2" value="${ymd(end)}"></div>
          <div class="quick"><button onclick="trRange(90)">3개월</button><button onclick="trRange(364)">1년</button><button onclick="trRange(364*3)">3년</button></div></div>
        <div class="f"><label>단위</label>${segHtml('tr-unit', [['week', '주별'], ['date', '일별'], ['month', '월별']])}</div>
        <div class="f"><label>보기</label>${segHtml('tr-mode', [['compare', '비교 보기'], ['single', '개별 추이']])}</div>
      </div>
      <details class="tr-more" id="tr-more"><summary>옵션 더보기 (기기 · 성별 · 연령)</summary>
        <div class="tr-grid">
          <div class="f"><label>기기</label>${segHtml('tr-dev', [['', '전체'], ['pc', 'PC'], ['mo', '모바일']])}</div>
          <div class="f"><label>성별</label>${segHtml('tr-gen', [['', '전체'], ['f', '여성'], ['m', '남성']])}</div>
          <div class="f"><label>연령 <span>선택 안 하면 전체</span></label><div class="tr-ages" id="tr-ages">${AGES.map(([n, v]) => `<label><input type="checkbox" value="${v.join(',')}">${n}</label>`).join('')}</div></div>
        </div></details>
      <div class="actions"><span class="filter-hint">${ic('info')}네이버 검색량을 최댓값 100 기준으로 바꾼 상대값이에요.</span><button class="btn ghost" onclick="trReset()">${ic('reset')}초기화</button><button class="btn primary" onclick="trRun()">${ic('search')}조회</button></div>
    </section>
    <div id="tr-res"></div>`;
    drawKw();
    trRun();
  };

  /* ---------- 키워드 ---------- */
  function drawKw(){
    const box = document.getElementById('tr-kws'); if (!box) return;
    box.innerHTML = TR.kw.map((k, i) => `<span class="tr-kw" style="background:${COLORS[i % 5]}">${h(k)}<button type="button" aria-label="${h(k)} 빼기" onclick="event.stopPropagation();trDel(${i})">×</button></span>`).join('');
    document.getElementById('tr-preset').innerHTML = PRESET.map(k => `<button type="button" class="${TR.kw.includes(k) ? 'on' : ''}" onclick="trToggle('${k}')">${k}</button>`).join('');
  }
  window.trAdd = function(v){
    const add = String(v || '').split(',').map(x => x.trim()).filter(Boolean);
    for (const k of add) {
      if (TR.kw.includes(k)) continue;
      if (TR.kw.length >= 5) { toast('키워드는 5개까지 넣을 수 있어요.'); break; }
      if (k.length > 30) { toast('키워드가 너무 길어요.'); continue; }
      TR.kw.push(k);
    }
    const inp = document.getElementById('tr-in'); if (inp) inp.value = '';
    drawKw();
  };
  window.trDel = function(i){ TR.kw.splice(i, 1); drawKw(); };
  window.trToggle = function(k){ const i = TR.kw.indexOf(k); if (i >= 0) trDel(i); else trAdd(k); };
  window.trRange = function(days){
    const end = new Date(Date.now() - DAY);
    document.getElementById('tr-d1').value = ymd(new Date(end.getTime() - days * DAY));
    document.getElementById('tr-d2').value = ymd(end);
  };
  window.trReset = function(){ TR.kw = DEFAULT.slice(); trTab('search'); };

  /* ---------- 조회 ---------- */
  window.trRun = async function(){
    const pend = document.getElementById('tr-in').value.trim(); if (pend) trAdd(pend);
    const res = document.getElementById('tr-res');
    if (!TR.kw.length) { res.innerHTML = `<div class="card"><div class="empty">${ic('info')}키워드를 하나 이상 넣어주세요.</div></div>`; return; }
    const req = {
      keywords: TR.kw.slice(), startDate: document.getElementById('tr-d1').value, endDate: document.getElementById('tr-d2').value,
      timeUnit: segVal('tr-unit'), mode: segVal('tr-mode'), device: segVal('tr-dev') || undefined, gender: segVal('tr-gen') || undefined,
      ages: [...document.querySelectorAll('#tr-ages input:checked')].flatMap(c => c.value.split(','))
    };
    if (!req.startDate || !req.endDate || req.startDate > req.endDate) { toast('기간을 다시 확인해주세요.'); return; }
    res.innerHTML = `<div class="card"><div class="tr-loading">네이버에서 가져오는 중이에요...</div></div>`;
    try {
      const [, out] = await Promise.all([loadChart(), callTrend(req)]);
      TR.last = { req, out };
      drawResult(req, out);
    } catch (e) {
      res.innerHTML = `<div class="card"><div class="empty">${ic('info')}불러오지 못했어요.<br><small>${h(e.message || e)}</small></div></div>`;
    }
  };
  async function callTrend(req){
    if (!window.SB) throw new Error('서버 연결이 준비되지 않았어요. 새로고침해주세요.');
    const { data, error } = await SB.functions.invoke('naver-trend', { body: req });
    if (error) {
      let msg = error.message;
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
      throw new Error(msg);
    }
    if (!data || !data.ok) throw new Error((data && data.error) || '알 수 없는 오류');
    return data;
  }

  /* ---------- 계산 ---------- */
  // 기간 앞뒤로 덜 찬 구간(주·월)은 버림
  function periodEnd(p, unit){
    if (unit === 'date') return t0(p);
    if (unit === 'week') return t0(p) + 6 * DAY;
    const d = new Date(p + 'T00:00:00+09:00'); d.setMonth(d.getMonth() + 1); return d.getTime() - DAY;
  }
  function build(req, out){
    const s = t0(req.startDate), e = t0(req.endDate);
    const all = new Set();
    out.results.forEach(r => r.data.forEach(d => all.add(d.period)));
    const periods = [...all].filter(p => t0(p) >= s && periodEnd(p, req.timeUnit) <= e).sort();
    const series = out.results.map(r => {
      const m = {}; r.data.forEach(d => m[d.period] = d.ratio);
      return { keyword: r.keyword, values: periods.map(p => m[p] == null ? 0 : m[p]), empty: !r.data.some(d => d.ratio > 0) };
    });
    const n = req.timeUnit === 'week' ? 4 : req.timeUnit === 'date' ? 28 : 1;
    const label = req.timeUnit === 'month' ? '최근 1개월' : '최근 4주';
    const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    series.forEach(sr => {
      const v = sr.values, cur = avg(v.slice(-n)), prev = avg(v.slice(-2 * n, -n));
      sr.avg = avg(v);
      sr.change = prev > 0 && v.length >= 2 * n ? (cur - prev) / prev * 100 : null;
      const mx = Math.max(...v, 0); sr.peak = mx > 0 ? periods[v.indexOf(mx)] : null;
    });
    return { periods, series, label, n };
  }
  const pct = c => c == null ? '—' : (c > 0 ? '+' : '') + c.toFixed(1) + '%';
  const cls = c => c == null ? '' : c > 0 ? 'tr-up' : c < 0 ? 'tr-down' : '';
  const plabel = (p, unit) => unit === 'month' ? p.slice(0, 7).replace('-', '.') : p.slice(2).replace(/-/g, '.');

  /* ---------- 결과 그리기: 요약 카드 → 그래프 → 순위 ---------- */
  function drawResult(req, out){
    const B = build(req, out), res = document.getElementById('tr-res');
    if (!B.periods.length) { res.innerHTML = `<div class="card"><div class="empty">${ic('info')}이 기간에는 보여줄 데이터가 없어요. 기간을 늘려보세요.</div></div>`; return; }
    const live = B.series.filter(s => !s.empty), ch = live.filter(s => s.change != null);
    const top = req.mode === 'compare' ? [...live].sort((a, b) => b.avg - a.avg)[0] : null;
    const up = [...ch].sort((a, b) => b.change - a.change)[0], down = [...ch].sort((a, b) => a.change - b.change)[0];
    const empty = B.series.filter(s => s.empty).map(s => s.keyword);
    const unitTxt = { week: '주별', date: '일별', month: '월별' }[req.timeUnit];
    const filt = [req.device === 'pc' ? 'PC' : req.device === 'mo' ? '모바일' : '', req.gender === 'f' ? '여성' : req.gender === 'm' ? '남성' : '', req.ages && req.ages.length ? '연령 선택' : ''].filter(Boolean).join(' · ');
    res.innerHTML = `
    <div class="data-note"><span class="status-dot"></span><span>네이버 데이터랩 · ${req.startDate} ~ ${req.endDate} · ${unitTxt}${filt ? ' · ' + filt : ''}</span><span class="tag">${req.mode === 'compare' ? '비교 보기' : '개별 추이 (각자 100 기준)'}</span></div>
    <div class="tr-sum sum">
      <div class="k hl"><div class="l">${ic('chart')}기간 내 최고 관심</div><div class="v">${top ? h(top.keyword) : '—'}</div><div class="d">${top ? '평균 ' + top.avg.toFixed(1) : '개별 추이에서는 크기 비교가 안 돼요'}</div></div>
      <div class="k"><div class="l">${ic('trend')}${B.label} 급상승</div><div class="v">${up && up.change > 0 ? h(up.keyword) : '—'}</div><div class="d ${up ? cls(up.change) : ''}">${up && up.change > 0 ? pct(up.change) + ' (직전 대비)' : '오른 키워드가 없어요'}</div></div>
      <div class="k"><div class="l">${ic('info')}${B.label} 최대 하락</div><div class="v">${down && down.change < 0 ? h(down.keyword) : '—'}</div><div class="d ${down ? cls(down.change) : ''}">${down && down.change < 0 ? pct(down.change) + ' (직전 대비)' : '내린 키워드가 없어요'}</div></div>
    </div>
    <section class="card"><div class="meta"><div class="left"><strong>검색 추이</strong><span class="count">${B.periods.length}구간</span></div></div>
      <div class="tr-chart"><canvas id="tr-canvas" aria-label="검색 추이 그래프"></canvas></div>
      <div class="tr-note">그래프를 좌우로 밀면(PC는 마우스를 올리면) 날짜별 값이 보여요.${empty.length ? `<br><b>데이터 부족:</b> ${empty.map(h).join(', ')} — 검색량이 너무 적어 네이버가 값을 주지 않았어요.` : ''}${req.mode === 'compare' && live.length > 1 ? '<br>작은 키워드가 바닥에 붙어 보이면 <b>개별 추이</b>로 바꿔보세요.' : ''}</div>
    </section>
    <section class="card"><div class="meta"><div class="left"><strong>${B.label} 상승·하락 순위</strong></div></div>
      <div class="tbl-wrap"><table><thead><tr><th>순위</th><th>키워드</th><th>${B.label} 변화</th><th>기간 평균</th><th>최고 시점</th></tr></thead><tbody>
      ${[...B.series].sort((a, b) => (b.change == null ? -1e9 : b.change) - (a.change == null ? -1e9 : a.change)).map((s, i) => `<tr><td>${i + 1}</td><td><span class="tr-dot" style="background:${COLORS[B.series.indexOf(s) % 5]}"></span>${h(s.keyword)}</td><td class="${cls(s.change)}">${s.empty ? '데이터 부족' : pct(s.change)}</td><td>${s.empty ? '—' : s.avg.toFixed(1)}</td><td>${s.peak ? plabel(s.peak, req.timeUnit) : '—'}</td></tr>`).join('')}
      </tbody></table></div>
      ${req.mode === 'single' ? '<div class="tr-note">개별 추이에서는 키워드마다 기준이 달라 평균값끼리 비교하면 안 돼요. 변화율은 그대로 비교할 수 있어요.</div>' : ''}
    </section>`;
    drawChart(B, req);
  }

  // 세로선: 값 상자를 따라다니는 선
  const vline = {
    id: 'trVline',
    afterDatasetsDraw(c){
      const a = c.tooltip && c.tooltip.getActiveElements(); if (!a || !a.length) return;
      const x = a[0].element.x, y = c.chartArea, g = c.ctx;
      g.save(); g.beginPath(); g.moveTo(x, y.top); g.lineTo(x, y.bottom); g.lineWidth = 1; g.strokeStyle = 'rgba(35,38,33,.35)'; g.setLineDash([4, 3]); g.stroke(); g.restore();
    }
  };
  function drawChart(B, req){
    if (TR.chart) { TR.chart.destroy(); TR.chart = null; }
    const cv = document.getElementById('tr-canvas'); if (!cv || !window.Chart) return;
    const single = req.mode === 'single';
    TR.chart = new Chart(cv, {
      type: 'line',
      data: {
        labels: B.periods.map(p => plabel(p, req.timeUnit)),
        datasets: B.series.map((s, i) => ({
          label: s.keyword, data: s.values, borderColor: COLORS[i % 5], backgroundColor: COLORS[i % 5],
          borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .25, spanGaps: true
        }))
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: 'index', intersect: false, axis: 'x' },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, font: { size: 11 } } },
          tooltip: {
            backgroundColor: '#fff', titleColor: '#232621', bodyColor: '#232621', borderColor: '#d9ddd2', borderWidth: 1,
            padding: 10, boxPadding: 4, usePointStyle: true, itemSort: (a, b) => b.parsed.y - a.parsed.y,
            callbacks: {
              title: it => B.periods[it[0].dataIndex] + (req.timeUnit === 'week' ? ' 주' : '') + (single ? ' (각자 기준)' : ''),
              label: it => ' ' + it.dataset.label + '  ' + it.parsed.y.toFixed(1)
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { maxTicksLimit: 7, maxRotation: 0, font: { size: 10 }, color: '#8a9180' } },
          y: { min: 0, suggestedMax: 100, ticks: { stepSize: 25, font: { size: 10 }, color: '#8a9180' }, grid: { color: '#eef0ea' } }
        }
      },
      plugins: [vline]
    });
  }
})();
</script>
<script>
// v5.2: 트렌드 분석 — 상권 탭 (공공데이터 상가정보 + 네이버 지도 + 기준 업종 선택)
// 조회: Edge Function sbiz-radius (실시간) / 기록: area_daily(수집일)·area_shops(업소별 처음·마지막 본 날) — 매일 새벽 3시 sbiz-collect
// 디자인 분업 규칙: id 와 js- 로 시작하는 class 는 기능용(건드리지 말 것), tr- 로 시작하는 class 는 꾸밈용
(function(){
  const NAVER_ID = 'timg82m9f5';
  const OWN = /멘야\s*마쯔리|menya\s*matsuri/i;
  const RAMEN = 'ramen';                       // 기본 기준 업종: 라멘·우동·소바(일식 면 요리)
  const C_HIT = '#c62429', C_NEAR = '#d08a1e', C_OTHER = '#9aa68c';
  const AR = { stores: [], sel: null, radius: 500, mode: 'store', live: null, hist: null, cat: { m: RAMEN, s: '', q: '' },
    map: null, marks: [], circle: null, info: null, showAll: false, chart: null, allBiz: false, qt: null };
  const h = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const n = v => Number(v || 0).toLocaleString('ko-KR');
  const md = s => s ? s.slice(5).replace('-', '/') : '';
  const nvUrl = it => 'https://map.naver.com/p/search/' + encodeURIComponent(((it.area ? it.area + ' ' : '') + (it.name || '')).trim());

  /* ---------- 스타일 (꾸밈용) ---------- */
  const st = document.createElement('style');
  st.textContent = `
  .tr-amode{display:flex;gap:6px;margin-bottom:12px}
  .tr-amode button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 14px;font-size:12px;color:#5d6656}
  .tr-amode button.on{background:#eef1e8;border-color:#9aa68c;color:#2d3726;font-weight:600}

  .tr-arow .tr-addr input{flex:1}
  .tr-acat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .tr-acat .btn{min-height:40px;font-size:11px;white-space:nowrap}
  .tr-asum{display:grid;gap:12px;margin:16px 0}
  .tr-asum .k .d{font-size:10px;color:var(--sub);margin-top:6px}
  .tr-map{width:100%;height:420px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:#f3f5ef}
  .tr-maptool{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:10px 0 0;font-size:11px;color:#5d6656}
  .tr-legend{display:flex;gap:12px;flex-wrap:wrap}
  .tr-pin{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px #0005;cursor:pointer}
  .tr-pin.sm{width:8px;height:8px;border-width:1px;opacity:.75}
  .tr-pin.own{width:18px;height:18px;background:#25301f;border:3px solid #fff}
  .tr-iw{padding:8px 11px;font-size:12px;line-height:1.6;min-width:140px}
  .tr-iw small{color:#7a836f}
  .tr-nv{display:inline-flex;align-items:center;gap:3px;border-radius:5px;background:#03c75a;color:#fff!important;font-size:10px;font-weight:700;padding:3px 8px;text-decoration:none;white-space:nowrap}
  .tr-iw .tr-nv{margin-top:6px}
  .tr-list td.tr-gtag span{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;color:#fff}
  .tr-chg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tr-chg h4{margin:0 0 8px;font-size:12px}
  .tr-chg ul{list-style:none;margin:0;padding:0;font-size:12px}
  .tr-chg li{padding:7px 0;border-bottom:1px solid #f0f2eb;display:flex;justify-content:space-between;gap:8px}
  .tr-chg li small{color:var(--sub);white-space:nowrap}
  .tr-chg .tr-none{color:#909b84;font-size:11px;padding:10px 0}
  @media(max-width:760px){.tr-arow,.tr-acat{grid-template-columns:1fr}.tr-asum{grid-template-columns:1fr 1fr!important}.tr-asum .k.hl{grid-column:1/-1}.tr-map{height:340px}.tr-chg{grid-template-columns:1fr}}
  `;
  document.head.appendChild(st);

  /* ---------- 외부 도구 불러오기 ---------- */
  let naverLoading = null, chartLoading = null;
  function loadNaver(){
    if (window.naver && naver.maps && naver.maps.Service) return Promise.resolve();
    if (naverLoading) return naverLoading;
    naverLoading = new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + NAVER_ID + '&submodules=geocoder';
      s.onload = () => { const t = Date.now(); (function wait(){ if (naver.maps && naver.maps.Service) ok(); else if (Date.now() - t > 8000) ok(); else setTimeout(wait, 100); })(); };
      s.onerror = () => { naverLoading = null; no(new Error('네이버 지도를 불러오지 못했어요.')); };
      document.head.appendChild(s);
    });
    return naverLoading;
  }
  function loadChart(){
    if (window.Chart) return Promise.resolve();
    if (chartLoading) return chartLoading;
    chartLoading = new Promise((ok, no) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js';
      s.onload = ok; s.onerror = () => { chartLoading = null; no(new Error('그래프 도구를 불러오지 못했어요.')); };
      document.head.appendChild(s);
    });
    return chartLoading;
  }

  /* ---------- 기준 업종 ---------- */
  const isRamen = () => AR.cat.m === RAMEN;
  function grpOf(m, s){
    if (m === '일식' && (s || '').includes('면')) return 'direct';
    if (m === '일식') return 'japanese';
    if (['국수/칼국수', '냉면/밀면'].includes(s)) return 'noodle';
    return 'other';
  }
  // hit: 기준 업종 / near: 같은 분류(라멘 기준이면 일식·면) / other
  function tier(it){
    const c = AR.cat, q = c.q.trim(), qok = !q || (it.name || '').includes(q);
    if (c.m === RAMEN) {
      const g = grpOf(it.mcls, it.scls);
      if (g === 'direct' && qok) return 'hit';
      return g !== 'other' ? 'near' : 'other';
    }
    if ((!c.m || it.mcls === c.m) && (!c.s || it.scls === c.s) && qok) return 'hit';
    return c.m && it.mcls === c.m ? 'near' : 'other';
  }
  function catLabel(){
    const c = AR.cat, q = c.q.trim();
    const base = c.m === RAMEN ? '라멘·우동·소바' : (c.s || c.m || '전체 업종');
    return q ? `${base} · '${q}' 포함` : base;
  }
  function metrics(){
    if (isRamen()) return [
      { label: '직접 경쟁 · ' + catLabel(), fn: it => tier(it) === 'hit', col: C_HIT },
      { label: '일식 전체', fn: it => it.mcls === '일식', col: C_NEAR },
      { label: '면 식사', fn: it => ['direct', 'noodle'].includes(grpOf(it.mcls, it.scls)), col: '#3b5ba5' },
      { label: '음식점 전체', fn: () => true, total: true }];
    const a = [{ label: '선택 업종 · ' + catLabel(), fn: it => tier(it) === 'hit', col: C_HIT }];
    if (AR.cat.m && (AR.cat.s || AR.cat.q.trim())) a.push({ label: AR.cat.m + ' 전체', fn: it => it.mcls === AR.cat.m, col: C_NEAR });
    a.push({ label: '음식점 전체', fn: () => true, total: true });
    return a;
  }
  function tagOf(it, t){
    if (t === 'hit') return isRamen() ? '직접 경쟁' : '선택';
    if (isRamen()) return grpOf(it.mcls, it.scls) === 'noodle' ? '면 식사' : '일식';
    return '같은 분류';
  }

  /* ---------- 탭 연결 ---------- */
  const trTabOrig = window.trTab;
  window.trTab = function(tab){
    if (AR.chart) { AR.chart.destroy(); AR.chart = null; }
    AR.map = null; AR.marks = []; AR.circle = null;
    trTabOrig(tab);
    const b = document.querySelectorAll('#tr-tabs button')[1];
    if (b) b.innerHTML = '상권';
    if (tab === 'area') { AR.cat = { m: RAMEN, s: '', q: '' }; areaPage(); }
  };

  /* ---------- 화면 뼈대 ---------- */
  async function areaPage(){
    const body = document.getElementById('tr-body');
    body.innerHTML = `
    <section class="card query-card"><div class="section-title"><strong>${ic('store')}조회 대상</strong><small>반경 안 업소 · 공공데이터 상가정보</small></div>
      <div class="tr-amode" id="ar-mode">
        <button class="${AR.mode === 'store' ? 'on' : ''}" onclick="arMode('store')">우리 매장</button>
        <button class="${AR.mode === 'addr' ? 'on' : ''}" onclick="arMode('addr')">후보지 주소</button>
      </div>
      <div class="tr-arow">
        <div class="f" id="ar-pick"></div>
        <div class="f"><label>반경</label>${segHtml('ar-rad', [['300', '300m'], ['500', '500m'], ['1000', '1km']])}</div>
      </div>
      <div class="tr-acat" id="ar-cat"></div>
    </section>
    <div id="ar-out"></div>`;
    document.querySelectorAll('#ar-rad button').forEach(b => {
      b.classList.toggle('on', Number(b.dataset.v) === AR.radius);
      b.addEventListener('click', () => { AR.radius = Number(b.dataset.v); arRun(); });
    });
    await loadStores();
    drawPick();
    drawCat();
    if (AR.mode === 'store' && AR.sel) arRun();
  }

  async function loadStores(){
    if (AR.stores.length) return;
    try {
      const { data: a, error } = await SB.from('area_stores').select('store_id,lat,lng,addr');
      if (error) throw error;
      const ids = (a || []).map(r => r.store_id);
      const { data: s } = ids.length ? await SB.from('stores').select('id,name').in('id', ids) : { data: [] };
      const nm = new Map((s || []).map(r => [r.id, r.name]));
      AR.stores = (a || []).map(r => ({ id: r.store_id, name: nm.get(r.store_id) || ('매장 ' + r.store_id), lat: r.lat, lng: r.lng, addr: r.addr }))
        .sort((x, y) => x.id === 1 ? -1 : y.id === 1 ? 1 : x.name.localeCompare(y.name, 'ko'));
      if (!AR.sel && AR.stores.length) AR.sel = AR.stores[0];
    } catch (e) { AR.stores = []; }
  }

  function drawPick(){
    const box = document.getElementById('ar-pick'); if (!box) return;
    if (AR.mode === 'store') {
      if (!AR.stores.length) { box.innerHTML = `<label>매장</label><div class="tr-hint">조회할 수 있는 매장이 없어요.</div>`; return; }
      box.innerHTML = `<label for="ar-store">매장</label><select id="ar-store" onchange="arPick(this.value)">${AR.stores.map(s => `<option value="${s.id}" ${AR.sel && AR.sel.id === s.id ? 'selected' : ''}>${h(s.name)}</option>`).join('')}</select>`;
    } else {
      box.innerHTML = `<label for="ar-addr">후보지 주소</label><div class="tr-addr"><input type="text" id="ar-addr" placeholder="예) 천안시 서북구 불당동 1234" onkeydown="if(event.key==='Enter'){event.preventDefault();arFind()}"><button class="btn primary" onclick="arFind()">${ic('search')}찾기</button></div><div class="tr-hint">도로명·지번 주소 모두 돼요. 후보지는 기록 없이 오늘 기준으로만 보여줘요.</div>`;
    }
  }

  // 기준 업종 선택칸 — 선택지는 지금 조회한 반경 안 실제 업종에서 뽑음
  function drawCat(){
    const box = document.getElementById('ar-cat'); if (!box) return;
    const items = AR.live ? AR.live.items.filter(it => !it.own) : [];
    const cm = new Map(); items.forEach(it => cm.set(it.mcls, (cm.get(it.mcls) || 0) + 1));
    const mOpts = [...cm.entries()].sort((a, b) => b[1] - a[1]);
    if (AR.cat.m && AR.cat.m !== RAMEN && !cm.has(AR.cat.m)) mOpts.push([AR.cat.m, 0]);
    const c = AR.cat;
    let sub = '';
    if (c.m && c.m !== RAMEN) {
      const sm = new Map(); items.filter(it => it.mcls === c.m).forEach(it => sm.set(it.scls, (sm.get(it.scls) || 0) + 1));
      const sOpts = [...sm.entries()].sort((a, b) => b[1] - a[1]);
      if (c.s && !sm.has(c.s)) sOpts.push([c.s, 0]);
      sub = `<select id="ar-cat-s" onchange="arCatS(this.value)"><option value="">${h(c.m)} 전체</option>${sOpts.map(([k, v]) => `<option value="${h(k)}" ${c.s === k ? 'selected' : ''}>${h(k)} (${v})</option>`).join('')}</select>`;
    } else sub = `<select disabled><option>${c.m === RAMEN ? '일식 면 요리' : '전체'}</option></select>`;
    box.innerHTML = `
      <div class="f"><label for="ar-cat-m">기준 업종</label><select id="ar-cat-m" onchange="arCatM(this.value)">
        <option value="${RAMEN}" ${c.m === RAMEN ? 'selected' : ''}>라멘·우동·소바 (기본)</option>
        <option value="" ${c.m === '' ? 'selected' : ''}>전체 업종</option>
        ${mOpts.map(([k, v]) => `<option value="${h(k)}" ${c.m === k ? 'selected' : ''}>${h(k)} (${v})</option>`).join('')}
      </select></div>
      <div class="f"><label for="ar-cat-s">세부 업종</label>${sub}</div>
      <div class="f"><label for="ar-q">상호 검색 <span>선택</span></label><input type="text" id="ar-q" value="${h(c.q)}" placeholder="예) 마라, 돈카츠" oninput="arQ(this.value)"></div>
      <div class="f"><button class="btn" onclick="arCatReset()" ${c.m === RAMEN && !c.q ? 'disabled' : ''}>라멘 기준으로</button></div>`;
  }
  window.arCatM = function(v){ AR.cat.m = v; AR.cat.s = ''; drawCat(); if (AR.live) drawOut(); };
  window.arCatS = function(v){ AR.cat.s = v; if (AR.live) drawOut(); };
  window.arQ = function(v){
    clearTimeout(AR.qt);
    AR.qt = setTimeout(() => { AR.cat.q = v; if (AR.live) drawOut(); const b = document.querySelector('#ar-cat .btn'); if (b) b.disabled = AR.cat.m === RAMEN && !AR.cat.q; }, 300);
  };
  window.arCatReset = function(){ AR.cat = { m: RAMEN, s: '', q: '' }; drawCat(); if (AR.live) drawOut(); };

  window.arMode = function(m){
    AR.mode = m;
    document.querySelectorAll('#ar-mode button').forEach((b, i) => b.classList.toggle('on', ['store', 'addr'][i] === m));
    drawPick();
    if (m === 'store') { if (AR.mode === 'store' && AR.stores.length) { AR.sel = AR.stores.find(s => s.id === (AR.sel && AR.sel.id)) || AR.stores[0]; } arRun(); }
    else { AR.live = null; document.getElementById('ar-out').innerHTML = ''; drawCat(); }
  };
  window.arPick = function(id){
    AR.sel = AR.stores.find(s => String(s.id) === String(id)) || null;
    AR.cat = { m: RAMEN, s: '', q: '' };
    arRun();
  };
  window.arFind = async function(){
    const q = (document.getElementById('ar-addr')?.value || '').trim();
    if (!q) { toast('주소를 입력해주세요.'); return; }
    try {
      await loadNaver();
      if (!naver.maps.Service) throw new Error('주소 검색 도구를 불러오지 못했어요.');
      const r = await new Promise((ok, no) => naver.maps.Service.geocode({ query: q }, (st, res) => {
        if (st !== naver.maps.Service.Status.OK) return no(new Error('주소를 찾지 못했어요.'));
        const a = res.v2 && res.v2.addresses && res.v2.addresses[0];
        if (!a) return no(new Error('주소를 찾지 못했어요. 시·구부터 다시 적어주세요.'));
        ok({ id: 0, name: '후보지', addr: a.roadAddress || a.jibunAddress || q, lat: Number(a.y), lng: Number(a.x) });
      }));
      AR.sel = r; arRun();
    } catch (e) { toast(e.message || String(e)); }
  };

  /* ---------- 조회 ---------- */
  async function callRadius(lat, lng, radius){
    const { data, error } = await SB.functions.invoke('sbiz-radius', { body: { lat, lng, radius } });
    if (error) {
      let msg = error.message;
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (_) {}
      throw new Error(msg);
    }
    if (!data || !data.ok) throw new Error((data && data.error) || '알 수 없는 오류');
    return data;
  }
  // 기록: 수집한 날짜 목록 + 매장 주변 업소 전체(처음·마지막으로 본 날) → 어떤 업종이든 날짜별로 다시 셀 수 있음
  async function loadHist(storeId){
    const { data: d } = await SB.from('area_daily').select('d').eq('store_id', storeId).order('d');
    const days = (d || []).map(r => r.d);
    if (!days.length) return { days, shops: [] };
    let shops = [];
    for (let from = 0; from < 10000; from += 1000) {
      const { data, error } = await SB.from('area_shops').select('name,mcls,scls,dist,first_seen,last_seen')
        .eq('store_id', storeId).range(from, from + 999);
      if (error || !data) break;
      shops = shops.concat(data);
      if (data.length < 1000) break;
    }
    shops = shops.filter(r => !OWN.test(r.name || ''));
    return { days, shops, base: days[0], last: days[days.length - 1] };
  }

  async function arRun(){
    const out = document.getElementById('ar-out'); if (!out || !AR.sel) return;
    if (AR.chart) { AR.chart.destroy(); AR.chart = null; }
    const s = AR.sel;
    out.innerHTML = `<div class="card"><div class="tr-loading">상권 정보를 가져오는 중이에요...</div></div>`;
    try {
      const [live, hist] = await Promise.all([
        callRadius(s.lat, s.lng, AR.radius),
        s.id ? loadHist(s.id) : Promise.resolve(null),
        loadNaver().catch(() => null)
      ]);
      live.items.forEach(it => { it.own = OWN.test(it.name || ''); });
      AR.live = live; AR.hist = hist;
      drawCat();
      drawOut();
    } catch (e) {
      out.innerHTML = `<div class="card"><div class="empty">${ic('info')}불러오지 못했어요.<br><small>${h(e.message || e)}</small></div></div>`;
    }
  }

  /* ---------- 기록으로 날짜별 숫자 다시 세기 ---------- */
  function histCounts(fn){
    const hs = AR.hist; if (!hs || !hs.days.length) return [];
    const rows = hs.shops.filter(fn);
    return hs.days.map(d => rows.reduce((a, r) => a + (r.first_seen <= d && r.last_seen >= d ? 1 : 0), 0));
  }

  /* ---------- 결과 그리기 ---------- */
  function drawOut(){
    const out = document.getElementById('ar-out'); if (!out) return;
    if (AR.chart) { AR.chart.destroy(); AR.chart = null; }
    const s = AR.sel, L = AR.live, rad = AR.radius >= 1000 ? (AR.radius / 1000) + 'km' : AR.radius + 'm';
    const items = L.items.filter(it => !it.own);
    items.forEach(it => { it.t = tier(it); });
    const M = metrics();
    const hasHist = AR.hist && AR.hist.days.length >= 2 && AR.radius === 500;
    const cards = M.map((m, i) => {
      const v = items.filter(m.fn).length;
      let d = '';
      if (hasHist) {
        const hc = histCounts(m.fn), dv = hc[hc.length - 1] - hc[0];
        d = `<div class="d">${md(AR.hist.base)} 대비 <b class="${dv > 0 ? 'tr-up' : dv < 0 ? 'tr-down' : ''}">${dv > 0 ? '+' : ''}${dv}</b></div>`;
      }
      return `<div class="k ${i === 0 ? 'hl' : ''}"><div class="l">${i === 0 ? ic('store') : ''}${h(m.label)}</div><div class="v">${n(v)}<small>곳</small></div>${d}</div>`;
    }).join('');
    const rel = items.filter(it => it.t !== 'other').sort((a, b) => (a.t === 'hit' ? 0 : 1) - (b.t === 'hit' ? 0 : 1) || a.dist - b.dist);
    const hitN = rel.filter(it => it.t === 'hit').length;
    const nearName = isRamen() ? '일식·면' : (AR.cat.m ? '같은 분류' : '');
    out.innerHTML = `
    <div class="sum tr-asum" style="grid-template-columns:1.4fr repeat(${M.length - 1},1fr)">${cards}</div>
    <section class="card"><div class="section-title"><strong>${ic('search')}${h(s.name)} 반경 ${rad}</strong><small>${h(s.addr || '')}</small></div>
      <div class="tr-map" id="ar-map"></div>
      <div class="tr-maptool">
        <div class="tr-legend"><span><span class="tr-dot" style="background:${C_HIT}"></span>${h(catLabel())}</span>${nearName ? `<span><span class="tr-dot" style="background:${C_NEAR}"></span>${nearName}</span>` : ''}<span><span class="tr-dot" style="background:#25301f"></span>${s.id ? '우리 매장' : '후보지'}</span></div>
        <label><input type="checkbox" id="ar-all" ${AR.showAll ? 'checked' : ''} onchange="arShowAll(this.checked)"> 나머지 음식점도 보기 (${n(items.length - rel.length)}곳)</label>
      </div>
    </section>
    <section class="card"><div class="section-title"><strong>${ic('store')}${h(catLabel())} 업소</strong><small>${n(hitN)}곳${rel.length > hitN ? ` · ${nearName} ${n(rel.length - hitN)}곳` : ''} · 가까운 순</small></div>
      ${rel.length ? `<div class="tbl-wrap tr-list"><table><thead><tr><th>구분</th><th>상호</th><th>업종</th><th class="n">거리</th><th>플레이스</th></tr></thead><tbody>
        ${rel.map(it => `<tr onclick="arFocus('${h(it.id)}')" style="cursor:pointer"><td class="tr-gtag"><span style="background:${it.t === 'hit' ? C_HIT : C_NEAR}">${tagOf(it, it.t)}</span></td><td>${h(it.name)}</td><td>${h(it.scls)}</td><td class="n">${n(it.dist)}m</td><td><a class="tr-nv" href="${nvUrl(it)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">N 보기</a></td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${ic('info')}반경 안에 해당 업소가 없어요.</div>`}
    </section>
    ${s.id ? histHtml(M) : ''}`;
    drawMap(items);
    if (s.id) drawHist(M);
  }

  function histHtml(M){
    const hs = AR.hist, days = hs ? hs.days.length : 0;
    const pick = r => AR.allBiz || tier(r) !== 'other';
    const li = (arr, key) => {
      const a = arr.filter(pick).slice(0, 40);
      return a.length ? `<ul>${a.map(r => `<li><span>${h(r.name)} <small>${h(r.scls)} · ${n(r.dist)}m</small></span><small>${md(r[key])}</small></li>`).join('')}</ul>` : `<div class="tr-none">아직 없어요.</div>`;
    };
    const opened = hs && hs.days.length ? hs.shops.filter(r => r.first_seen > hs.base).sort((a, b) => b.first_seen.localeCompare(a.first_seen)) : [];
    const closed = hs && hs.days.length ? hs.shops.filter(r => r.last_seen < hs.last).sort((a, b) => b.last_seen.localeCompare(a.last_seen)) : [];
    return `
    <section class="card"><div class="section-title"><strong>${ic('clock')}업소 수 추이</strong><small>반경 500m · ${h(catLabel())} 기준</small></div>
      ${days >= 2 ? `<div class="tr-chart"><canvas id="ar-chart"></canvas></div>` : `<div class="tr-slot">기록이 쌓이는 중이에요. 이틀째부터 그래프가 그려져요.</div>`}
      <div class="tr-note">추이와 개업·폐업은 반경 500m 기준으로 매일 새벽 3시에 기록해요.${hs && hs.base ? ` 기록 시작일: ${hs.base}` : ''}</div>
    </section>
    <section class="card"><div class="section-title"><strong>${ic('info')}개업 · 폐업</strong>
      <label style="font-size:11px;color:#5d6656"><input type="checkbox" ${AR.allBiz ? 'checked' : ''} onchange="arAllBiz(this.checked)"> 전체 업종</label></div>
      <div class="tr-chg">
        <div><h4 class="tr-up">새로 생긴 곳</h4>${li(opened, 'first_seen')}</div>
        <div><h4 class="tr-down">사라진 곳</h4>${li(closed, 'last_seen')}</div>
      </div>
      <div class="tr-note">기록 시작일 이후에 처음 잡힌 곳을 '새로 생긴 곳', 최근 기록에서 빠진 곳을 '사라진 곳'으로 봐요. 공공데이터 반영이 실제보다 늦을 수 있어요.</div>
    </section>`;
  }
  window.arAllBiz = function(v){ AR.allBiz = v; drawOut(); };

  function drawMap(items){
    const el = document.getElementById('ar-map'); if (!el) return;
    if (!(window.naver && naver.maps)) { el.innerHTML = `<div class="empty">${ic('info')}지도를 불러오지 못했어요.<br><small>등록한 사이트 주소에서만 지도가 열려요.</small></div>`; return; }
    const s = AR.sel;
    const center = new naver.maps.LatLng(s.lat, s.lng);
    const zoom = AR.radius >= 1000 ? 15 : AR.radius >= 500 ? 16 : 17;

          <input id="pc-q" placeholder="예: 배추, 마늘, 닭, 고등어" autocomplete="off" oninput="pcSuggest(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();pcEnter(this.value)}" onfocus="pcSuggest(this.value)">
          <div class="tr-pdrop" id="pc-drop" hidden></div></div>
        <div class="f"><label for="pc-sgg">지역</label><select id="pc-sgg" onchange="pcSet('sgg',this.value)">${SGG.map(([c, n]) => `<option value="${c}" ${c === PC.sgg ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="f"><label>기간</label><div class="seg" id="pc-days">${[[30, '1개월'], [90, '3개월'], [365, '1년']].map(([d, t]) => `<button class="${d === PC.days ? 'on' : ''}" onclick="pcSet('days',${d})">${t}</button>`).join('')}</div></div>
      </div>
      <div id="pc-msg"></div>
      <div class="tr-hint" style="margin-top:10px">도매(중도매) 가격은 서울·부산·대구·광주·대전 위주로 나오고, 그 밖의 지역은 소매 가격만 있을 수 있어요.</div>
    </section>
    <div id="pc-res"></div>`;
    document.removeEventListener('click', pcOutside);
    document.addEventListener('click', pcOutside);
    if (PC.sel) { document.getElementById('pc-q').value = PC.sel.name; run(); }
    else document.getElementById('pc-res').innerHTML = `<section class="card"><div class="tr-loading">조회할 품목을 검색해 주세요.<br><small>예: 대파, 양파, 계란, 삼겹살, 배추</small></div></section>`;
  }
  function pcOutside(e){
    const d = document.getElementById('pc-drop');
    if (!d) { document.removeEventListener('click', pcOutside); return; }
    if (!e.target.closest('.tr-psearch')) d.hidden = true;
  }

  /* ---------- 검색 ---------- */
  function find(q){
    q = norm(q); if (!q) return [];
    const out = [];
    for (const [c, n, vs] of ITEMS) {
      if (norm(n).includes(q)) { out.push({ c, n, v: '', sub: vs.map(v => v[1]).join(' · ') }); continue; }
      vs.filter(v => norm(v[1]).includes(q)).forEach(v => out.push({ c, n, v: v[0], vn: v[1], sub: n }));
    }
    return out.slice(0, 30);
  }
  window.pcSuggest = function(q){
    const d = document.getElementById('pc-drop'); if (!d) return;
    const r = find(q);
    if (!norm(q)) { d.hidden = true; return; }
    if (!r.length) { d.hidden = true; return; }
    d.innerHTML = r.map((x, i) => `<button onclick="pcPick('${x.c}','${x.v}')">${h(x.vn || x.n)}<small>${h(x.sub)}</small></button>`).join('');
    d.hidden = false;
  };
  window.pcEnter = function(q){
    const r = find(q);
    if (r.length) return pcPick(r[0].c, r[0].v);
    document.getElementById('pc-drop').hidden = true;
    document.getElementById('pc-msg').innerHTML = `<div class="tr-pnone">‘${h(q.trim())}’은(는) aT 가격 자료에 없는 품목이에요.</div>`;
  };
  window.pcPick = function(c, v){
    const it = ITEMS.find(x => x[0] === c); if (!it) return;
    const vn = v ? (it[2].find(x => x[0] === v) || [])[1] : '';
    PC.sel = { c, v: v || '', name: vn || it[1], item: it[1] };
    const q = document.getElementById('pc-q'); if (q) q.value = PC.sel.name;
    const d = document.getElementById('pc-drop'); if (d) d.hidden = true;
    run();
  };
  window.pcSet = function(k, v){
    PC[k] = v;
    if (k === 'days') document.querySelectorAll('#pc-days button').forEach(b => b.classList.toggle('on', b.textContent === { 30: '1개월', 90: '3개월', 365: '1년' }[v]));
    if (PC.sel) run();
  };

  /* ---------- 조회 ---------- */
  async function run(){
    const res = document.getElementById('pc-res'); if (!res) return;
    document.getElementById('pc-msg').innerHTML = '';
    const my = ++PC.busy;
    res.innerHTML = `<section class="card"><div class="tr-loading">${h(PC.sel.name)} 가격을 불러오는 중…</div></section>`;
    const to = new Date(Date.now() - 86400000), from = new Date(to.getTime() - PC.days * 86400000);
    try {
      const { data, error } = await SB.functions.invoke('price-lookup', { body: { item_cd: PC.sel.c, vrty_cd: PC.sel.v, sgg_cd: PC.sgg, from: ymd8(from), to: ymd8(to) } });
      if (my !== PC.busy) return;
      if (error) throw error;
      if (!data || !data.ok) throw new Error((data && data.error) || '조회 실패');
      PC.data = data.rows || []; PC.key = '';
      draw();
    } catch (e) {
      if (my !== PC.busy) return;
      res.innerHTML = `<section class="card"><div class="tr-loading">가격을 불러오지 못했어요.<br><small>${h(e.message || e)}</small></div></section>`;
    }
  }

  /* ---------- 결과 ---------- */
  const keyOf = r => r.se + '|' + r.vrty_cd + '|' + r.grd;
  const sgName = () => (SGG.find(s => s[0] === PC.sgg) || [])[1] || '';
  function draw(){
    const res = document.getElementById('pc-res');
    const rows = PC.data;
    if (!rows.length) {
      res.innerHTML = `<section class="card"><div class="tr-loading"><b>${h(PC.sel.name)}</b> · ${h(sgName())}<br>이 기간·지역에는 조사된 가격이 없어요.<br><small>다른 지역(서울 등)이나 기간을 바꿔 보세요.</small></div></section>`;
      return;
    }
    // 시리즈 목록 (구분·품종·등급)
    const S = {};
    rows.forEach(r => { const k = keyOf(r); (S[k] = S[k] || { k, se: r.se, se_nm: r.se_nm, vrty: r.vrty, grd: r.grd, unit: r.unit, sz: r.sz, pts: [] }).pts.push(r); });
    const list = Object.values(S).sort((a, b) => (b.se.localeCompare(a.se)) || a.vrty.localeCompare(b.vrty) || (a.grd === '상품' ? -1 : b.grd === '상품' ? 1 : a.grd.localeCompare(b.grd)));
    if (!S[PC.key]) PC.key = (list.find(s => s.grd === '상품') || list[0]).k;
    const cur = S[PC.key];
    const lab = s => `${s.se_nm} · ${s.vrty}${s.grd && s.grd !== s.vrty ? ' · ' + s.grd : ''} (${s.sz}${s.unit})`;

    const p = cur.pts, last = p[p.length - 1];
    const ago = days => { const t = new Date(+last.d.slice(0, 4), +last.d.slice(4, 6) - 1, +last.d.slice(6, 8) - days); const k = String(t.getFullYear()) + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0'); let f = null; for (const x of p) { if (x.d <= k) f = x; else break; } return f; };
    const diff = (o) => { if (!o || o.d === last.d) return '<div class="d">비교 자료 없음</div>'; const r = (last.avg - o.avg) / o.avg * 100; const c = r > 0 ? 'tr-up' : r < 0 ? 'tr-down' : ''; return `<div class="v ${c}">${r > 0 ? '▲' : r < 0 ? '▼' : ''} ${Math.abs(r).toFixed(1)}%</div><div class="d">${md(o.d)} ${won(o.avg)}</div>`; };
    const lo = p.reduce((a, x) => x.avg < a.avg ? x : a, p[0]), hi = p.reduce((a, x) => x.avg > a.avg ? x : a, p[0]);
    const twin = Object.values(S).find(s => s.se !== cur.se && s.vrty === cur.vrty && s.grd === cur.grd);

    // 최근 조사일 전체 표
    const lastD = rows[rows.length - 1].d;
    const latest = list.map(s => s.pts[s.pts.length - 1]).filter(Boolean);

    res.innerHTML = `
    <section class="card"><div class="section-title"><strong>${ic('coin')}${h(PC.sel.name)} · ${h(sgName())}</strong><small>최근 조사일 ${full(last.d)}</small></div>
      <div class="tr-psel"><div class="f"><label for="pc-ser">품종 · 등급</label><select id="pc-ser" onchange="pcSer(this.value)">${list.map(s => `<option value="${h(s.k)}" ${s.k === PC.key ? 'selected' : ''}>${h(lab(s))}</option>`).join('')}</select></div>
        ${twin ? `<div class="f"><label>&nbsp;</label><button class="btn ghost" onclick="pcSer('${h(twin.k)}')">${twin.se_nm} 가격 보기</button></div>` : ''}</div>
      <div class="tr-psum">
        <div class="k"><div class="l">최근 가격</div><div class="v">${won(last.avg)}</div><div class="d">${h(cur.sz + cur.unit)} 기준${last.min !== last.max ? ` · ${won(last.min)}~${won(last.max)}` : ''}</div></div>
        <div class="k"><div class="l">1주 전 대비</div>${diff(ago(7))}</div>
        <div class="k"><div class="l">1개월 전 대비</div>${diff(ago(30))}</div>
        <div class="k"><div class="l">기간 최저 · 최고</div><div class="v" style="font-size:15px">${won(lo.avg)} ~ ${won(hi.avg)}</div><div class="d">${md(lo.d)} 최저 · ${md(hi.d)} 최고</div></div>
      </div>
      <div class="tr-chart"><canvas id="pc-cv"></canvas></div>
      <div class="tr-note">평균가는 그날 조사한 여러 시장 가격의 평균이에요. 주말·공휴일은 조사하지 않아 비어 있어요.</div>
    </section>
    <section class="card"><div class="section-title"><strong>${ic('chart')}최근 가격 한눈에</strong><small>품종·등급별 마지막 조사값</small></div>
      <div class="tbl-wrap"><table class="tr-ptable"><thead><tr><th>구분</th><th>품종</th><th>등급</th><th>단위</th><th class="n">평균</th><th class="n">최저~최고</th><th>조사일</th></tr></thead><tbody>
      ${latest.map(r => `<tr${keyOf(r) === PC.key ? ' style="background:#f6f7f2"' : ''}><td><span class="tr-ptag" style="background:${r.se === '02' ? C2 : C1}">${h(r.se_nm)}</span></td><td>${h(r.vrty)}</td><td>${h(r.grd)}</td><td>${h(r.sz + r.unit)}</td><td class="n"><b>${won(r.avg)}</b></td><td class="n">${r.min !== r.max ? won(r.min) + '~' + won(r.max) : '-'}</td><td>${r.d === lastD ? md(r.d) : `<span style="color:var(--sub)">${md(r.d)}</span>`}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
    chart(cur);
  }
  window.pcSer = function(k){ PC.key = k; draw(); };

  async function chart(s){
    try { await loadChart(); } catch (e) { return; }
    const cv = document.getElementById('pc-cv'); if (!cv) return;
    if (PC.chart) PC.chart.destroy();
    const col = s.se === '02' ? C2 : C1;
    PC.chart = new Chart(cv, {
      type: 'line',
      data: { labels: s.pts.map(x => md(x.d)), datasets: [
        { label: '평균', data: s.pts.map(x => x.avg), borderColor: col, backgroundColor: col + '22', fill: true, tension: .25, pointRadius: s.pts.length > 60 ? 0 : 2, borderWidth: 2 },
        ...(s.pts.some(x => x.min !== x.max) ? [{ label: '최저', data: s.pts.map(x => x.min), borderColor: '#b9c0ae', borderDash: [4, 4], pointRadius: 0, borderWidth: 1, fill: false }, { label: '최고', data: s.pts.map(x => x.max), borderColor: '#b9c0ae', borderDash: [4, 4], pointRadius: 0, borderWidth: 1, fill: false }] : [])
      ] },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => full(s.pts[it[0].dataIndex].d), label: c => c.dataset.label + ' ' + won(c.parsed.y) } } },
        scales: { x: { ticks: { maxTicksLimit: 8, autoSkip: true }, grid: { display: false } }, y: { ticks: { callback: v => Number(v).toLocaleString('ko-KR') } } } }
    });
  }
})();
</script>

(function(){

  const brTxt = list => brOrder(list).map(h).join('·');
  const splitBr = t => [...new Set(String(t || '').split(/\s*[,/·]\s*/).map(x => x.trim()).filter(Boolean))];
  function brChecks(cur){

  }

  window.biBrNew = function(){

  const BI = { acct: null, vend: null, af: { q: '', brand: '', cat: '', off: false }, vf: { q: '', brand: '', cat: '', off: false }, timers: {} };

        const v = D.list.find(x => x.name === o.name);
        const key = o.name + '|' + (o.item || '');
        if (!o.name) o._st = ['no', '제외 · 업체명 없음'];
        else if (badBr) o._st = ['no', '제외 · 없는 소속'];
        else if (!o.item) o._st = (v || [...seen].some(k => k.startsWith(o.name + '|'))) ? ['sk', '건너뜀 · 업체 이미 있음'] : ['ok', '업체만 등록'];
        else if (seen.has(key) || (v && v.items.some(i => i.name === o.item))) o._st = ['sk', '건너뜀 · 이미 있음'];
        else o._st = ['ok', v ? '취급 품목 추가' : '등록'];
        seen.add(key);
      }
      if (o._st[0] === 'ok' && o.cat && !cats.includes(o.cat)) newCats.add(o.cat);
    });
    const ok = rows.filter(o => o._st[0] === 'ok'), sk = rows.filter(o => o._st[0] === 'sk').length, no = rows.filter(o => o._st[0] === 'no').length;
    const head = isA ? ['상태', '사이트명', '아이디', '비밀번호', '소속', '분류', '관리자 전용'] : ['상태', '업체명', '품목명', '공급가', '점주 출고가', '소속', '분류', '연락처'];
    const cell = o => isA ? [o.site, o.uid, o.pw ? '●●●●' : '', o.brand, o.cat, o.adminOnly ? 'O' : ''] : [o.name, o.item, o.cost, o.price, o.brand, o.cat, o.tel];
    iModal('엑셀 일괄 등록 · ' + XL[kind].title, `
      <div class="bi-sum"><span class="ok">등록 ${ok.length}</span><span class="sk">건너뜀 ${sk}</span><span class="no">제외 ${no}</span>${newCats.size ? `<span>새 분류 ${[...newCats].map(h).join(', ')}</span>` : ''}</div>
      <div class="bi-pv"><table><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(o => `<tr class="${o._st[0]}"><td class="st ${o._st[0]}">${h(o._st[1])}</td>${cell(o).map(x => `<td>${h(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="im-warn">'등록'으로 표시된 줄만 들어가요. 이미 있는 항목은 건드리지 않고 건너뛰어요.${isA ? ' 등록이 끝나면 비밀번호가 적힌 엑셀 파일은 지워주세요.' : ''}</p>`, () => {
      if (!ok.length) return toast('등록할 줄이 없어요.');
      busyBtn(true);
      const payload = ok.map(o => { const c = Object.assign({}, o); delete c._st; delete c.brs; return c; });
      SB.rpc(isA ? 'acct_bulk' : 'vendor_bulk', { p_rows: payload }).then(({ data, error }) => {
        if (error) { busyBtn(false); return toast('등록 실패 (아무것도 들어가지 않았어요): ' + error.message); }
        closeM();
        toast(isA ? `계정 ${data.added}개를 등록했어요.` : `거래처 ${data.vendors}곳, 품목 ${data.items}개를 등록했어요.`);
        if (isA) loadAcct().then(drawAcct); else loadVend().then(drawVend);
      });
    }, `${ok.length}건 등록`);
    if (!ok.length) { const b = document.getElementById('im-save'); if (b) b.disabled = true; }
  }

  /* ---------- 데이터 ---------- */
  async function loadNotice(){
    if (!SESSION.user || SESSION.mustChange || !window.SB) return null;
    if (NT.uid !== SESSION.user.uid) { NT.uid = SESSION.user.uid; NT.data = null; }
    try {
      const { data, error } = await SB.rpc('notice_data');
      if (error) throw error;
      NT.data = data; drawBell(); drawSideBadge(); return data;
    } catch (e) { console.warn('공지 불러오기 실패', e); return null; }
  }
  window.ntLoad = loadNotice;
  function markRead(id){
    const n = NT.data && NT.data.list.find(x => x.id === id);
    if (n && !n.read) { n.read = true; NT.data.unread = Math.max(0, NT.data.unread - 1); }
    drawBell(); drawSideBadge(); drawDash();
    if (window.__curPage === 'notice') drawList();
  }

  /* ---------- 상단 🔔 알림 ---------- */
  function drawBell(){
    const u = document.querySelector('.top .user'); if (!u) return;
    let b = document.getElementById('nt-bell');
    if (!b) {
      u.insertAdjacentHTML('afterbegin', `<button class="nt-bell" id="nt-bell" type="button" aria-label="알림" onclick="ntPop(event)">${ic('bell')}</button>`);
      b = document.getElementById('nt-bell');
    }
    const n = ((NT.data && NT.data.unread) || 0) + (window.apAlert ? window.apAlert().count : 0);
    b.querySelector('i')?.remove();
    if (n) b.insertAdjacentHTML('beforeend', `<i>${n > 99 ? '99+' : n}</i>`);
    b.setAttribute('aria-label', n ? `알림 ${n}건` : '알림');
  }
  window.ntBell = () => drawBell();
  window.ntPop = function(e){

    const un = D.list.filter(x => !x.read).slice(0, 5);

  /* ---------- 공지 보기 ---------- */
  async function signed(path, name, dl){
