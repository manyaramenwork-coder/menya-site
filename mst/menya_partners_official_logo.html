function notice(){let list=notices.map((n,i)=>i).filter(i=>(filter==='전체'||(filter==='미확인'&&!read.has(i))||notices[i][2]===filter)&&notices[i][0].toLowerCase().includes(search.toLowerCase()));return `<h1 class="title">공지사항</h1><p class="desc">본사에서 전달한 중요한 소식을 확인하세요.</p><div class="search">⌕ <input id="searchInput" aria-label="공지 검색" placeholder="공지사항 검색" value="${search.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></div><div class="chips">${['전체','미확인','필독','배송','일반'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}">${f}</button>`).join('')}</div>${heading('공지 목록')}<div class="card">${list.length?list.map(row).join(''):'<div class="empty">검색 결과가 없어요.</div>'}</div><div class="footer-note">최근 공지 미리보기 · 전체 41건</div>`}
function order(){return `<h1 class="title">물품 발주</h1><p class="desc">발주 요청부터 진행 현황까지 간편하게 관리하세요.</p><div class="order-hero"><div><span class="tag blue">QUICK ORDER</span><h3>필요한 물품을<br>간편하게 발주하세요.</h3><p class="desc">원하는 품목과 수량을 선택하세요.</p></div><span style="font-size:55px">📦</span></div><button class="primary red" data-action="neworder">＋ 새 발주하기</button><div class="two"><div class="stat"><small>진행 중인 발주</small><strong>${orders.length}</strong><span class="tag blue">진행 현황</span></div><div class="stat"><small>전체 발주 내역</small><strong>${8+orders.length}</strong><span class="tag">누적 주문</span></div></div><section class="section"><div class="chips">${['진행 중','전체'].map(f=>`<button class="${f===orderFilter?'active':''}" data-orderfilter="${f}">${f==='전체'?'전체 내역':f}</button>`).join('')}</div><div class="card">${orders.length?orders.map(o=>`<div class="notice-item"><div class="row-body"><div class="row-title">발주 요청 #${o.id}</div><div class="row-meta">${o.count}개 수량 · 방금 전</div></div><span class="tag blue">요청 접수</span></div>`).join(''):orderFilter==='진행 중'?'<div class="empty"><div class="symbol">📦</div><h3>진행 중인 발주가 없어요</h3><p>필요한 물품이 있다면 새로운 발주를 시작해 보세요.</p><button class="secondary" data-action="neworder">＋ 발주 시작하기</button></div>':'<div class="empty"><h3>기존 발주 8건</h3><p>상세 내역은 서버 연동 후 표시됩니다.</p></div>'}</div></section>`}
function recipe(){return `<h1 class="title">조리 레시피</h1><p class="desc">본사 표준 조리법을 간편하게 확인하세요.</p><div class="hero"><small>OFFICIAL RECIPE</small><h2>언제나 변함없는 맛,<br>표준 레시피로 완성해요.</h2></div><section class="section">${heading('라멘')}<button class="recipe-card" data-action="recipe"><div class="recipe-image">🍜</div><div class="row-body"><span class="tag">RAMEN</span><h3 style="margin:8px 0 4px">츠케멘</h3><p class="desc" style="font-size:11px">2026-11-17 · 본사 레시피</p></div><span class="chev">›</span></button></section>`}
function profile(){return `<h1 class="title">내 정보</h1><p class="desc">계정 및 매장 설정을 관리하세요.</p><div class="profile"><div class="avatar">♙</div><div class="row-body"><strong>김영환 <span class="tag blue">관리자</span></strong><p class="desc" style="margin:3px 0">kim84365</p><p class="desc" style="margin:0;font-size:11px">멘야마쯔리 · 쌍용점</p></div></div><section class="section">${heading('매장 정보')}<div class="card"><div class="setting-row"><span>소속 매장</span><span style="color:var(--sub)">쌍용점</span></div><div class="setting-row"><span>권한</span><span class="tag blue">매장 관리자</span></div></div></section><section class="section">${heading('알림 설정')}<div class="card" style="padding:20px"><strong style="font-size:14px">${enabled?'알림이 켜져 있어요':'이 기기는 알림이 꺼져 있어요'}</strong><p class="desc" style="margin:7px 0 17px">발주와 본사 공지를 놓치지 않도록 관리하세요.</p><button class="primary" data-action="notify">${enabled?'알림 끄기':'알림 켜기'}</button></div></section><section class="section">${heading('계정 관리')}<div class="card"><button class="setting-row" data-action="password"><span>비밀번호 변경</span><span class="chev">›</span></button><button class="setting-row" data-action="logout"><span style="color:var(--red)">로그아웃</span><span class="chev">›</span></button></div></section>`}
function draw(){el('screen').innerHTML=({home,notice,order,recipe,profile})[page]();el('tabs').innerHTML=pages.map(([id,ic,name])=>`<button class="tab ${page===id?'active':''}" data-page="${id}"><span>${ic}</span>${name}</button>`).join('');drawModal()}function mh(t){return `<div class="sheethead"><h2>${t}</h2><button class="close" data-action="close">×</button></div>`}function drawModal(){let html='';if(modal==='order'){let total=Object.values(quantities).reduce((a,b)=>a+b,0);html=mh('새 발주 요청')+'<p class="desc">필요한 품목과 수량을 선택해 주세요.</p>'+goods.map(([name,unit],i)=>`<div class="goods-row"><div><strong style="font-size:13px">${name}</strong><p class="row-meta">단위 · ${unit}</p></div><div class="qty"><button data-minus="${i}">−</button><b>${quantities[i]||0}</b><button data-plus="${i}">+</button></div></div>`).join('')+`<p style="display:flex;justify-content:space-between;margin:20px 0"><b>선택한 수량 합계</b><b style="color:var(--red)">${total}개</b></p><button class="primary red" data-action="submit" ${total?'':'disabled style="opacity:.4"'}>발주 요청하기</button><p class="footer-note">시연용이며 실제 주문은 전송되지 않습니다.</p>`}else if(modal==='notice'){let n=notices[selectedNotice];html=mh('공지 상세')+`<span class="tag red">${n[2]}</span><h2 style="line-height:1.4">${n[0]}</h2><p class="desc">${n[1]} · 첨부 ${n[3]}개</p><div class="info" style="margin:25px 0">공지 본문과 첨부파일은 실제 본사 데이터가 연결되면 표시됩니다.</div><button class="primary" data-action="close">확인했어요</button>`}else if(modal==='recipe'){html=mh('레시피 상세')+'<div style="background:#f7eddd;text-align:center;padding:27px;border-radius:17px;font-size:65px">🍜</div><h2>츠케멘</h2><p class="desc">본사 표준 레시피 · 2026-11-17</p><div class="info" style="margin:22px 0">실제 재료, 배합 비율, 조리 순서, 사진 및 영상은 본사 시스템 연동 후 표시됩니다.</div><button class="primary" data-action="close">목록으로</button>'}else if(modal==='password'){html=mh('비밀번호 변경')+'<label>현재 비밀번호<input class="field" type="password" placeholder="현재 비밀번호"></label><label>새 비밀번호<input class="field" type="password" placeholder="새 비밀번호"></label><label>새 비밀번호 확인<input class="field" type="password" placeholder="다시 입력"></label><button class="primary" data-action="demo">변경 요청</button>'}else if(modal==='logout'){html=mh('로그아웃')+'<p class="desc" style="margin-bottom:24px">정말 로그아웃하시겠어요?</p><button class="primary red" data-action="demo">로그아웃</button><button class="secondary" style="width:100%;margin-top:10px" data-action="close">취소</button>'}else if(modal==='store'){html=mh('매장 선택')+'<div class="info">✓ 멘야마쯔리 쌍용점 · 현재 매장</div>'}else if(modal==='success'){html='<div style="text-align:center;padding:20px 0"><div style="font-size:49px;color:var(--blue)">✓</div><h2>발주 요청 완료</h2><p class="desc" style="margin:14px 0 25px">프로토타입에 저장된 요청입니다.<br>실제 서버에는 전송되지 않았습니다.</p><button class="primary" data-action="close">발주 현황 확인</button></div>'}else if(modal==='demo'){html=mh('체험용 기능')+'<div class="info" style="margin-bottom:22px">시연용 인터페이스입니다. 실제 계정이나 서버 데이터는 변경되지 않습니다.</div><button class="primary" data-action="close">확인</button>'}el('modal').innerHTML=modal?`<div class="overlay"><div class="sheet"><div class="handle"></div>${html}</div></div>`:''}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b){if(e.target.classList.contains('overlay')){modal='';drawModal()}return}let d=b.dataset;if(b.id==='storeBtn'){modal='store';drawModal();return}if(b.id==='bellBtn'){page='notice';draw();return}if(d.page){page=d.page;draw();window.scrollTo(0,0);return}if(d.filter){filter=d.filter;draw();return}if(d.orderfilter){orderFilter=d.orderfilter;draw();return}if(d.notice!==undefined){selectedNotice=+d.notice;read.add(selectedNotice);modal='notice';drawModal();return}if(d.plus!==undefined){quantities[d.plus]=(quantities[d.plus]||0)+1;drawModal();return}if(d.minus!==undefined){quantities[d.minus]=Math.max(0,(quantities[d.minus]||0)-1);drawModal();return}switch(d.action){case 'neworder':quantities={};modal='order';drawModal();break;case 'submit':{let total=Object.values(quantities).reduce((a,b)=>a+b,0);if(!total)return;orders.unshift({id:1001+orders.length,count:total});page='order';modal='success';draw();break}case 'notify':enabled=!enabled;draw();break;case 'recipe':case 'password':case 'logout':modal=d.action;drawModal();break;case 'demo':modal='demo';drawModal();break;case 'close':modal='';draw();break}});document.addEventListener('input',e=>{if(e.target.id==='searchInput'){search=e.target.value;let focus=e.target.selectionStart;let top=window.scrollY;draw();let target=el('searchInput');target.focus();target.setSelectionRange(focus,focus);window.scrollTo(0,top)}});draw();
</script></body></html>
