<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>멘야 파트너스</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="멘야 파트너스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<!--
  멘야마쯔리 파트너 (가맹점 앱) — 2026-11-12 첫 버전
  - 주소: store.menyamatsuri.work (주소는 코드에 고정하지 않음, 어디에 올려도 동작)
  - 가맹점주(mst): 홈 · 공지(1:1 본사 대화) · 발주 · 레시피 · 내 정보
  - 관리자·본사(admin·hq): 관리 화면 — 공지 쓰기 · 품목 · 레시피 · 계정(관리자만)
  - 직영점 계정(store·staff)은 들어올 수 없음 → 워크스페이스 안내
  - 데이터는 워크스페이스와 같은 Supabase. 점주는 mst_ 함수로 '우리 매장 것'만 받음
-->
<style>
:root{
  --red:#c62429; --red-d:#9f1b20; --red-t:#fbeceb;
  --ink:#1f271b; --ink2:#465140; --mut:#869080; --line:#e2e7dc;
  --bg:#f4f6f1; --card:#fff; --ok:#2e7a4c; --ok-t:#e6f3ea; --amb:#a8670f; --amb-t:#fbf1df; --blue:#2a5ca8; --blue-t:#e8eff9;
  --r:14px; --tab:64px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{max-width:560px;margin:0 auto;min-height:100%;padding-top:var(--safe-t)}
#view{padding:0 16px calc(var(--tab) + var(--safe-b) + 28px)}
#view.has-bar{padding-bottom:calc(var(--tab) + var(--safe-b) + 108px)}

/* 위쪽 제목줄 */
.top{position:sticky;top:0;z-index:20;margin:0 -16px 6px;padding:calc(var(--safe-t) + 10px) 10px 10px;background:rgba(244,246,241,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:4px;min-height:54px}
.top h1{font-size:18px;font-weight:750;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.top .back:active{background:#e8ece3}
.top .act{padding:8px 12px;border-radius:10px;font-weight:650;color:var(--red);font-size:14px}
.page-h{padding:calc(var(--safe-t) + 22px) 4px 12px}
.page-h h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
.page-h p{margin:4px 0 0;color:var(--mut);font-size:14px}

/* 노렌 (홈 상단) */
.noren{margin:0 -16px 18px;background:var(--red);color:#fff;padding:calc(var(--safe-t) + 26px) 22px 46px;position:relative}
.noren::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
  background:linear-gradient(90deg,transparent calc(33.33% - 2px),var(--bg) calc(33.33% - 2px),var(--bg) calc(33.33% + 2px),transparent calc(33.33% + 2px),
  transparent calc(66.66% - 2px),var(--bg) calc(66.66% - 2px),var(--bg) calc(66.66% + 2px),transparent calc(66.66% + 2px))}
.noren small{display:block;font-size:13px;opacity:.82;font-weight:500}
.noren b{display:block;font-size:34px;font-weight:850;letter-spacing:-.045em;line-height:1.15;margin-top:4px}
.noren .who{margin-top:8px;font-size:14px;opacity:.9}

/* 공통 블록 */
.sec{margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;padding:0 4px}
.sec h2{font-size:16px;font-weight:750;margin:0}
.sec a,.sec button{font-size:13px;color:var(--mut);text-decoration:none}
.box{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.irow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.irow .row{border-top:0;flex:1;min-width:0}
.irow .mv{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 8px 0 0}
.irow .mv button{width:34px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--ink2);background:none;border:0;cursor:pointer}
.irow .mv button:hover:not(:disabled){background:var(--bg)}
.irow .mv button:disabled{opacity:.25;cursor:default}
.acc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px}
.acc-h .tgl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:12px 10px;background:none;border:0;text-align:left;cursor:pointer}
.acc-h .tgl .nm{font-size:16px;font-weight:750;letter-spacing:-.02em}
.acc-h .tgl .ct{color:var(--mut);font-size:13.5px}
.acc-h .tgl .i{transition:transform .2s;color:var(--mut);flex-shrink:0}
.acc.open .acc-h .tgl .i{transform:rotate(90deg)}
.acc-h .mv{display:flex;gap:2px;padding-left:8px;border-left:1px solid var(--line)}
.acc-h .mv button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:none;border:0;color:var(--ink2);cursor:pointer}
.acc-h .mv button:hover:not(:disabled){background:var(--bg)} .acc-h .mv button:disabled{opacity:.25;cursor:default}
.acc-b{display:none;border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.acc-b .irow:first-child{border-top:0}
.acc-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line)}
.acc-f .btn{flex:0 0 auto}
.acc-f .btn.ghost.del2{color:var(--red)}
.acc-empty{padding:18px 16px;color:var(--mut);font-size:14px}
.topbtns{display:flex;gap:8px;margin-bottom:12px} .topbtns .btn{width:auto}
.btn.del{background:transparent;color:var(--red);border:1px solid #f1c9cb}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:active{background:#f6f8f3}
.row .main{flex:1;min-width:0}
.row .t{font-weight:620;font-size:15px;display:flex;gap:6px;align-items:center}
.row .t span.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--mut);font-size:13px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.row .r{text-align:right;flex-shrink:0;font-size:13px;color:var(--ink2)}
.row.unread .t{font-weight:760}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.empty{padding:34px 18px;text-align:center;color:var(--mut);font-size:14px}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.load{padding:40px 0;text-align:center;color:var(--mut);font-size:14px}
.err{background:var(--red-t);color:var(--red-d);border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.note{background:#eef1ea;color:var(--ink2);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:12px 0;line-height:1.6}

/* 꼬리표 */
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;flex-shrink:0}
.p-red{background:var(--red-t);color:var(--red-d)} .p-amb{background:var(--amb-t);color:var(--amb)} .p-blue{background:var(--blue-t);color:var(--blue)}
.p-ok{background:var(--ok-t);color:var(--ok)} .p-grey{background:#eceee8;color:#6d7568}

/* 홈 바로가기 */
.quick{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.quick a{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-height:86px}
.quick a.main{background:var(--ink);border-color:var(--ink);color:#fff}
.quick a .n{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.quick a .l{font-size:13px;color:var(--mut)} .quick a.main .l{color:#c9d0c2}
.quick a .n.hot{color:var(--red)}
.quick a.main .n{font-size:18px;margin-top:auto}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--red);color:#fff;width:100%}
.btn:active{background:var(--red-d)} .btn[disabled]{opacity:.45;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn.ghost:active{background:#eef1ea}
.btn.dark{background:var(--ink)} .btn.sm{height:38px;font-size:14px;padding:0 14px;width:auto;border-radius:10px}
.btn.line{background:none;border:1px solid var(--red);color:var(--red)}
.btns{display:flex;gap:8px;margin-top:14px} .btns .btn{flex:1}

/* 입력 */
.f{margin:14px 0} .f>label{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin:0 0 6px 2px}
.in{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:16px}
textarea.in{height:auto;min-height:120px;padding:12px 14px;line-height:1.6;resize:vertical}
.in:focus{border-color:var(--ink2);outline:none}
.hint{font-size:12.5px;color:var(--mut);margin:6px 2px 0}
.sw{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)} .sw:first-child{border-top:0}
.sw span{flex:1} .sw small{display:block;color:var(--mut);font-size:12.5px}
.tg{appearance:none;width:46px;height:28px;border-radius:999px;background:#d6dbd0;position:relative;transition:background .15s;flex-shrink:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg:checked{background:var(--ok)} .tg:checked::after{left:21px}

/* 아래 탭 */
#pvbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(var(--safe-t) + 8px) 14px 8px;background:#232621;color:#fff;font-size:12.5px}
#pvbar span{flex:1;min-width:0}#pvbar b{color:#ffd9da}
#pvbar button,#pvbar a{border:1px solid #ffffff40;background:none;color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
@media (min-width:900px){#pvbar{margin-left:248px}}
body.pv-on #app{padding-top:0}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#tabs .in{max-width:560px;margin:0 auto;display:flex;height:var(--tab);border:0;padding:0;background:none;border-radius:0}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9aa293;text-decoration:none;font-size:11.5px;font-weight:600;position:relative}
#tabs a svg{width:24px;height:24px}
#tabs a.on{color:var(--ink)}
#tabs a .bd{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;display:grid;place-items:center;font-weight:700}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* 공지 본문 */
.art h2{font-size:21px;font-weight:780;letter-spacing:-.03em;margin:6px 4px 6px;line-height:1.35}
.art .meta{color:var(--mut);font-size:13px;margin:0 4px 14px;display:flex;gap:10px;flex-wrap:wrap}
.art .body{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;font-size:15.5px;line-height:1.75}
.files{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.files img,.files video{width:100%;border-radius:12px;display:block;background:#e9ece5}
.file{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.file small{color:var(--mut);font-size:12px}

/* 1:1 대화 */
.talk{margin-top:18px}
.talk .hd{font-size:14px;font-weight:700;margin:0 4px 8px;display:flex;justify-content:space-between}
.talk .hd small{color:var(--mut);font-weight:500}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.55}
.msg.store{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.hq{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg .w{display:block;font-size:11.5px;opacity:.7;margin-bottom:2px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--safe-b))}
.composer .in2{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:44px;max-height:120px;height:44px;border:1px solid var(--line);border-radius:22px;padding:10px 16px;resize:none;font-size:16px;line-height:1.4;background:var(--bg)}
.composer button{height:44px;padding:0 16px;border-radius:22px;background:var(--red);color:#fff;font-weight:700}
.composer button[disabled]{opacity:.4}

/* 발주 */
.seg{display:flex;background:#e7ebe2;border-radius:12px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;font-weight:650;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(31,39,27,.08)}
.cat-h{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 6px 8px}
.it{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .main{flex:1;min-width:0} .it .nm{font-weight:620;font-size:15px} .it .pr{font-size:13px;color:var(--mut)}
.it.on{background:#fbfcf9}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0;background:#fff}
.step button{width:38px;height:40px;font-size:20px;color:var(--ink2);display:grid;place-items:center}
.step button:active{background:#eef1ea}
.step input{width:44px;height:40px;border:0;text-align:center;font-weight:700;font-size:16px;background:none;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.it.on .step{border-color:var(--ink)}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + var(--safe-b));z-index:29;padding:10px 12px}
.cartbar .in2{max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;box-shadow:0 6px 20px rgba(31,39,27,.25)}
.cartbar .sum{flex:1;font-size:13px;color:#c9d0c2} .cartbar .sum b{display:block;color:#fff;font-size:18px;font-weight:800}
.cartbar .btn{width:auto;height:44px}
.steps{display:flex;margin:6px 0 2px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);position:relative;padding-top:20px}
.steps div::before{content:"";position:absolute;top:5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#d5dacf;z-index:1}
.steps div::after{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:#d5dacf}
.steps div:first-child::after{display:none}
.steps div.done{color:var(--ink);font-weight:650} .steps div.done::before,.steps div.done::after{background:var(--ok)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0} .kv span:first-child{color:var(--mut)} .kv b{font-weight:700}
.pay{padding:16px}
.pay .ttl{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:750;font-size:15px;margin-bottom:10px}
.pay dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14.5px}
.pay dt{color:var(--mut)} .pay dd{margin:0;font-weight:600}
.pay .amt{font-size:19px;font-weight:800;color:var(--red)}
.pay .acts{display:flex;gap:8px;margin-top:12px} .pay .acts .btn{flex:1}
.pay.ok{display:flex;align-items:center;gap:10px;color:var(--ok);font-weight:700}
/* 거래명세서 — 본사 엑셀 양식(하늘색 머리줄·가로선) 그대로 */
.stmt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px -4px 0;padding:4px}
.stmt{min-width:720px;background:#fff;color:#111;padding:26px 26px 22px;font-family:'Nanum Gothic','NanumGothic',var(--font,sans-serif);font-size:11px;line-height:1.45;border:1px solid var(--line);border-radius:6px}
.stmt+.stmt{margin-top:14px}
.stmt .shd{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.stmt .l h2{margin:0;font-size:29px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:flex-start;gap:14px}
.stmt .l h2 small{font-size:9px;font-weight:400;margin-top:4px}
.stmt .l .to{font-size:15.5px;margin:10px 0 6px 46px;display:flex;gap:34px}
.stmt .l .bk{display:flex;gap:46px;font-weight:800;font-size:11.5px;margin:4px 0}
.stmt .l .dt{font-weight:800;font-size:11.5px;margin:4px 0 6px}
.stmt .l .tot{display:flex;align-items:baseline;gap:96px;font-size:13px}
.stmt .l .tot b{font-size:19px;font-weight:400}
.stmt table{width:100%;border-collapse:collapse}
.stmt .sup td{padding:5px 4px;border-bottom:1px solid #222;font-size:10.5px;vertical-align:top}
.stmt .sup tr.h td{background:#b7dee8;font-weight:800;border-top:1px solid #222}
.stmt .sup td.k{width:62px}
.stmt .lines{margin-top:10px}
.stmt .lines th{background:#b7dee8;font-weight:800;text-align:right;padding:4px 2px;border-top:1px solid #222;border-bottom:1px solid #222;font-size:11px}
.stmt .lines th:first-child,.stmt .lines td:first-child{text-align:left}
.stmt .lines td{padding:3px 2px;text-align:right;font-size:11px;height:18px}
.stmt .lines tfoot td{background:#b7dee8;font-weight:800;border-top:1px solid #222;border-bottom:1px solid #222}
.stmt .ft{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.stmt .ft span:nth-child(2){margin-left:auto;margin-right:200px}
.stmt .paid{color:var(--ok);font-weight:700}
@media print{

.srch{display:flex;align-items:center;gap:8px;background:#eef0f3;border-radius:14px;padding:0 14px;height:46px;margin:18px 0 12px}
.srch svg{width:17px;height:17px;color:#8b95a1}
.srch input{flex:1;border:0;background:none;outline:0;font-size:15px;min-width:0}
.chips2{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:6px;scrollbar-width:none}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex-shrink:0;height:36px;padding:0 15px;border-radius:18px;background:#fff;color:#4e5968;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px #e5e8eb}
.chips2 button.on{background:#333d4b;color:#fff;box-shadow:none}
.chips2 button small{opacity:.7;margin-left:3px;font-weight:600}

/* 발주 화면 */
.qo{background:#fff;border-radius:22px;padding:20px 20px 18px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;margin-top:20px}
.qo .tx{flex:1}.qo .lb{display:inline-block;font-size:9.5px;font-weight:850;letter-spacing:.06em;color:#3182f6;background:#e8f3ff;border-radius:6px;padding:4px 7px}
.qo b{display:block;font-size:17px;line-height:1.4;margin:10px 0 4px;letter-spacing:-.04em}
.qo p{margin:0;color:#8b95a1;font-size:12.5px}
.qo .ill{width:64px;height:64px;border-radius:20px;background:#fff4e6;color:#d9822b;display:grid;place-items:center;flex-shrink:0}
.qo .ill svg{width:32px;height:32px;stroke-width:1.6}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:7px;height:56px;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:15.5px;text-decoration:none;margin:12px 0;box-shadow:0 8px 16px rgba(201,44,55,.18)}
.bigbtn:active{background:var(--red-d)}
.bigbtn svg{width:19px;height:19px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}
.stats2 div{background:#fff;border-radius:18px;padding:17px 16px;box-shadow:var(--shadow)}
.stats2 label{font-size:12px;color:#7b8796}.stats2 strong{display:block;font-size:30px;font-weight:800;letter-spacing:-.05em;margin:6px 0 8px;line-height:1.1}
.stats2 small{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px}
.stats2 .a small{background:#e8f3ff;color:#3182f6}.stats2 .b small{background:#f2f4f6;color:#6b7684}
.step{border:0;background:none;gap:6px}
.step button{width:34px;height:34px;border-radius:10px;background:#f2f4f6;font-size:19px;color:#333d4b}
.step input{width:40px;height:34px;font-size:16px}
.it{padding:14px 14px 14px 18px;border-top:1px solid #f2f4f6}

.steps div.done::before,.steps div.done::after{background:#3182f6}

.rhero::after{content:'麺';position:absolute;right:-4px;bottom:-34px;font-size:120px;font-weight:900;color:rgba(255,255,255,.05);transform:rotate(-14deg);font-family:serif}
.rhero small{color:#b2c7df;font-size:10.5px;letter-spacing:.12em;font-weight:800}
.rhero h2{font-size:21px;line-height:1.42;margin:11px 0 0;font-weight:800;letter-spacing:-.045em}
.rcards{display:flex;flex-direction:column;gap:10px}

.rcard .th{width:66px;height:66px;border-radius:16px;background:#fdf3e7;color:#d9822b;display:grid;place-items:center;flex-shrink:0}

.rcard small{color:#8b95a1;font-size:12px}
.rcard > svg.i{color:#b0b8c1}

.prof .av{width:58px;height:58px;border-radius:18px;background:#eef3f9;color:#4e5968;display:grid;place-items:center;flex-shrink:0}
.prof .av svg{width:28px;height:28px}
.prof b{font-size:18px;letter-spacing:-.04em}
.prof .rl{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:#3182f6;background:#e8f3ff;border-radius:6px;padding:3px 6px;vertical-align:3px}
.prof .id{font-size:13px;color:#6b7684;margin-top:3px}.prof .sm{font-size:12px;color:#8b95a1;margin-top:2px}
.kv2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-top:1px solid #f2f4f6;font-size:14px}
.kv2:first-child{border-top:0}.kv2 span{color:#4e5968}.kv2 b{font-weight:750}
.kv2 em{font-style:normal;font-size:11.5px;font-weight:800;color:#3182f6;background:#e8f3ff;border-radius:6px;padding:4px 8px}
.ntc{background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.ntc b{font-size:15px}.ntc p{color:#6b7684;font-size:13px;margin:5px 0 16px;line-height:1.6}
.foot2{text-align:center;color:#b0b8c1;font-size:10px;letter-spacing:.08em;margin:30px 0 6px;font-weight:650}

#tabs a svg{width:23px;height:23px}
#tabs a.on{color:var(--ink)}

}

function cleanErr(e){
  const m = String((e && (e.message || e.error_description)) || e || '');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  if (/JWT|jwt expired|refresh token/i.test(m)) return '로그인이 만료됐어요. 다시 로그인해 주세요.';
  return m || '처리하지 못했어요.';
}

function sheet(html){
  closeSheet();

  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;

  document.body.appendChild(bg); return bg.firstElementChild;
}
function closeSheet(){ const s = document.getElementById('sheet'); if (s) s.remove(); }
function confirmSheet(title, sub, okText, danger){
  return new Promise(res => {
    sheet(`<h3>${h(title)}</h3>${sub ? `<p class="sub">${h(sub)}</p>` : ''}

    $('#cf-no').onclick = () => { closeSheet(); res(false); };
    $('#cf-ok').onclick = () => { closeSheet(); res(true); };
  });
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('복사했어요'); }
  catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); toast('복사했어요'); }
}

/* 비공개 파일 주소 (1시간짜리) */
const URLC = {};
async function signed(bucket, paths){
  const need = paths.filter(p => !URLC[bucket + p]);
  if (need.length) {
    const { data, error } = await SB.storage.from(bucket).createSignedUrls(need, 3600);
    if (error) throw error;
    (data || []).forEach(d => { if (d.signedUrl) URLC[bucket + d.path] = d.signedUrl; });
  }
  return paths.map(p => URLC[bucket + p] || '');
}
async function filesHtml(bucket, files){
  if (!files || !files.length) return '';
  let urls = [];
  try { urls = await signed(bucket, files.map(f => f.path)); } catch (e) { return `<div class="note">첨부 파일을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</div>`; }
  return `<div class="files">${files.map((f, i) => {
    const u = urls[i], mime = f.mime || '', kind = f.kind || (mime.startsWith('image/') ? 'image' : mime.startsWith('video/') ? 'video' : 'file');
    const isImg = kind === 'image' || /\.(jpe?g|png|gif|webp|heic)$/i.test(f.name || f.path);
    const isVid = kind === 'video' || /\.(mp4|mov|webm|m4v)$/i.test(f.name || f.path);
    if (u && isImg) return `<a href="${h(u)}" target="_blank" rel="noopener"><img src="${h(u)}" alt="${h(f.name)}" loading="lazy"></a>`;
    if (u && isVid) return `<video src="${h(u)}" controls playsinline preload="metadata"></video>`;
    return `<a class="file" href="${h(u)}" target="_blank" rel="noopener">${ic('file')}<span>${h(f.name || '첨부 파일')}</span><small>${f.size ? kb(f.size) : ''}</small></a>`;
  }).join('')}</div>`;
}

    await start(data.session);

}

async function start(session){
  if (!session) return showLogin();
  const { data: p, error } = await SB.from('profiles').select('login_id,name,role,store_id,active,must_change').eq('id', session.user.id).maybeSingle();
  if (error) return showLogin(cleanErr(error));
  if (!p) { await SB.auth.signOut(); return showLogin('계정 정보가 등록되지 않았어요. 본사에 문의해 주세요.'); }
  if (!p.active) { await SB.auth.signOut(); return showLogin('사용이 중지된 계정이에요. 본사에 문의해 주세요.'); }
  S.me = { uid: session.user.id, id: p.login_id, name: p.name || p.login_id, role: p.role, storeId: p.store_id };
  if (p.role === 'admin' || p.role === 'hq') {   // 2026-11-16: 본사는 '점주 화면 미리보기'(읽기 전용)
    if (p.must_change) return showPw(true);
    S.preview = true; return pvStart();
  }
  if (p.role !== 'mst') return showBlocked();
  if (p.must_change) return showPw(true);
  enter();
}

  const old = document.querySelector('.composer'); if (old) old.remove();

    document.body.appendChild(c);
    const ta = $('#cm'), bt = $('#cms');
    ta.oninput = () => { bt.disabled = !ta.value.trim(); ta.style.height = '44px'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; };
    bt.onclick = async () => {

ROUTES['order-new'] = async (a, tok) => {
  setView(topbar('새 발주', '#orders') + loading());
  const items = await rpc('mst_items'); if (!live(tok)) return;
  S.items = items;
  Object.keys(S.cart).forEach(k => { if (!items.some(i => String(i.id) === k)) delete S.cart[k]; });
  const cats = [...new Set(items.map(i => i.cat || '기타'))];
  setView(topbar('새 발주', '#orders') + (items.length ? '<div class="catgrid">' + cats.map(c => `<div><div class="cat-h">${h(c)}</div><div class="list">${items.filter(i => (i.cat || '기타') === c).map(i => {
      const q = S.cart[i.id] || 0;
      return `<div class="it ${q ? 'on' : ''}" data-id="${i.id}"><div class="main"><div class="nm">${h(i.name)}</div>
        <div class="pr">${i.price ? won(i.price) + '원' : '단가 미정'}${i.unit ? ' / ' + h(i.unit) : ''}${i.memo ? ' · ' + h(i.memo) : ''}</div></div>
        <div class="step"><button data-d="-1" aria-label="빼기">−</button><input inputmode="numeric" pattern="[0-9]*" value="${q || ''}" placeholder="0" aria-label="${h(i.name)} 수량"><button data-d="1" aria-label="더하기">+</button></div></div>`;
    }).join('')}</div></div>`).join('') + '</div>' : '<div class="empty"><b>발주할 수 있는 품목이 없어요</b>본사에 문의해 주세요.</div>'), true);
  const v = view();
  v.onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; const row = b.closest('.it'); setQty(row, (S.cart[row.dataset.id] || 0) + (+b.dataset.d)); };
  v.oninput = e => { if (e.target.tagName !== 'INPUT') return; const row = e.target.closest('.it'); if (row) setQty(row, parseInt(e.target.value.replace(/\D/g, ''), 10) || 0, true); };
  cartBar();
};
function setQty(row, q, typing){
  q = Math.max(0, Math.min(9999, q)); const id = row.dataset.id;
  if (q) S.cart[id] = q; else delete S.cart[id];
  row.classList.toggle('on', !!q); if (!typing) row.querySelector('input').value = q || '';
  cartBar();
}
function cartTotals(){
  let n = 0, sum = 0, unknown = 0;
  for (const [id, q] of Object.entries(S.cart)) { const it = (S.items || []).find(i => String(i.id) === id); if (!it) continue; n++; if (it.price) sum += it.price * q; else unknown++; }
  return { n, sum, unknown };
}
function cartBar(){
  let b = document.querySelector('.cartbar');
  if (!b) { b = document.createElement('div'); b.className = 'cartbar'; document.body.appendChild(b); }
  const t = cartTotals();
  b.innerHTML = `<div class="in2"><div class="sum">${t.n ? `${t.n}개 품목${t.unknown ? ` · 단가 미정 ${t.unknown}` : ''}` : '수량을 넣어 주세요'}<b>${won(t.sum)}원</b></div>
    <button class="btn" id="cart-go" ${t.n ? '' : 'disabled'}>발주 확인</button></div>`;
  $('#cart-go').onclick = orderConfirm;
}
function orderConfirm(){
  const t = cartTotals();
  const lines = Object.entries(S.cart).map(([id, q]) => { const it = S.items.find(i => String(i.id) === id); return it ? { it, q } : null; }).filter(Boolean);
  sheet(`<h3>발주 확인</h3><p class="sub">본사가 확인하면 '접수 완료'로 바뀌고 알림이 가요.</p>
    <div class="list"><table class="items"><tbody>${lines.map(({ it, q }) => `<tr><td>${h(it.name)}</td><td class="q">${q}${h(it.unit ? ' ' + it.unit : '')}</td><td class="q">${it.price ? won(it.price * q) + '원' : '단가 미정'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>합계</td><td></td><td class="q">${won(t.sum)}원</td></tr></tfoot></table></div>
    ${t.unknown ? '<p class="hint">단가 미정 품목은 합계에서 빠져 있어요. 본사가 확인 후 정산해요.</p>' : ''}
    <div class="f"><label for="omemo">본사에 남길 말 (선택)</label><textarea class="in" id="omemo" maxlength="500" style="min-height:76px" placeholder="예: 금요일 전에 받고 싶어요"></textarea></div>
    <div id="oerr"></div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">더 고르기</button><button class="btn" id="osend">발주 넣기</button></div>`);
  $('#osend').onclick = async () => {
    const b = $('#osend'); b.disabled = true; b.textContent = '보내는 중...';
    try {
      const r = await rpc('mst_order_create', { p: { items: lines.map(({ it, q }) => ({ id: it.id, qty: q })), memo: $('#omemo').value } });
      S.cart = {}; closeSheet(); toast('발주를 넣었어요'); location.hash = '#order/' + r.id;
    } catch (e) { b.disabled = false; b.textContent = '발주 넣기'; $('#oerr').innerHTML = errBox(e); }
  };
}

const ua = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const inApp = /KAKAOTALK|NAVER\(|Instagram|FBAN|FBAV|Line\/|DaumApps/i.test(ua);
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; });

async function swReg(){ if (!('serviceWorker' in navigator)) return null; return (await navigator.serviceWorker.getRegistration('./')) || navigator.serviceWorker.register('sw.js', { scope: './' }); }
async function pushState(){
  if (inApp) return 'inapp';
  if (isIOS && !standalone()) return 'install';
  if (!pushOk()) return 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  const reg = await swReg(); const sub = reg && await reg.pushManager.getSubscription();
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function pushOn(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') throw new Error('알림이 허용되지 않았어요. 휴대폰 설정에서 알림을 허용해 주세요.');
  const reg = await navigator.serviceWorker.register('sw.js', { scope: './' }); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(CFG.vapid) });
  const j = sub.toJSON();
  await rpc('push_subscribe', { p: { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: ua.slice(0, 200) } });
}
async function pushOff(silent){
  if (!pushOk()) return;
  const reg = await navigator.serviceWorker.getRegistration('./'); const sub = reg && await reg.pushManager.getSubscription();
  if (!sub) return;
  try { await SB.rpc('push_unsubscribe', { p_endpoint: sub.endpoint }); } catch (e) {}
  await sub.unsubscribe(); if (!silent) toast('이 기기 알림을 껐어요');
}
async function pushRelink(){
  try { if (!pushOk() || Notification.permission !== 'granted') return; const reg = await swReg(); const sub = reg && await reg.pushManager.getSubscription();
    if (sub) { const j = sub.toJSON(); await rpc('push_subscribe', { p: { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: ua.slice(0, 200) } }); } } catch (e) {}
}
async function pushHint(){
  const el = $('#push-hint'); if (!el || !isMst() || S.preview) return;
  const st = await pushState();
  if (st === 'on' || st === 'unsupported' || localStorage.getItem('mst-push-later') === '1') return;
  const msg = st === 'install' ? '홈 화면에 추가하면 공지·발주 알림을 받을 수 있어요.' : st === 'inapp' ? '카카오톡·네이버 앱 안에서는 알림을 받을 수 없어요. 사파리나 크롬으로 열어 주세요.'
    : st === 'denied' ? '알림이 꺼져 있어요. 휴대폰 설정에서 이 앱의 알림을 허용해 주세요.' : '새 공지와 발주 진행을 알림으로 받아 보세요.';
  el.innerHTML = `<div class="note" style="display:flex;gap:10px;align-items:center"><span style="flex:1">${msg}</span>
    ${st === 'off' ? '<button class="btn sm dark" id="ph-on">알림 켜기</button>' : '<a class="btn sm ghost" href="#me" style="text-decoration:none">방법 보기</a>'}
    <button aria-label="닫기" style="color:var(--mut);padding:4px" onclick="localStorage.setItem('mst-push-later','1');this.closest('.note').remove()">✕</button></div>`;
  const b = $('#ph-on'); if (b) b.onclick = async () => { b.disabled = true; try { await pushOn(); toast('알림을 켰어요'); el.innerHTML = ''; } catch (e) { b.disabled = false; toast(cleanErr(e)); } };
}

<script>
'use strict';
/* ==========================================================
   관리 (관리자·본사): 파일 올리기 공통
   ========================================================== */
async function uploadFile(bucket, prefix, file){
  if (file.size > 52428800 && bucket === 'franchise-notice-files') throw new Error(`${file.name}: 50MB까지 올릴 수 있어요.`);
  if (file.size > 104857600) throw new Error(`${file.name}: 100MB까지 올릴 수 있어요.`);
  const dot = file.name.lastIndexOf('.'), ext = dot > 0 ? file.name.slice(dot).toLowerCase().replace(/[^.a-z0-9]/g, '') : '';
  const path = `${prefix}/${crypto.randomUUID()}/file${ext}`;
  const { error } = await SB.storage.from(bucket).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
  if (error) throw new Error(`${file.name}: 올리지 못했어요 (${cleanErr(error)})`);
  return { name: file.name, path, size: file.size, mime: file.type || '' };
}
async function removeFiles(bucket, paths){ if (paths && paths.length) { try { await SB.storage.from(bucket).remove(paths); } catch (e) {} } }
function fileListHtml(files){
  return files.map((f, i) => `<div class="up">${ic('file')}<span>${h(f.name)}</span><small style="color:var(--mut)">${kb(f.size)}</small><button data-rm="${i}">빼기</button></div>`).join('');
}
function bindFiles(boxSel, inputSel, bucket, prefix, state){
  const box = $(boxSel), inp = $(inputSel);
  const draw = () => { box.innerHTML = fileListHtml(state.files); };
  box.onclick = e => { const b = e.target.closest('[data-rm]'); if (!b) return; const f = state.files.splice(+b.dataset.rm, 1)[0];
    if (f && state.fresh.includes(f.path)) { removeFiles(bucket, [f.path]); state.fresh = state.fresh.filter(p => p !== f.path); } draw(); };
  inp.onchange = async () => {
    const list = [...inp.files]; inp.value = '';
    for (const file of list) {
      const tmp = { name: file.name + ' (올리는 중...)', size: file.size, path: '' }; state.files.push(tmp); draw();
      try { const f = await uploadFile(bucket, prefix, file); Object.assign(tmp, f); state.fresh.push(f.path); }
      catch (e) { state.files.splice(state.files.indexOf(tmp), 1); toast(cleanErr(e)); }
      draw();
    }
  };
  draw();
}

    <div class="list">${us.length ? us.map(u => `<button class="row" data-u="${u.uid}"><div class="main"><div class="t"><span class="tx" style="${u.active ? '' : 'color:var(--mut)'}">${h(u.store || '매장 없음')} · ${h(u.name)}</span></div>
      <div class="s"><span>${h(u.id)}</span>${u.phone ? `<span>${h(u.phone)}</span>` : ''}<span>${h(u.created)} 생성</span></div></div>
      ${!u.active ? '<span class="pill p-grey">사용 중지</span>' : u.first ? '<span class="pill p-amb">첫 로그인 전</span>' : '<span class="pill p-ok">사용 중</span>'}</button>`).join('')
      : '<div class="empty"><b>아직 가맹점주 계정이 없어요</b>매장을 골라 첫 계정을 만들어 보세요.</div>'}</div>`);
  $('#unew').onclick = () => userSheet(stores, null);
  view().onclick = e => { const b = e.target.closest('[data-u]'); if (b) userSheet(stores, us.find(u => u.uid === b.dataset.u)); };
};
function userSheet(stores, u){
  const opts = stores.map(s => `<option value="${s.id}" ${u && u.store_id === s.id ? 'selected' : ''}>${h(s.name)}${s.type === '직영' ? ' (직영)' : ''}${s.accounts ? ` · 계정 ${s.accounts}` : ''}</option>`).join('');
  if (!u) {
    const pw = tempPw();
    sheet(`<h3>계정 만들기</h3>
      <div class="f"><label for="us">매장</label><select class="in" id="us"><option value="">매장을 골라 주세요</option>${opts}</select></div>
      <div class="f"><label for="uid">아이디</label><input class="in" id="uid" autocapitalize="none" spellcheck="false" placeholder="예: sangmu"><p class="hint">영문 소문자·숫자로 2~30자. 매장 이름을 영어로 쓰면 기억하기 쉬워요.</p></div>
      <div class="f"><label for="un">점주 이름</label><input class="in" id="un"></div>
      <div class="f"><label for="up">연락처 (선택)</label><input class="in" id="up" inputmode="tel"></div>
      <div class="f"><label for="upw">임시 비밀번호</label><input class="in" id="upw" value="${pw}"></div>
      <div id="uerr"></div><div class="btns"><button class="btn ghost" onclick="closeSheet()">닫기</button><button class="btn" id="usave">만들기</button></div>`);
    $('#us').onchange = e => { const s = stores.find(x => x.id === +e.target.value); if (s && !$('#un').value && s.owner) $('#un').value = s.owner; };
    $('#usave').onclick = async () => {
      const b = $('#usave'), id = $('#uid').value.trim().toLowerCase(), p = $('#upw').value;
      b.disabled = true;
      try { await adminUsers({ action: 'create', store_id: +$('#us').value || null, login_id: id, name: $('#un').value, phone: $('#up').value, password: p });
        guideSheet('계정을 만들었어요', id, p); }
      catch (e) { b.disabled = false; $('#uerr').innerHTML = errBox(e); }
    };
    return;
  }
  sheet(`<h3>${h(u.store || '')} · ${h(u.name)}</h3><p class="sub">아이디 ${h(u.id)}${u.first ? ' · 아직 첫 로그인을 하지 않았어요' : ''}${u.stopped ? ` · ${h(u.stopped)} 사용 중지` : ''}</p>
    <div class="f"><label for="us">매장</label><select class="in" id="us">${opts}</select></div>
    <div class="f"><label for="un">점주 이름</label><input class="in" id="un" value="${h(u.name)}"></div>
    <div class="f"><label for="up">연락처</label><input class="in" id="up" inputmode="tel" value="${h(u.phone)}"></div>
    <div id="uerr"></div><button class="btn" id="usave">저장</button>
    <div class="btns"><button class="btn ghost" id="ureset">비밀번호 초기화</button><button class="btn ghost" id="uact" style="color:${u.active ? 'var(--red)' : 'var(--ok)'}">${u.active ? '사용 중지' : '다시 사용'}</button></div>`);
  $('#usave').onclick = async () => {
    const b = $('#usave'); b.disabled = true;
    try { await adminUsers({ action: 'update', id: u.uid, name: $('#un').value, phone: $('#up').value, store_id: +$('#us').value }); closeSheet(); toast('저장했어요'); route(); }
    catch (e) { b.disabled = false; $('#uerr').innerHTML = errBox(e); }
  };
  $('#ureset').onclick = async () => {
    if (!await confirmSheet('비밀번호를 초기화할까요?', '새 임시 비밀번호를 만들어요. 점주님은 다음 로그인 때 비밀번호를 다시 정해요.', '초기화')) return;
    const p = tempPw();
    try { await adminUsers({ action: 'reset_password', id: u.uid, password: p }); guideSheet('비밀번호를 초기화했어요', u.id, p); } catch (e) { toast(cleanErr(e)); }
  };
  $('#uact').onclick = async () => {
    if (u.active && !await confirmSheet('이 계정을 사용 중지할까요?', '바로 로그인할 수 없게 돼요. 폐점·양도 때 써 주세요. 다시 사용으로 되돌릴 수 있어요.', '사용 중지', true)) return;
    try { await adminUsers({ action: 'set_active', id: u.uid, active: !u.active }); closeSheet(); toast(u.active ? '사용 중지했어요' : '다시 사용하게 했어요'); route(); } catch (e) { toast(cleanErr(e)); }
  };
}

/* ==========================================================
   시작
   ========================================================== */
(async function boot(){
  if (!SB) { document.getElementById('app').innerHTML = '<div class="auth"><div style="padding:60px 0">' + errBox('서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.') + '</div></div>'; return; }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'open') { const u = new URL(e.data.url), q = u.searchParams, go = q.get('go'), id = q.get('id');
        location.hash = go === 'notice' && id ? '#notice/' + id : go === 'order' && id ? '#order/' + id : '#' + (go || 'home'); }
    });
  }
  SB.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; showLogin(); } });
  let alive = false; try { alive = sessionStorage.getItem('mst-alive') === '1'; } catch (e) {}
  if (LS.get('mst-keep') === '0' && !alive) { try { await SB.auth.signOut({ scope: 'local' }); } catch (e) {} }
  const { data } = await SB.auth.getSession();
  await start(data && data.session);
})();
</script>
</body>
